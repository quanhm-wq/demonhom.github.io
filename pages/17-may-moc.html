  const TBM = (function () {
    const KEY = 'erp_tbm_nhomowin_v1';
    function read() { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } }
    function write(d) { try { localStorage.setItem(KEY, JSON.stringify(d)); } catch (e) {} }
    function list(col) { return read()[col] || []; }
    function seed(col, arr) {
      const d = read();
      if (!d['_s_' + col]) { d[col] = (arr || []).concat(d[col] || []); d['_s_' + col] = 1; write(d); }
      return list(col);
    }
    function add(col, rec) { const d = read(); d[col] = d[col] || []; d[col].unshift(rec); write(d); return rec; }
    function put(col, id, patch) {
      const d = read(); d[col] = d[col] || [];
      const i = d[col].findIndex(x => x.id === id);
      if (i >= 0) { d[col][i] = Object.assign({}, d[col][i], patch); write(d); return d[col][i]; }
      return null;
    }
    function nextId(col, prefix, floor) {
      let max = Number(floor) || 0;
      list(col).forEach(r => { const m = new RegExp('^' + prefix + '-(\\d+)$').exec(r.id || ''); if (m) max = Math.max(max, parseInt(m[1], 10)); });
      return prefix + '-' + ('000' + (max + 1)).slice(-4);
    }
    return { list, seed, add, put, nextId };
  })();

  const MACHINES = TBM.seed('may', SEED_MAY);

  const NGUOI = ['KT Nguyễn Văn Khánh — Kỹ sư cơ khí – nhôm hệ', 'KT Phạm Quốc Hùng — Thợ bảo trì', 'Lê Minh Tuấn — Tổ trưởng cắt CNC', 'Trần Văn Đức — Thợ ép góc – lắp ráp', 'Đỗ Văn Thành — Thợ uốn vòm', 'Cơ khí WEIKE Việt Nam (NCC hãng)'];

  const STATUS = {
    run:    { cls: 'badge-moss', label: 'Đang chạy' },
    maint:  { cls: 'badge-orange', label: 'Đang bảo trì' },
    broken: { cls: 'status-overdue', label: 'Đang hỏng' },
    idle:   { cls: 'badge-steel', label: 'Chờ việc' }
  };

  let curGrp = 'all', curId = null, editing = false;

  const oeeOf = (m) => Math.round((Number(m.oeeA) || 0) * (Number(m.oeeP) || 0) * (Number(m.oeeQ) || 0) * 100);
  const perMonth = (m) => (Number(m.cost) || 0) / ((Number(m.lifeYears) || 1) * 12);
  const accumOf = (m) => Math.min(perMonth(m) * (Number(m.monthsUsed) || 0), Number(m.cost) || 0);
  const remainOf = (m) => (Number(m.cost) || 0) - accumOf(m);
  const pctOf = (m) => (Number(m.cost) ? Math.round(accumOf(m) / Number(m.cost) * 100) : 0);

  /* ============================ Bảng ============================ */
  function getRows() {
    const q = ($('#searchInput').value || '').toLowerCase().trim();
    return MACHINES.filter(m => (curGrp === 'all' || m.grp === curGrp) &&
      (!q || (m.id + ' ' + m.name + ' ' + m.brand + ' ' + m.model + ' ' + m.team).toLowerCase().includes(q)));
  }
  function warnCell(m) {
    if (!m.warn || !m.warn.text) return '<span class="warn-none">—</span>';
    return `<span class="${m.warn.t === 'bad' ? 'warn-bad' : 'warn-good'}">${esc(m.warn.text)}</span>`;
  }
  function renderStats() {
    $('#stTotal').textContent = MACHINES.length;
    $('#stRun').textContent = MACHINES.filter(m => m.status === 'run').length;
    $('#stDown').textContent = MACHINES.filter(m => m.status === 'broken' || m.status === 'maint').length;
    const avg = MACHINES.length ? Math.round(MACHINES.reduce((s, m) => s + oeeOf(m), 0) / MACHINES.length * 10) / 10 : 0;
    $('#stOee').innerHTML = String(avg).replace('.', ',') + '<small>%</small>';
    document.querySelectorAll('[data-c]').forEach(el => {
      const g = el.dataset.c;
      el.textContent = g === 'all' ? MACHINES.length : MACHINES.filter(m => m.grp === g).length;
    });
  }
  function renderTable() {
    const rows = getRows();
    $('#machineBody').innerHTML = rows.map(m => {
      const st = STATUS[m.status] || STATUS.idle;
      const oee = oeeOf(m);
      return `
      <tr data-id="${esc(m.id)}">
        <td><a href="17-may-moc.html?may=${encodeURIComponent(m.id)}" class="lnk">${esc(m.id)}</a><div class="cell-sub">${esc(m.model)}</div></td>
        <td><div class="cell-main" style="font-weight:500">${esc(m.name)}</div><div class="cell-mini">${esc(m.brand)} · NSX ${esc(m.yearMfg)}</div></td>
        <td><div style="font-size:12.5px">${esc(m.team)}</div><div class="cell-mini">${esc(m.loc)}</div></td>
        <td class="center"><span class="badge ${st.cls}">${esc(m.statusLabel || st.label)}</span></td>
        <td class="num">${fmt(m.runH)} h</td>
        <td class="num"><span class="oee-n" style="color:${oee >= 85 ? '#1f6b3a' : oee < 65 ? '#8a1f1f' : 'var(--ink)'}">${oee}%</span></td>
        <td>${warnCell(m)}</td>
        <td class="center">
          <button class="row-act" data-act="open" title="Mở bản ghi máy"><i data-lucide="arrow-right" style="width:14px;height:14px"></i></button>
        </td>
      </tr>`;
    }).join('');
    if (!rows.length) $('#machineBody').innerHTML = `<tr><td colspan="8" style="text-align:center;color:var(--ash);padding:32px">Không có máy phù hợp.</td></tr>`;
    if (window.lucide) lucide.createIcons();
    $('#machineBody').querySelectorAll('tr[data-id]').forEach(tr => {
      tr.addEventListener('click', (e) => {
        if (e.target.closest('a.lnk')) { e.preventDefault(); }
        openDrawer(tr.dataset.id);
      });
    });
  }

  /* ============================ Drawer ============================ */
  function row(k, field, val, opts) {
    opts = opts || {};
    const cls = (opts.cls ? ' ' + opts.cls : '') + (opts.wide ? '' : '');
    if (editing && field && !opts.ro) {
      return `<div class="cfg-row${opts.wide ? ' wide' : ''}"><span class="k">${k}</span>
        <input class="input" data-f="${field}" data-num="${opts.num ? 1 : 0}" value="${esc(val)}" /></div>`;
    }
    return `<div class="cfg-row${opts.wide ? ' wide' : ''}"><span class="k">${k}</span><span class="v${cls}">${opts.html ? val : esc(val)}</span></div>`;
  }

  function groupTech(m) {

    </div>`;

    const od = Number(m.overdueDays) || 0;
    return `<div class="sec-card">
      <div class="sec-h"><div class="t"><i data-lucide="calendar-clock" style="width:15px;height:15px"></i> 3 · Thông tin bảo trì</div>
        <span class="x">${od > 0 ? 'Quá hạn' : 'Đúng lịch'}</span></div>
      <div class="config-grid">

        ${row('Tổng chi phí BT + SC năm', 'maintCostYear', editing ? m.maintCostYear : fmt(m.maintCostYear) + ' ₫', { num: true, cls: 'accent' })}
        ${row('Lịch sử phiếu bảo trì', '', bt, { ro: true, html: true, wide: true })}
        ${row('Lịch sử phiếu sửa chữa', '', sc, { ro: true, html: true, wide: true })}

  function groupCap(m) {

        <div class="oee-item"><div class="l">Hiệu suất (P)</div><div class="v">${p}%</div></div>
        <div class="oee-item"><div class="l">Chất lượng (Q)</div><div class="v">${q}%</div></div>
        <div class="oee-item tot"><div class="l">OEE = A×P×Q</div><div class="v">${oee}%</div></div>
      </div>
      <div class="config-grid">
        ${row('Công suất thiết kế', 'designCap', m.designCap)}
        ${row('Công suất thực tế', 'actualCap', m.actualCap)}
        ${row('Giờ chạy trong tháng', 'runH', editing ? m.runH : fmt(m.runH) + ' h', { num: true })}
        ${row('Giờ dừng trong tháng', 'stopH', editing ? m.stopH : (fmt(m.stopH) + ' h · ' + fmt(lossMoney) + ' ₫'), { num: true, cls: (Number(m.stopH) || 0) > 24 ? 'bad' : '' })}
        ${row('Sản lượng luỹ kế', 'cumOutput', m.cumOutput)}
        ${row('Tỷ lệ phế do máy', 'scrapRate', editing ? m.scrapRate : String(m.scrapRate).replace('.', ',') + ' %', { num: true, cls: (Number(m.scrapRate) || 0) > 2 ? 'bad' : 'good' })}
        ${row('Khả dụng A (0–1)', 'oeeA', m.oeeA, { num: true, ro: !editing })}
        ${row('Hiệu suất P (0–1)', 'oeeP', m.oeeP, { num: true, ro: !editing })}
        ${row('Chất lượng Q (0–1)', 'oeeQ', m.oeeQ, { num: true, ro: !editing })}
      </div>
      <div class="info-note"><i data-lucide="alert-triangle" style="width:14px;height:14px"></i>
        <span>Giờ dừng máy quy ra thiệt hại theo đơn giá <b>${fmt(GIO_MAY)} ₫/giờ máy</b> — tháng này <b>${fmt(lossMoney)} ₫</b>.</span>
      </div>
    </div>`;
  }

  function openDrawer(id) {
    curId = id; editing = false;
    renderDrawer();
    $('#drawer').classList.add('is-open');
  }
  function closeDrawer() { $('#drawer').classList.remove('is-open'); editing = false; }

  function renderDrawer() {
    const m = MACHINES.find(x => x.id === curId); if (!m) return;
    const st = STATUS[m.status] || STATUS.idle;
    const idx = MACHINES.findIndex(x => x.id === curId);

    $('#drawerPanel').innerHTML = `
      <div class="dr-hero">
        <div class="top-bar">
          <div class="tag-row"><span class="stage-chip">${esc((m.statusLabel || st.label).toUpperCase())}</span><span style="opacity:.4">·</span><span>${esc(m.team)}</span></div>
          <div style="display:flex;gap:4px;align-items:center">
            <button class="nav-btn" data-nav="prev"><i data-lucide="chevron-up" style="width:14px;height:14px"></i></button>
            <span style="font-family:var(--ff-mono);font-size:10px;color:rgba(245,241,232,.55);margin:0 4px">${idx + 1}/${MACHINES.length}</span>
            <button class="nav-btn" data-nav="next"><i data-lucide="chevron-down" style="width:14px;height:14px"></i></button>
            <button class="nav-btn" data-nav="close"><i data-lucide="x" style="width:14px;height:14px"></i></button>
          </div>
        </div>
        <h2>${esc(m.id)}</h2>
        <div class="sub">${esc(m.name)} · ${esc(m.brand)} ${esc(m.model)}</div>
        <div class="meta-line">
          <span>Serial <b>${esc(m.serial)}</b></span><span class="sep">·</span>
          <span>Vào SX <b>${esc(m.startDate)}</b></span><span class="sep">·</span>
          <span>Còn lại <b>${fmt(remainOf(m))} ₫</b></span><span class="sep">·</span>
          <span>OEE <b>${oeeOf(m)}%</b></span>
        </div>
        <div class="actions">
          ${editing
            ? `<button class="primary" data-act="save" data-no-interact="true"><i data-lucide="check" style="width:13px;height:13px"></i> Lưu</button>
               <button data-act="cancel" data-no-interact="true"><i data-lucide="x" style="width:13px;height:13px"></i> Huỷ</button>`
            : `<button class="primary" data-act="edit" data-no-interact="true"><i data-lucide="pencil" style="width:13px;height:13px"></i> Sửa</button>
               <button data-act="preview" data-no-interact="true"><i data-lucide="eye" style="width:13px;height:13px"></i> Xem trước lý lịch máy</button>
               <button data-act="print" data-no-interact="true"><i data-lucide="printer" style="width:13px;height:13px"></i> In lý lịch máy</button>`}
        </div>
      </div>

      <div class="dr-body">
        ${groupTech(m)}
        ${groupDepr(m)}
        ${groupMaint(m)}
        ${groupCap(m)}

        <div class="sec-card">
          <div class="sec-h"><div class="t"><i data-lucide="send" style="width:15px;height:15px"></i> Đẩy việc sang phòng ban kế tiếp</div></div>
          <div class="act-bar">
            <button class="btn btn-primary" data-act="newbt" data-no-interact="true"><i data-lucide="clipboard-check" style="width:14px;height:14px"></i> + Tạo phiếu bảo trì</button>
            <button class="btn btn-yellow" data-act="newsc" data-no-interact="true"><i data-lucide="hammer" style="width:14px;height:14px"></i> + Tạo phiếu sửa chữa</button>
            <button class="btn btn-secondary" data-act="gobt" data-no-interact="true"><i data-lucide="arrow-right" style="width:14px;height:14px"></i> Sang màn phiếu bảo trì</button>
            <button class="btn btn-secondary" data-act="gosc" data-no-interact="true"><i data-lucide="arrow-right" style="width:14px;height:14px"></i> Sang màn sửa chữa</button>
          </div>
          <div class="info-note"><i data-lucide="link" style="width:14px;height:14px"></i>
            <span>Phiếu tạo ở đây là bản ghi thật, mở ngay được tại <a href="18-phieu-bao-tri.html" class="lnk">Phiếu bảo trì</a> / <a href="19-sua-chua.html" class="lnk">Sửa chữa</a>; linh kiện thay thế lấy từ <a href="20-vat-tu-may.html" class="lnk">Vật tư – linh kiện</a>.</span>
          </div>
        </div>
      </div>`;
    if (window.lucide) lucide.createIcons();

    const P = $('#drawerPanel');
    P.querySelectorAll('[data-nav]').forEach(b => b.addEventListener('click', () => {
      const a = b.dataset.nav;
      if (a === 'close') return closeDrawer();
      let i = MACHINES.findIndex(x => x.id === curId);
      i = a === 'next' ? (i + 1) % MACHINES.length : (i - 1 + MACHINES.length) % MACHINES.length;
      openDrawer(MACHINES[i].id);
    }));
    P.querySelectorAll('[data-act]').forEach(b => b.addEventListener('click', (e) => {
      e.stopPropagation();
      const a = b.dataset.act;
      if (a === 'edit') { editing = true; renderDrawer(); }
      else if (a === 'cancel') { editing = false; renderDrawer(); }
      else if (a === 'save') saveEdits();
      else if (a === 'preview') printProfile(m, false);
      else if (a === 'print') printProfile(m, true);
      else if (a === 'newbt') openTicketForm(m, 'bt');
      else if (a === 'newsc') openTicketForm(m, 'sc');
      else if (a === 'gobt') window.location.href = '18-phieu-bao-tri.html?may=' + encodeURIComponent(m.id);
      else if (a === 'gosc') window.location.href = '19-sua-chua.html?may=' + encodeURIComponent(m.id);
    }));
  }

  function saveEdits() {
    const m = MACHINES.find(x => x.id === curId); if (!m) return;
    $('#drawerPanel').querySelectorAll('[data-f]').forEach(inp => {
      const f = inp.dataset.f; if (!f) return;
      let v = inp.value;
      if (inp.dataset.num === '1') { const n = parseFloat(String(v).replace(/\./g, '').replace(',', '.')); v = isNaN(n) ? 0 : n; }
      m[f] = v;
    });
    TBM.put('may', m.id, m);
    editing = false;
    renderDrawer(); renderTable(); renderStats();
    ERPInteract.showToast('Đã lưu bản ghi máy <b>' + esc(m.id) + '</b>', 'success');
  }

  /* ================== Tạo phiếu bảo trì / sửa chữa ================== */
  function openTicketForm(m, kind) {
    const isBT = kind === 'bt';
    const loai = isBT
      ? ['Bảo trì định kỳ theo giờ chạy', 'Bảo trì định kỳ theo tháng', 'Bảo trì đột xuất', 'Bảo trì sau sửa chữa', 'Vệ sinh – bôi trơn – căn chỉnh']
      : ['Sửa chữa cơ khí', 'Sửa chữa điện – điều khiển', 'Sửa chữa thuỷ lực – khí nén', 'Thay thế linh kiện hỏng', 'Đại tu máy'];
    const vtGoi = isBT
      ? 'Lưỡi cắt hợp kim Ø500 84T · dầu thuỷ lực · mỡ bôi trơn'
      : 'Bơm thuỷ lực · vòng bi trục chính · dây curoa';
    ERPInteract.showModal({
      title: (isBT ? 'Tạo phiếu bảo trì · ' : 'Tạo phiếu sửa chữa · ') + m.id,
      body: `
        <div class="mm-wide">
          <p style="color:var(--ash);font-size:12.5px">Máy <b>${esc(m.id)} — ${esc(m.name)}</b> · ${esc(m.team)}. Phiếu tạo ra là bản ghi thật ở màn ${isBT ? 'Phiếu bảo trì' : 'Sửa chữa'}.</p>
          <div class="form-grid" style="margin-top:10px">
            <div class="fld"><label>Loại việc</label><select class="input" id="tkType">${loai.map(x => `<option>${x}</option>`).join('')}</select></div>
            <div class="fld"><label>Mức độ</label><select class="input" id="tkSev"><option>Nhẹ</option><option selected>Trung bình</option><option>Nghiêm trọng</option></select></div>
            <div class="fld"><label>Người thực hiện</label><select class="input" id="tkBy">${NGUOI.map(x => `<option>${x}</option>`).join('')}</select></div>
            <div class="fld"><label>Ngày dự kiến</label><input class="input" id="tkDate" value="25/05/2026" placeholder="dd/mm/yyyy" /></div>
            <div class="fld full"><label>Mô tả công việc</label><textarea class="input" id="tkDesc" placeholder="${isBT ? 'VD: Thay lưỡi cắt Ø500, căn chỉnh góc cắt 45°, tra mỡ ray dẫn hướng...' : 'VD: Bơm thuỷ lực yếu, áp không lên 16 MPa, thay bơm và lọc dầu...'}"></textarea></div>
            <div class="fld full"><label>Vật tư – linh kiện dự kiến</label><input class="input" id="tkParts" value="${vtGoi}" /></div>
          </div>
        </div>`,
      primaryText: isBT ? 'Tạo phiếu bảo trì' : 'Tạo phiếu sửa chữa',
      secondaryText: 'Huỷ',
      onPrimary: () => {
        const g = (id) => (document.getElementById(id) || {}).value || '';
        const col = isBT ? 'bt' : 'sc';
        const id = TBM.nextId(col, isBT ? 'BT' : 'SC', isBT ? 122 : 43);
        const rec = {
          id: id, may: m.id, mayName: m.name, team: m.team,
          type: g('tkType'), sev: g('tkSev'), by: g('tkBy'), planDate: g('tkDate'),
          desc: g('tkDesc') || (isBT ? 'Bảo trì theo lịch định kỳ.' : 'Sửa chữa theo đề nghị của tổ sản xuất.'),
          partsNote: g('tkParts'), status: 'pending',
          startAt: '', endAt: '', stopHours: 0, laborCost: 0, parts: [], result: '',
          createdFrom: '17-may-moc'
        };
        TBM.add(col, rec);
        const mm = MACHINES.find(x => x.id === m.id);
        if (mm) { (isBT ? (mm.btIds = mm.btIds || []) : (mm.scIds = mm.scIds || [])).unshift(id); TBM.put('may', mm.id, mm); }
        const page = isBT ? '18-phieu-bao-tri.html?bt=' : '19-sua-chua.html?sc=';
        ERPInteract.showToast('Đã tạo <a href="' + page + encodeURIComponent(id) + '" class="lnk">' + id + '</a> — bấm để mở', 'success', 6000);
        renderDrawer();
      }
    });
  }

  /* ============================ Bản in lý lịch máy ============================ */
  function profileHtml(m) {
    const pair = (k, v) => '<tr><td>' + k + '</td><td>' + v + '</td></tr>';
    return ERPPrint.docHead() +
      '<div class="pdoc"><div class="pdoc-title">LÝ LỊCH MÁY</div>' +
      '<div class="pdoc-sub">Mã máy: ' + esc(m.id) + ' · ' + esc(m.name) + '</div>' +
      '<table class="pdoc-rows">' +
        pair('<b>1. THÔNG TIN KỸ THUẬT</b>', '') +
        pair('Tên máy / Hãng', esc(m.name) + ' — ' + esc(m.brand)) +
        pair('Model / Serial', esc(m.model) + ' / ' + esc(m.serial)) +
        pair('Năm SX · Nước SX', esc(m.yearMfg) + ' · ' + esc(m.country)) +
        pair('Công suất điện · điện áp', esc(m.kw) + ' kW · ' + esc(m.volt)) +
        pair('Kích thước · trọng lượng', esc(m.dim) + ' · ' + esc(m.weight)) +
        pair('Thông số đặc thù', esc(m.spec)) +
        pair('Vị trí / Tổ', esc(m.loc) + ' · ' + esc(m.team)) +
        pair('<b>2. KHẤU HAO</b>', '') +
        pair('Nguyên giá', fmt(m.cost) + ' ₫') +
        pair('Ngày đưa vào sử dụng', esc(m.startDate)) +
        pair('Số năm KH · phương pháp', esc(m.lifeYears) + ' năm · đường thẳng') +
        pair('Khấu hao / tháng', fmt(perMonth(m)) + ' ₫') +
        pair('Khấu hao luỹ kế', fmt(accumOf(m)) + ' ₫ (' + pctOf(m) + '%)') +
        pair('Giá trị còn lại', '<b>' + fmt(remainOf(m)) + ' ₫</b>') +
        pair('<b>3. BẢO TRÌ</b>', '') +
        pair('Chu kỳ bảo trì', fmt(m.cycleHours) + ' giờ chạy hoặc ' + esc(m.cycleMonths) + ' tháng') +
        pair('Bảo trì gần nhất', esc(m.lastMaint)) +
        pair('Bảo trì kế tiếp', esc(m.nextMaint) + ((Number(m.overdueDays) || 0) > 0 ? ' (quá hạn ' + m.overdueDays + ' ngày)' : '')) +
        pair('Phiếu bảo trì', (m.btIds || []).join(', ') || '—') +
        pair('Phiếu sửa chữa', (m.scIds || []).join(', ') || '—') +
        pair('Chi phí BT + SC trong năm', fmt(m.maintCostYear) + ' ₫') +
        pair('<b>4. NĂNG LỰC SẢN XUẤT</b>', '') +
        pair('Công suất thiết kế / thực tế', esc(m.designCap) + ' / ' + esc(m.actualCap)) +
        pair('Giờ chạy / giờ dừng tháng', fmt(m.runH) + ' h / ' + fmt(m.stopH) + ' h') +
        pair('OEE = A × P × Q', Math.round(m.oeeA * 100) + '% × ' + Math.round(m.oeeP * 100) + '% × ' + Math.round(m.oeeQ * 100) + '% = <b>' + oeeOf(m) + '%</b>') +
        pair('Sản lượng luỹ kế', esc(m.cumOutput)) +
        pair('Tỷ lệ phế do máy', String(m.scrapRate).replace('.', ',') + ' %') +
      '</table>' +
      '<div class="pdoc-note">Lý lịch máy lập theo hồ sơ thiết bị của nhà máy cửa nhôm Owin — Số 8 Giá Ngự, Xâm Xuyên, Thường Tín, TP Hà Nội.</div>' +
      '<div class="pdoc-sign">' +
        '<div><b>NGƯỜI LẬP</b><i>(Ký, ghi rõ họ tên)</i><div class="sp"></div></div>' +
        '<div><b>TỔ TRƯỞNG KỸ THUẬT</b><i>(Ký, ghi rõ họ tên)</i><div class="sp"></div></div>' +
        '<div><b>GIÁM ĐỐC NHÀ MÁY</b><i>(Ký, ghi rõ họ tên)</i><div class="sp"></div></div>' +
      '</div></div>';
  }
  function printProfile(m, direct) {
    const body = profileHtml(m);
    if (direct) ERPPrint.printHtml('Lý lịch máy ' + m.id, body);
    else ERPPrint.preview({ title: 'Xem trước · Lý lịch máy ' + m.id, printTitle: 'Lý lịch máy ' + m.id, bodyHtml: body });
  }

  /* ============================ Thêm máy ============================ */
  function openAdd() {
    ERPInteract.showModal({
      title: 'Thêm máy mới',
      body: `<div class="mm-wide"><div class="form-grid">
          <div class="fld"><label>Mã máy</label><input class="input" id="nmId" placeholder="VD: CAT-03" /></div>
          <div class="fld"><label>Tên máy</label><input class="input" id="nmName" placeholder="Máy cắt nhôm 2 đầu lưỡi Ø500 WEIKE" /></div>
          <div class="fld"><label>Tổ / bộ phận</label><select class="input" id="nmGrp"><option value="cat">Tổ cắt CNC</option><option value="ep">Tổ ép góc – lắp ráp</option><option value="ht">Tổ hoàn thiện – đóng kiện</option><option value="pt">Phụ trợ</option></select></div>
          <div class="fld"><label>Hãng sản xuất</label><input class="input" id="nmBrand" placeholder="WEIKE (Trung Quốc)" /></div>
          <div class="fld"><label>Model</label><input class="input" id="nmModel" placeholder="LJZ2-CNC-500×4200" /></div>
          <div class="fld"><label>Nguyên giá (₫)</label><input class="input" id="nmCost" type="number" placeholder="385000000" /></div>
        </div></div>`,
      primaryText: 'Thêm máy', secondaryText: 'Huỷ',
      onPrimary: () => {
        const g = (id) => (document.getElementById(id) || {}).value || '';
        const id = g('nmId') || ('MAY-' + (MACHINES.length + 1));
        const grp = g('nmGrp') || 'cat';
        const rec = Object.assign({}, SEED_MAY[0], {
          id: id, name: g('nmName') || 'Máy mới', grp: grp, team: GRP_LABEL[grp], loc: 'Nhà máy Thường Tín',
          brand: g('nmBrand') || 'WEIKE (Trung Quốc)', model: g('nmModel') || '—', serial: '—',
          cost: Number(g('nmCost')) || 0, monthsUsed: 0, btIds: [], scIds: [], warn: null,
          status: 'idle', statusLabel: 'Chờ việc', runH: 0, stopH: 0, maintCostYear: 0
        });
        MACHINES.unshift(rec); TBM.add('may', rec);
        renderTable(); renderStats();
        ERPInteract.showToast('Đã thêm máy <b>' + esc(id) + '</b> vào danh mục', 'success');
      }
    });
  }

  /* ============================ Wire ============================ */
  document.addEventListener('erp:ready', () => {
    renderStats(); renderTable();
    $('#searchInput').addEventListener('input', renderTable);
    $('#segTabs').querySelectorAll('.seg').forEach(s => s.addEventListener('click', () => {
      curGrp = s.dataset.grp;
      $('#segTabs').querySelectorAll('.seg').forEach(x => x.classList.toggle('active', x === s));
      renderTable();
    }));
    $('#btnAdd').addEventListener('click', openAdd);
    $('#drawerOv').addEventListener('click', closeDrawer);
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !document.querySelector('.erp-print-overlay')) closeDrawer(); });

    const q = new URLSearchParams(location.search).get('may');
    if (q && MACHINES.some(m => m.id === q)) openDrawer(q);
  });
</script>
</body>
</html>
