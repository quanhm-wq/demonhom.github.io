  const TBM = (function () {
    const KEY = 'erp_tbm_nhomowin_v1';
    function read() { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } }
    function write(d) { try { localStorage.setItem(KEY, JSON.stringify(d)); } catch (e) {} }
    function list(col) { return read()[col] || []; }
    function seed(col, arr) {
      const d = read();
      if (!d['_s_' + col]) { d[col] = (arr || []).concat(d[col] || []); d['_s_' + col] = 1; write(d); }
      return list(col);
    }
    function add(col, rec) { const d = read(); d[col] = d[col] || []; d[col].unshift(rec); write(d); return rec; }
    function put(col, id, patch) {
      const d = read(); d[col] = d[col] || [];
      const i = d[col].findIndex(x => x.id === id);
      if (i >= 0) { d[col][i] = Object.assign({}, d[col][i], patch); write(d); return d[col][i]; }
      return null;
    }
    function nextId(col, prefix) {
      let max = 0;
      list(col).forEach(r => { const m = new RegExp('^' + prefix + '-(\\d+)$').exec(r.id || ''); if (m) max = Math.max(max, parseInt(m[1], 10)); });
      return prefix + '-' + ('000' + (max + 1)).slice(-4);
    }
    return { list, seed, add, put, nextId };
  })();

      el.textContent = k === 'all' ? LIST.length : LIST.filter(r => r.status === k).length;

  function warnCell(r) {

  function row(k, field, val, opts) {
    opts = opts || {};
    if (editing && field && !opts.ro) {
      if (opts.pairs) return `<div class="cfg-row${opts.wide ? ' wide' : ''}"><span class="k">${k}</span><select class="input" data-f="${field}">${opts.pairs.map(o => `<option value="${esc(o[0])}"${String(o[0]) === String(val) ? ' selected' : ''}>${esc(o[1])}</option>`).join('')}</select></div>`;

      if (opts.area) return `<div class="cfg-row wide"><span class="k">${k}</span><textarea class="input" data-f="${field}">${esc(val)}</textarea></div>`;
      return `<div class="cfg-row${opts.wide ? ' wide' : ''}"><span class="k">${k}</span><input class="input" data-f="${field}" data-num="${opts.num ? 1 : 0}" value="${esc(val)}" /></div>`;

        <td class="r">${fmt(v.price)}</td>
        <td class="r"><b>${fmt(v.price * (Number(p.qty) || 0))}</b></td>
      </tr>`;

    return `<table class="p-tbl">
      <thead><tr><th>Mã LK</th><th>Tên linh kiện</th><th class="r">SL</th><th>ĐVT</th><th class="r">Đơn giá</th><th class="r">Thành tiền</th></tr></thead>

    if (window.lucide) lucide.createIcons();

    const P = $('#drawerPanel');
    P.querySelectorAll('[data-nav]').forEach(b => b.addEventListener('click', () => {
      const a = b.dataset.nav;
      if (a === 'close') return closeDrawer();
      let i = LIST.findIndex(x => x.id === curId);
      i = a === 'next' ? (i + 1) % LIST.length : (i - 1 + LIST.length) % LIST.length;
      openDrawer(LIST[i].id);
    }));
    P.querySelectorAll('[data-act]').forEach(b => b.addEventListener('click', (e) => {
      e.stopPropagation();
      const a = b.dataset.act;
      if (a === 'edit') { editing = true; renderDrawer(); }
      else if (a === 'cancel') { editing = false; renderDrawer(); }
      else if (a === 'save') saveEdits();
      else if (a === 'preview') printTicket(r, false);
      else if (a === 'print') printTicket(r, true);
      else if (a === 'dnm') makeDNM(r);
      else if (a === 'addpart') addPart(r);
      else if (a === 'gomay') window.location.href = '17-may-moc.html?may=' + encodeURIComponent(r.may);
      else if (a === 'gobt') window.location.href = '18-phieu-bao-tri.html?may=' + encodeURIComponent(r.may);
    }));
  }

  function saveEdits() {
    const r = LIST.find(x => x.id === curId); if (!r) return;
    $('#drawerPanel').querySelectorAll('[data-f]').forEach(inp => {
      const f = inp.dataset.f; if (!f) return;
      let v = inp.value;
      if (inp.dataset.num === '1') { const n = parseFloat(String(v).replace(/\./g, '').replace(',', '.')); v = isNaN(n) ? 0 : n; }
      r[f] = v;
    });
    $('#drawerPanel').querySelectorAll('[data-pq]').forEach(inp => {
      const i = +inp.dataset.pq;
      const n = parseFloat(String(inp.value).replace(',', '.'));
      if (r.parts && r.parts[i]) r.parts[i].qty = isNaN(n) ? 0 : n;
    });
    const mm = MAY_OPTS.find(m => m.id === r.may); if (mm) r.mayName = mm.name;
    TBM.put('sc', r.id, r);
    editing = false;
    renderDrawer(); renderTable(); renderStats();
    ERPInteract.showToast('Đã lưu phiếu sửa chữa <b>' + esc(r.id) + '</b>', 'success');
  }

  function addPart(r) {
    ERPInteract.showModal({
      title: 'Thêm linh kiện đã thay · ' + r.id,
      body: `<div class="form-grid">
        <div class="fld"><label>Linh kiện</label><select class="input" id="apCode">${VTM.map(v => `<option value="${v.code}">${v.code} — ${esc(v.name)}</option>`).join('')}</select></div>
        <div class="fld"><label>Số lượng</label><input class="input" id="apQty" value="1" /></div>
      </div>`,
      primaryText: 'Thêm', secondaryText: 'Huỷ',
      onPrimary: () => {
        const code = (document.getElementById('apCode') || {}).value;
        const qty = parseFloat(String((document.getElementById('apQty') || {}).value || '1').replace(',', '.')) || 1;
        r.parts = r.parts || []; r.parts.push({ code: code, qty: qty });
        TBM.put('sc', r.id, r); renderDrawer(); renderTable(); renderStats();
        ERPInteract.showToast('Đã thêm <b>' + esc(code) + '</b> vào phiếu', 'success');
      }
    });
  }

  function makeDNM(r) {
    const parts = r.parts || [];
    if (!parts.length) { ERPInteract.showToast('Phiếu chưa có linh kiện để đề nghị mua.', 'warning'); return; }
    ERPInteract.showModal({
      title: 'Đề nghị mua linh kiện · ' + r.id,
      body: `<div class="mm-wide">
        <p style="color:var(--ash);font-size:12.5px">Tạo đề nghị mua linh kiện phục vụ sửa chữa máy <b>${esc(r.may)}</b> (phiếu ${esc(r.id)}).</p>
        ${parts.map((p, i) => { const v = vtmOf(p.code); return `<label style="display:flex;align-items:center;gap:8px;padding:7px 0;font-size:13px;border-bottom:1px solid var(--rule-hair)">
          <input type="checkbox" checked data-dnm="${i}" /> <b>${esc(v.name)}</b>
          <span style="font-family:var(--ff-mono);font-size:10.5px;color:var(--ash-2)">${esc(v.code)}</span>
          <span style="margin-left:auto;color:var(--ash)">${String(p.qty).replace('.', ',')} ${esc(v.unit)} · ${fmt(v.price)} ₫</span></label>`; }).join('')}
      </div>`,
      primaryText: 'Tạo đề nghị mua', secondaryText: 'Huỷ',
      onPrimary: () => {
        const lines = [];
        document.querySelectorAll('[data-dnm]').forEach(cb => {
          if (!cb.checked) return;
          const p = parts[+cb.dataset.dnm]; const v = vtmOf(p.code);
          lines.push({ code: v.code, name: v.name, unit: v.unit, qty: Number(p.qty) || 1, price: v.price, supplier: 'Cơ khí WEIKE Việt Nam' });
        });
        if (!lines.length) { ERPInteract.showToast('Chưa chọn linh kiện nào.', 'warning'); return; }
        let id = 'DNM-2026-000';
        if (window.ERPPurchase && ERPPurchase.create) {
          id = ERPPurchase.create({ from: 'Kỹ thuật máy · Sửa chữa', ref: r.id, note: 'Linh kiện sửa chữa máy ' + r.may + ' (' + r.id + ' · ' + r.errCode + ')', lines: lines }).id;
        }
        ERPInteract.showToast('Đã tạo <a href="13-de-xuat-mua.html?dnm=' + encodeURIComponent(id) + '" class="lnk">' + id + '</a> — bấm để mở', 'success', 6000);
      }
    });
  }

  function ticketHtml(r) {
    const pair = (k, v) => '<tr><td>' + k + '</td><td>' + v + '</td></tr>';
    const items = (r.parts || []).map((p, i) => {
      const v = vtmOf(p.code);
      return '<tr><td class="c">' + (i + 1) + '</td><td>' + esc(v.code) + '</td><td>' + esc(v.name) + '</td><td class="c">' + esc(v.unit) + '</td><td class="r">' + String(p.qty).replace('.', ',') + '</td><td class="r">' + fmt(v.price) + '</td><td class="r">' + fmt(v.price * (Number(p.qty) || 0)) + '</td></tr>';
    }).join('');
    return ERPPrint.docHead() +
      '<div class="pdoc"><div class="pdoc-title">BIÊN BẢN SỬA CHỮA MÁY</div>' +
      '<div class="pdoc-sub">Số: ' + esc(r.id) + ' · Máy ' + esc(r.may) + ' — ' + esc(r.mayName) + '</div>' +
      '<table class="pdoc-rows">' +
        pair('Máy / Tổ', esc(r.may) + ' — ' + esc(r.mayName) + ' · ' + esc(r.team)) +
        pair('Bộ phận hỏng · mã lỗi', esc(r.part) + ' · ' + esc(r.errCode)) +
        pair('Mức độ', esc(r.sev)) +
        pair('Người báo hỏng · thời điểm', esc(r.reportBy) + ' · ' + esc(r.reportAt)) +
        pair('Người thực hiện', esc(r.by)) +
        pair('Bắt đầu / kết thúc', esc(r.startAt || '—') + ' → ' + esc(r.endAt || '—')) +
        pair('Triệu chứng', esc(r.symptom)) +
        pair('Nguyên nhân &amp; phương án', esc(r.cause)) +
        pair('Ảnh hưởng sản xuất', esc(r.impact)) +
        pair('Giờ dừng máy', String(Number(r.stopHours) || 0).replace('.', ',') + ' h × ' + fmt(GIO_MAY) + ' ₫/h = <b>' + fmt(stopMoney(r)) + ' ₫</b>') +
        pair('Chi phí nhân công', fmt(r.laborCost) + ' ₫') +
        pair('Tiền linh kiện', fmt(partsCost(r)) + ' ₫') +
        pair('<b>TỔNG CHI PHÍ</b>', '<b>' + fmt(totalCost(r)) + ' ₫</b>') +
        pair('Kết quả nghiệm thu', esc(r.result || 'Chưa nghiệm thu')) +
      '</table>' +
      (items ? '<table class="pdoc-items"><thead><tr><th>#</th><th>Mã LK</th><th>Tên linh kiện</th><th>ĐVT</th><th>SL</th><th>Đơn giá</th><th>Thành tiền</th></tr></thead><tbody>' + items + '</tbody></table>' : '') +
      '<div class="pdoc-note">Biên bản lập tại nhà máy cửa nhôm Owin — Số 8 Giá Ngự, Xâm Xuyên, Thường Tín, TP Hà Nội.</div>' +
      '<div class="pdoc-sign">' +
        '<div><b>NGƯỜI SỬA CHỮA</b><i>(Ký, ghi rõ họ tên)</i><div class="sp"></div></div>' +
        '<div><b>TỔ TRƯỞNG SẢN XUẤT</b><i>(Ký, ghi rõ họ tên)</i><div class="sp"></div></div>' +
        '<div><b>PHỤ TRÁCH KỸ THUẬT</b><i>(Ký, ghi rõ họ tên)</i><div class="sp"></div></div>' +
      '</div></div>';
  }
  function printTicket(r, direct) {
    const body = ticketHtml(r);
    if (direct) ERPPrint.printHtml('Biên bản sửa chữa ' + r.id, body);
    else ERPPrint.preview({ title: 'Xem trước · Biên bản sửa chữa ' + r.id, printTitle: 'Biên bản sửa chữa ' + r.id, bodyHtml: body });
  }

  function openCreate() {
    ERPInteract.showModal({
      title: 'Tạo phiếu sửa chữa',
      body: `<div class="mm-wide"><div class="form-grid">
          <div class="fld"><label>Máy</label><select class="input" id="ncMay">${MAY_OPTS.map(m => `<option value="${m.id}">${m.id} — ${esc(m.name)}</option>`).join('')}</select></div>
          <div class="fld"><label>Bộ phận hỏng</label><input class="input" id="ncPart" placeholder="VD: Bơm thuỷ lực & lọc dầu" /></div>
          <div class="fld"><label>Mã lỗi</label><select class="input" id="ncErr">${LOI.map(x => `<option value="${x.split(' — ')[0]}">${esc(x)}</option>`).join('')}</select></div>
          <div class="fld"><label>Mức độ</label><select class="input" id="ncSev"><option>Nhẹ</option><option selected>Trung bình</option><option>Nghiêm trọng</option></select></div>
          <div class="fld"><label>Người thực hiện</label><select class="input" id="ncBy">${NGUOI.map(n => `<option>${esc(n)}</option>`).join('')}</select></div>
          <div class="fld"><label>Ngày dự kiến</label><input class="input" id="ncDate" value="25/05/2026" /></div>
          <div class="fld full"><label>Triệu chứng hỏng</label><textarea class="input" id="ncSym" placeholder="Mô tả hiện tượng quan sát được..."></textarea></div>
          <div class="fld full"><label>Vật tư – linh kiện dự kiến</label><input class="input" id="ncParts" value="Bơm thuỷ lực · vòng bi trục chính · dây curoa" /></div>
        </div></div>`,
      primaryText: 'Tạo phiếu', secondaryText: 'Huỷ',
      onPrimary: () => {
        const g = (id) => (document.getElementById(id) || {}).value || '';
        const may = g('ncMay'); const mm = MAY_OPTS.find(m => m.id === may) || { name: '' };
        const id = TBM.nextId('sc', 'SC');
        const rec = { id: id, may: may, mayName: mm.name, team: '', part: g('ncPart') || 'Chưa xác định', errCode: g('ncErr'), sev: g('ncSev'),
          by: g('ncBy'), reportBy: g('ncBy'), reportAt: g('ncDate'), startAt: '', endAt: '', stopHours: 0, laborCost: 0, parts: [],
          symptom: g('ncSym') || 'Đang chờ kiểm tra hiện trạng.', cause: '', impact: '', result: '', partsNote: g('ncParts'), status: 'pending', warn: null };
        LIST.unshift(rec); TBM.add('sc', rec);
        renderTable(); renderStats();
        ERPInteract.showToast('Đã tạo <a href="19-sua-chua.html?sc=' + encodeURIComponent(id) + '" class="lnk">' + id + '</a> — bấm để mở', 'success', 6000);
      }
    });
  }

  document.addEventListener('erp:ready', () => {
    renderStats(); renderTable();
    $('#searchInput').addEventListener('input', renderTable);
    $('#segTabs').querySelectorAll('.seg').forEach(s => s.addEventListener('click', () => {
      curSt = s.dataset.st;
      $('#segTabs').querySelectorAll('.seg').forEach(x => x.classList.toggle('active', x === s));
      renderTable();
    }));
    $('#btnAdd').addEventListener('click', openCreate);
    $('#drawerOv').addEventListener('click', closeDrawer);
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !document.querySelector('.erp-print-overlay')) closeDrawer(); });

    const p = new URLSearchParams(location.search);
    const sc = p.get('sc'), may = p.get('may');
    if (sc && LIST.some(r => r.id === sc)) openDrawer(sc);
    else if (may) { $('#searchInput').value = may; renderTable(); }
  });
</script>
</body>
</html>
