  const TBM = (function () {
    const KEY = 'erp_tbm_nhomowin_v1';
    function read() { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } }
    function write(d) { try { localStorage.setItem(KEY, JSON.stringify(d)); } catch (e) {} }
    function list(col) { return read()[col] || []; }
    function seed(col, arr) {
      const d = read();
      if (!d['_s_' + col]) { d[col] = (arr || []).concat(d[col] || []); d['_s_' + col] = 1; write(d); }
      return list(col);
    }
    function add(col, rec) { const d = read(); d[col] = d[col] || []; d[col].unshift(rec); write(d); return rec; }
    function put(col, id, patch) {
      const d = read(); d[col] = d[col] || [];
      const i = d[col].findIndex(x => x.id === id);
      if (i >= 0) { d[col][i] = Object.assign({}, d[col][i], patch); write(d); return d[col][i]; }
      return null;
    }
    function nextId(col, prefix) {
      let max = 0;
      list(col).forEach(r => { const m = new RegExp('^' + prefix + '-(\\d+)$').exec(r.id || ''); if (m) max = Math.max(max, parseInt(m[1], 10)); });
      return prefix + '-' + ('000' + (max + 1)).slice(-4);
    }
    return { list, seed, add, put, nextId };
  })();

  let curSt = 'all', curId = null, editing = false;

  /* ============================ Bảng ============================ */
  function renderStats() {
    $('#stTotal').textContent = LIST.length;
    $('#stOpen').textContent = LIST.filter(r => r.status !== 'done').length;
    const h = LIST.reduce((s, r) => s + (Number(r.stopHours) || 0), 0);

    document.querySelectorAll('[data-c]').forEach(el => {
      const k = el.dataset.c;
      el.textContent = k === 'all' ? LIST.length : LIST.filter(r => r.status === k).length;
    });
  }
  function warnCell(r) {
    if (!r.warn || !r.warn.text) return '<span class="warn-none">—</span>';
    return `<span class="${r.warn.t === 'bad' ? 'warn-bad' : 'warn-good'}">${esc(r.warn.text)}</span>`;
  }
  function renderTable() {
    const q = ($('#searchInput').value || '').toLowerCase().trim();

      const st = ST[r.status] || ST.pending;

        <td><div class="cell-main">${esc(r.id)}</div><div class="cell-sub">${esc(r.planDate)}</div></td>

      if (e.target.closest('a.lnk')) return;
      openDrawer(tr.dataset.id);
    }));
  }

  /* ============================ Drawer ============================ */
  function row(k, field, val, opts) {
    opts = opts || {};
    if (editing && field && !opts.ro) {
      if (opts.pairs) return `<div class="cfg-row${opts.wide ? ' wide' : ''}"><span class="k">${k}</span><select class="input" data-f="${field}">${opts.pairs.map(o => `<option value="${esc(o[0])}"${String(o[0]) === String(val) ? ' selected' : ''}>${esc(o[1])}</option>`).join('')}</select></div>`;
      if (opts.sel) return `<div class="cfg-row${opts.wide ? ' wide' : ''}"><span class="k">${k}</span><select class="input" data-f="${field}">${opts.sel.map(o => `<option${String(o) === String(val) ? ' selected' : ''}>${esc(o)}</option>`).join('')}</select></div>`;
      if (opts.area) return `<div class="cfg-row wide"><span class="k">${k}</span><textarea class="input" data-f="${field}">${esc(val)}</textarea></div>`;
      return `<div class="cfg-row${opts.wide ? ' wide' : ''}"><span class="k">${k}</span><input class="input" data-f="${field}" data-num="${opts.num ? 1 : 0}" value="${esc(val)}" /></div>`;
    }
    return `<div class="cfg-row${opts.wide ? ' wide' : ''}"><span class="k">${k}</span><span class="v${opts.cls ? ' ' + opts.cls : ''}">${opts.html ? val : esc(val)}</span></div>`;
  }

  function partsTable(r) {
    const rows = (r.parts || []).map((p, i) => {
      const v = vtmOf(p.code);
      return `<tr>
        <td><a href="20-vat-tu-may.html?vtm=${encodeURIComponent(v.code)}" class="lnk">${esc(v.code)}</a></td>
        <td>${esc(v.name)}</td>
        <td class="r">${editing ? `<input class="input" data-pq="${i}" value="${esc(p.qty)}" style="width:70px;text-align:right;padding:4px 6px;font-size:12px" />` : String(p.qty).replace('.', ',')}</td>
        <td>${esc(v.unit)}</td>
        <td class="r">${fmt(v.price)}</td>
        <td class="r"><b>${fmt(v.price * (Number(p.qty) || 0))}</b></td>
      </tr>`;
    }).join('');
    return `<table class="p-tbl">
      <thead><tr><th>Mã LK</th><th>Tên linh kiện</th><th class="r">SL</th><th>ĐVT</th><th class="r">Đơn giá</th><th class="r">Thành tiền</th></tr></thead>
      <tbody>${rows || '<tr><td colspan="6" style="color:var(--ash);padding:12px 8px">Chưa ghi nhận linh kiện thay thế.</td></tr>'}</tbody>
      <tfoot><tr><td colspan="5" class="r">Cộng tiền linh kiện</td><td class="r">${fmt(partsCost(r))} ₫</td></tr></tfoot>
    </table>`;
  }

  function openDrawer(id) { curId = id; editing = false; renderDrawer(); $('#drawer').classList.add('is-open'); }

    const r = LIST.find(x => x.id === curId); if (!r) return;

    const idx = LIST.findIndex(x => x.id === curId);

            <button class="nav-btn" data-nav="prev"><i data-lucide="chevron-up" style="width:14px;height:14px"></i></button>
            <span style="font-family:var(--ff-mono);font-size:10px;color:rgba(245,241,232,.55);margin:0 4px">${idx + 1}/${LIST.length}</span>
            <button class="nav-btn" data-nav="next"><i data-lucide="chevron-down" style="width:14px;height:14px"></i></button>

          <span>Kế hoạch <b>${esc(r.planDate)}</b></span><span class="sep">·</span>
          <span>Dừng máy <b>${String(Number(r.stopHours) || 0).replace('.', ',')} h</b></span><span class="sep">·</span>
          <span>Tổng chi phí <b>${fmt(totalCost(r))} ₫</b></span>
        </div>
        <div class="actions">
          ${editing
            ? `<button class="primary" data-act="save" data-no-interact="true"><i data-lucide="check" style="width:13px;height:13px"></i> Lưu</button>
               <button data-act="cancel" data-no-interact="true"><i data-lucide="x" style="width:13px;height:13px"></i> Huỷ</button>`
            : `<button class="primary" data-act="edit" data-no-interact="true"><i data-lucide="pencil" style="width:13px;height:13px"></i> Sửa</button>
               <button data-act="preview" data-no-interact="true"><i data-lucide="eye" style="width:13px;height:13px"></i> Xem trước</button>
               <button data-act="print" data-no-interact="true"><i data-lucide="printer" style="width:13px;height:13px"></i> In phiếu bảo trì</button>`}
        </div>
      </div>

      <div class="dr-body">
        <div class="sec-card">
          <div class="sec-h"><div class="t"><i data-lucide="clipboard-list" style="width:15px;height:15px"></i> Thông tin phiếu</div><span class="x">${esc(r.id)}</span></div>
          <div class="config-grid">
            ${row('Máy', 'may', editing ? r.may : `<a href="17-may-moc.html?may=${encodeURIComponent(r.may)}" class="lnk">${esc(r.may)}</a> · ${esc(r.mayName)}`, { html: true, sel: MAY_OPTS.map(m => m.id), wide: true })}
            ${row('Loại việc', 'type', r.type)}
            ${row('Mức độ', 'sev', r.sev, { sel: ['Nhẹ', 'Trung bình', 'Nghiêm trọng'] })}
            ${row('Người thực hiện', 'by', r.by, { sel: NGUOI, wide: true })}
            ${row('Tổ / bộ phận', 'team', r.team)}
            ${row('Ngày kế hoạch', 'planDate', r.planDate)}
            ${row('Thời gian bắt đầu', 'startAt', r.startAt || '—')}
            ${row('Thời gian kết thúc', 'endAt', r.endAt || '—')}
            ${row('Trạng thái', 'status', editing ? r.status : st.label, { pairs: [['pending', 'Chờ thực hiện'], ['doing', 'Đang thực hiện'], ['done', 'Hoàn thành']] })}
            ${row('Nội dung công việc', 'desc', r.desc, { area: true, wide: true })}
          </div>
        </div>

        <div class="sec-card">
          <div class="sec-h"><div class="t"><i data-lucide="timer-off" style="width:15px;height:15px"></i> Giờ dừng máy &amp; thiệt hại</div><span class="x">185.000 ₫/h máy</span></div>
          <div class="config-grid">
            ${row('Giờ dừng máy', 'stopHours', r.stopHours, { num: true, cls: (Number(r.stopHours) || 0) > 8 ? 'bad' : 'good' })}
            ${row('Thiệt hại giờ máy', '', fmt(stopMoney(r)) + ' ₫', { ro: true, cls: stopMoney(r) > 1500000 ? 'bad' : '' })}
            ${row('Chi phí nhân công', 'laborCost', editing ? r.laborCost : fmt(r.laborCost) + ' ₫', { num: true })}
            ${row('Đơn giá giờ công', '', fmt(GIO_CONG) + ' ₫/h', { ro: true })}
          </div>
          <div class="info-note"><i data-lucide="alert-triangle" style="width:14px;height:14px"></i>
            <span>Thiệt hại dừng máy = <b>${String(Number(r.stopHours) || 0).replace('.', ',')} h</b> × <b>${fmt(GIO_MAY)} ₫/h</b> = <b>${fmt(stopMoney(r))} ₫</b> (glossary đơn giá quy đổi thiệt hại).</span>
          </div>
        </div>

        <div class="sec-card">
          <div class="sec-h"><div class="t"><i data-lucide="package" style="width:15px;height:15px"></i> Linh kiện đã thay</div>
            <span class="x">${(r.parts || []).length} dòng</span></div>
          ${partsTable(r)}
          ${editing ? `<div class="act-bar"><button class="btn btn-sm btn-secondary" data-act="addpart" data-no-interact="true"><i data-lucide="plus" style="width:13px;height:13px"></i> Thêm linh kiện</button></div>` : ''}
        </div>

        <div class="sec-card">
          <div class="sec-h"><div class="t"><i data-lucide="receipt" style="width:15px;height:15px"></i> Tổng hợp chi phí &amp; nghiệm thu</div></div>
          <div class="config-grid">
            ${row('Tiền linh kiện', '', fmt(partsCost(r)) + ' ₫', { ro: true })}
            ${row('Chi phí nhân công', '', fmt(r.laborCost) + ' ₫', { ro: true })}
            ${row('Thiệt hại dừng máy', '', fmt(stopMoney(r)) + ' ₫', { ro: true })}
            ${row('Tổng chi phí', '', '<span class="money-big">' + fmt(totalCost(r)) + ' ₫</span>', { ro: true, html: true })}

          <div class="act-bar">
            <button class="btn btn-yellow" data-act="dnm" data-no-interact="true"><i data-lucide="clipboard-plus" style="width:14px;height:14px"></i> → Đề nghị mua linh kiện</button>
            <button class="btn btn-secondary" data-act="gomay" data-no-interact="true"><i data-lucide="cog" style="width:14px;height:14px"></i> Mở bản ghi máy ${esc(r.may)}</button>
          </div>
        </div>
      </div>`;
    if (window.lucide) lucide.createIcons();

    const P = $('#drawerPanel');
    P.querySelectorAll('[data-nav]').forEach(b => b.addEventListener('click', () => {
      const a = b.dataset.nav;
      if (a === 'close') return closeDrawer();
      let i = LIST.findIndex(x => x.id === curId);
      i = a === 'next' ? (i + 1) % LIST.length : (i - 1 + LIST.length) % LIST.length;
      openDrawer(LIST[i].id);
    }));
    P.querySelectorAll('[data-act]').forEach(b => b.addEventListener('click', (e) => {
      e.stopPropagation();
      const a = b.dataset.act;
      if (a === 'edit') { editing = true; renderDrawer(); }
      else if (a === 'cancel') { editing = false; renderDrawer(); }
      else if (a === 'save') saveEdits();
      else if (a === 'preview') printTicket(r, false);
      else if (a === 'print') printTicket(r, true);
      else if (a === 'dnm') makeDNM(r);
      else if (a === 'addpart') addPart(r);
      else if (a === 'gomay') window.location.href = '17-may-moc.html?may=' + encodeURIComponent(r.may);
    }));
  }

  function saveEdits() {
    const r = LIST.find(x => x.id === curId); if (!r) return;
    $('#drawerPanel').querySelectorAll('[data-f]').forEach(inp => {
      const f = inp.dataset.f; if (!f) return;
      let v = inp.value;
      if (inp.dataset.num === '1') { const n = parseFloat(String(v).replace(/\./g, '').replace(',', '.')); v = isNaN(n) ? 0 : n; }
      r[f] = v;
    });
    $('#drawerPanel').querySelectorAll('[data-pq]').forEach(inp => {
      const i = +inp.dataset.pq;
      const n = parseFloat(String(inp.value).replace(',', '.'));
      if (r.parts && r.parts[i]) r.parts[i].qty = isNaN(n) ? 0 : n;
    });
    const mm = MAY_OPTS.find(m => m.id === r.may); if (mm) r.mayName = mm.name;
    TBM.put('bt', r.id, r);
    editing = false;
    renderDrawer(); renderTable(); renderStats();
    ERPInteract.showToast('Đã lưu phiếu bảo trì <b>' + esc(r.id) + '</b>', 'success');
  }

  function addPart(r) {
    ERPInteract.showModal({
      title: 'Thêm linh kiện đã thay · ' + r.id,
      body: `<div class="form-grid">
        <div class="fld"><label>Linh kiện</label><select class="input" id="apCode">${VTM.map(v => `<option value="${v.code}">${v.code} — ${esc(v.name)}</option>`).join('')}</select></div>
        <div class="fld"><label>Số lượng</label><input class="input" id="apQty" value="1" /></div>
      </div>`,
      primaryText: 'Thêm', secondaryText: 'Huỷ',
      onPrimary: () => {
        const code = (document.getElementById('apCode') || {}).value;
        const qty = parseFloat(String((document.getElementById('apQty') || {}).value || '1').replace(',', '.')) || 1;
        r.parts = r.parts || []; r.parts.push({ code: code, qty: qty });
        TBM.put('bt', r.id, r); renderDrawer(); renderTable(); renderStats();
        ERPInteract.showToast('Đã thêm <b>' + esc(code) + '</b> vào phiếu', 'success');
      }
    });
  }

  /* ================ Đề nghị mua linh kiện (DNM thật) ================ */
  function makeDNM(r) {
    const parts = r.parts || [];
    if (!parts.length) { ERPInteract.showToast('Phiếu chưa có linh kiện để đề nghị mua.', 'warning'); return; }
    ERPInteract.showModal({
      title: 'Đề nghị mua linh kiện · ' + r.id,
      body: `<div class="mm-wide">
        <p style="color:var(--ash);font-size:12.5px">Tạo đề nghị mua cho các linh kiện đã dùng ở phiếu <b>${esc(r.id)}</b> (máy ${esc(r.may)}) để bù tồn kho.</p>
        ${parts.map((p, i) => { const v = vtmOf(p.code); return `<label style="display:flex;align-items:center;gap:8px;padding:7px 0;font-size:13px;border-bottom:1px solid var(--rule-hair)">
          <input type="checkbox" checked data-dnm="${i}" /> <b>${esc(v.name)}</b>
          <span style="font-family:var(--ff-mono);font-size:10.5px;color:var(--ash-2)">${esc(v.code)}</span>
          <span style="margin-left:auto;color:var(--ash)">${String(p.qty).replace('.', ',')} ${esc(v.unit)} · ${fmt(v.price)} ₫</span></label>`; }).join('')}
      </div>`,
      primaryText: 'Tạo đề nghị mua', secondaryText: 'Huỷ',
      onPrimary: () => {
        const lines = [];
        document.querySelectorAll('[data-dnm]').forEach(cb => {
          if (!cb.checked) return;
          const p = parts[+cb.dataset.dnm]; const v = vtmOf(p.code);
          lines.push({ code: v.code, name: v.name, unit: v.unit, qty: Number(p.qty) || 1, price: v.price, supplier: 'Cơ khí WEIKE Việt Nam' });
        });
        if (!lines.length) { ERPInteract.showToast('Chưa chọn linh kiện nào.', 'warning'); return; }
        let id = 'DNM-2026-000';
        if (window.ERPPurchase && ERPPurchase.create) {
          id = ERPPurchase.create({ from: 'Kỹ thuật máy · Phiếu bảo trì', ref: r.id, note: 'Bù tồn linh kiện đã thay cho máy ' + r.may + ' (' + r.id + ')', lines: lines }).id;
        }
        ERPInteract.showToast('Đã tạo <a href="13-de-xuat-mua.html?dnm=' + encodeURIComponent(id) + '" class="lnk">' + id + '</a> — bấm để mở', 'success', 6000);
      }
    });
  }

  /* ============================ Bản in ============================ */
  function ticketHtml(r) {
    const pair = (k, v) => '<tr><td>' + k + '</td><td>' + v + '</td></tr>';
    const items = (r.parts || []).map((p, i) => {
      const v = vtmOf(p.code);
      return '<tr><td class="c">' + (i + 1) + '</td><td>' + esc(v.code) + '</td><td>' + esc(v.name) + '</td><td class="c">' + esc(v.unit) + '</td><td class="r">' + String(p.qty).replace('.', ',') + '</td><td class="r">' + fmt(v.price) + '</td><td class="r">' + fmt(v.price * (Number(p.qty) || 0)) + '</td></tr>';
    }).join('');
    return ERPPrint.docHead() +
      '<div class="pdoc"><div class="pdoc-title">PHIẾU BẢO TRÌ THIẾT BỊ</div>' +
      '<div class="pdoc-sub">Số: ' + esc(r.id) + ' · Máy ' + esc(r.may) + ' — ' + esc(r.mayName) + '</div>' +
      '<table class="pdoc-rows">' +
        pair('Máy / Tổ', esc(r.may) + ' — ' + esc(r.mayName) + ' · ' + esc(r.team)) +
        pair('Loại việc · mức độ', esc(r.type) + ' · ' + esc(r.sev)) +
        pair('Người thực hiện', esc(r.by)) +
        pair('Ngày kế hoạch', esc(r.planDate)) +
        pair('Bắt đầu / kết thúc', esc(r.startAt || '—') + ' → ' + esc(r.endAt || '—')) +
        pair('Nội dung công việc', esc(r.desc)) +
        pair('Giờ dừng máy', String(Number(r.stopHours) || 0).replace('.', ',') + ' h × ' + fmt(GIO_MAY) + ' ₫/h = <b>' + fmt(stopMoney(r)) + ' ₫</b>') +
        pair('Chi phí nhân công', fmt(r.laborCost) + ' ₫') +
        pair('Tiền linh kiện', fmt(partsCost(r)) + ' ₫') +
        pair('<b>TỔNG CHI PHÍ</b>', '<b>' + fmt(totalCost(r)) + ' ₫</b>') +
        pair('Kết quả nghiệm thu', esc(r.result || 'Chưa nghiệm thu')) +
      '</table>' +
      (items ? '<table class="pdoc-items"><thead><tr><th>#</th><th>Mã LK</th><th>Tên linh kiện</th><th>ĐVT</th><th>SL</th><th>Đơn giá</th><th>Thành tiền</th></tr></thead><tbody>' + items + '</tbody></table>' : '') +
      '<div class="pdoc-note">Phiếu lập tại nhà máy cửa nhôm Owin — Số 8 Giá Ngự, Xâm Xuyên, Thường Tín, TP Hà Nội.</div>' +
      '<div class="pdoc-sign">' +
        '<div><b>NGƯỜI THỰC HIỆN</b><i>(Ký, ghi rõ họ tên)</i><div class="sp"></div></div>' +
        '<div><b>TỔ TRƯỞNG SẢN XUẤT</b><i>(Ký, ghi rõ họ tên)</i><div class="sp"></div></div>' +
        '<div><b>PHỤ TRÁCH KỸ THUẬT</b><i>(Ký, ghi rõ họ tên)</i><div class="sp"></div></div>' +
      '</div></div>';
  }
  function printTicket(r, direct) {
    const body = ticketHtml(r);
    if (direct) ERPPrint.printHtml('Phiếu bảo trì ' + r.id, body);
    else ERPPrint.preview({ title: 'Xem trước · Phiếu bảo trì ' + r.id, printTitle: 'Phiếu bảo trì ' + r.id, bodyHtml: body });
  }

  /* ============================ Tạo phiếu ============================ */
  function openCreate() {
    ERPInteract.showModal({
      title: 'Tạo phiếu bảo trì',
      body: `<div class="mm-wide"><div class="form-grid">
          <div class="fld"><label>Máy</label><select class="input" id="ncMay">${MAY_OPTS.map(m => `<option value="${m.id}">${m.id} — ${esc(m.name)}</option>`).join('')}</select></div>
          <div class="fld"><label>Loại việc</label><select class="input" id="ncType"><option>Bảo trì định kỳ theo giờ chạy</option><option>Bảo trì định kỳ theo tháng</option><option>Bảo trì đột xuất</option><option>Bảo trì sau sửa chữa</option><option>Vệ sinh – bôi trơn – căn chỉnh</option></select></div>
          <div class="fld"><label>Mức độ</label><select class="input" id="ncSev"><option>Nhẹ</option><option selected>Trung bình</option><option>Nghiêm trọng</option></select></div>
          <div class="fld"><label>Ngày dự kiến</label><input class="input" id="ncDate" value="25/05/2026" /></div>
          <div class="fld full"><label>Người thực hiện</label><select class="input" id="ncBy">${NGUOI.map(n => `<option>${esc(n)}</option>`).join('')}</select></div>
          <div class="fld full"><label>Nội dung công việc</label><textarea class="input" id="ncDesc" placeholder="VD: Thay lưỡi cắt Ø500, căn chỉnh góc cắt 45°..."></textarea></div>
        </div></div>`,
      primaryText: 'Tạo phiếu', secondaryText: 'Huỷ',
      onPrimary: () => {
        const g = (id) => (document.getElementById(id) || {}).value || '';
        const may = g('ncMay'); const mm = MAY_OPTS.find(m => m.id === may) || { name: '' };
        const id = TBM.nextId('bt', 'BT');
        const rec = { id: id, may: may, mayName: mm.name, team: '', type: g('ncType'), sev: g('ncSev'), by: g('ncBy'), planDate: g('ncDate'),
          startAt: '', endAt: '', stopHours: 0, laborCost: 0, parts: [], desc: g('ncDesc') || 'Bảo trì theo lịch định kỳ.', result: '', status: 'pending', warn: null };
        LIST.unshift(rec); TBM.add('bt', rec);
        renderTable(); renderStats();
        ERPInteract.showToast('Đã tạo <a href="18-phieu-bao-tri.html?bt=' + encodeURIComponent(id) + '" class="lnk">' + id + '</a> — bấm để mở', 'success', 6000);
      }
    });
  }

  document.addEventListener('erp:ready', () => {
    renderStats(); renderTable();
    $('#searchInput').addEventListener('input', renderTable);
    $('#segTabs').querySelectorAll('.seg').forEach(s => s.addEventListener('click', () => {
      curSt = s.dataset.st;
      $('#segTabs').querySelectorAll('.seg').forEach(x => x.classList.toggle('active', x === s));
      renderTable();
    }));
    $('#btnAdd').addEventListener('click', openCreate);
    $('#drawerOv').addEventListener('click', closeDrawer);
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !document.querySelector('.erp-print-overlay')) closeDrawer(); });

    const p = new URLSearchParams(location.search);
    const bt = p.get('bt'), may = p.get('may');
    if (bt && LIST.some(r => r.id === bt)) openDrawer(bt);
    else if (may) { $('#searchInput').value = may; renderTable(); }
  });
</script>
</body>
</html>
