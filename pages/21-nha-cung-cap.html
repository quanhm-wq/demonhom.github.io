    });

  /* trễ giao (PO chưa nhận) hoặc trễ nhận (PO đã nhập): >0 là trễ */
  function lateDays(p) {
    if (!p.due) return 0;
    var end = p.status === 'đã nhập' ? p.recvDate : TODAY;
    return Math.round((toDate(end) - toDate(p.due)) / 86400000);
  }
  var PENALTY_RATE = 0.00135;  /* phạt chậm giao 0,135%/ngày trên giá trị PO, trần 8% */
  var INTEREST_RATE = 0.0005;  /* lãi chậm trả ~0,05%/ngày trên số còn nợ */

    var d = lateDays(p);

  function receivePO(id, opt) {
    var p = getPO(id);
    if (!p) return { ok: false, message: 'Không tìm thấy PO' };
    opt = opt || {};
    var map = {};
    (opt.lines || []).forEach(function (x) { map[x.code] = x; });
    var invLines = [];
    p.lines.forEach(function (l) {
      var x = map[l.code] || {};
      var q = (x.recvQty != null && x.recvQty !== '') ? Number(x.recvQty) : l.qty;
      l.recvQty = q; l.lot = x.lot || l.lot || '';
      if (q > 0) invLines.push({ code: l.code, name: l.name, unit: l.unit, qty: q, price: l.price, lot: l.lot });
    });
    if (!invLines.length) return { ok: false, message: 'Phải nhập số lượng thực nhận > 0 cho ít nhất 1 dòng' };
    var res = { ok: true, txn: { id: 'PNK-' + id.slice(-4) } };
    if (g.ERPInv && g.ERPInv.post) {
      res = g.ERPInv.post({
        kind: 'in', type: 'nhap_mua', typeLabel: 'Nhập mua NVL',
        date: opt.date || TODAY, partner: nccName(p.nccKey), ref: p.id,
        note: 'Nhận hàng theo đơn đặt hàng ' + p.id + (opt.note ? ' — ' + opt.note : ''),
        lines: invLines
      });
      if (!res.ok) return res;
    }
    p.status = 'đã nhập';
    p.recvDate = opt.date || TODAY;
    p.pnkId = res.txn.id;
    p.payDue = addDays(p.recvDate, parseInt(String(p.payTerm).replace(/\D+/g, ''), 10) || 30);
    psave();
    return { ok: true, po: p, pnk: res.txn };
  }

  function payPO(id, opt) {
    var p = getPO(id);

    var amount = Math.round(Number(opt.amount) || 0);
    if (amount <= 0) return { ok: false, message: 'Số tiền trả phải lớn hơn 0' };
    var con = debtOf(p);
    if (amount > con) return { ok: false, message: 'Số tiền trả (' + vnd(amount) + ') vượt quá số còn nợ (' + vnd(con) + ')' };
    var rec = null;
    if (g.ERPCash && g.ERPCash.create) {
      rec = g.ERPCash.create({
        kind: 'chi', type: 'chi_nvl', typeLabel: 'Chi trả nhà cung cấp',
        date: opt.date || TODAY, partner: nccName(p.nccKey),

        createdBy: 'Kế toán thanh toán', ref: p.id
      });
    }
    var pay = {
      id: rec ? rec.id : 'PC-2026-' + ('00' + ((p.payments || []).length + 90)).slice(-3),
      date: opt.date || TODAY, amount: amount, method: opt.method === 'tm' ? 'tm' : 'ck',
      account: opt.account || ''
    };

    psave();
    return { ok: true, pay: pay, po: p };
  }

  /* Công nợ gộp theo NCC */
  function debtByNcc() {
    return NCC.map(function (n) {
      var ps = allPO().filter(function (p) { return p.nccKey === n.key && p.status === 'đã nhập'; });
      var phatsinh = ps.reduce(function (s, p) { return s + (p.total || 0); }, 0);
      var datra = ps.reduce(function (s, p) { return s + paidOf(p); }, 0);
      var connno = ps.reduce(function (s, p) { return s + debtOf(p); }, 0);
      var open = ps.filter(function (p) { return debtOf(p) > 0; })
        .sort(function (a, b) { return dk(a.payDue) - dk(b.payDue); });
      var han = open.length ? open[0].payDue : '';
      var qh = open.reduce(function (m, p) { return Math.max(m, payOverdue(p)); }, 0);
      var lai = open.reduce(function (s, p) { return s + interest(p); }, 0);
      return {
        key: n.key, ten: n.ten, soPO: ps.length, phatsinh: phatsinh, datra: datra,
        connno: connno, han: han, quahan: qh, lai: lai, pos: ps, open: open

    });

      if (v && v.rows && v.rows.length) { dmem = v; return dmem; }
    } catch (e) {}
    dmem = { rows: seedDXM() };
    dsave();
    return dmem;
  }
  function dsave() { try { g.localStorage.setItem(DKEY, JSON.stringify(dmem)); } catch (e) {} }

  var DEPT_OF = { 'Kho vật tư': 'Kho', 'Kho nhôm – kính': 'Kho', 'Xưởng sản xuất': 'Sản xuất' };
  /* Gộp DNM nội bộ + DNM sinh từ ERPPurchase (trang Kho bấm "Đề nghị mua NVL") */
  function allDXM() {
    var rows = dload().rows.slice();
    try {
      if (g.ERPPurchase && g.ERPPurchase.all) {
        g.ERPPurchase.all().forEach(function (r) {
          if (rows.some(function (x) { return x.id === r.id; })) return;
          var l = (r.lines || [])[0] || {};
          rows.push({
            id: r.id, date: r.date, dept: DEPT_OF[r.from] || r.from || 'Kho',
            nguoi: r.from || 'Thủ kho nhôm – kính', code: l.code || '',
            noidung: (r.lines || []).length > 1 ? (l.name + ' + ' + ((r.lines.length - 1) + ' mã khác')) : (l.name || r.note || ''),
            qty: l.qty || 0, unit: l.unit || '', price: l.price || 0,
            lydo: r.ref || r.note || 'Cảnh báo tồn dưới định mức',
            uutien: 'Cao', status: /duyệt/.test(r.status || '') && r.status !== 'chờ duyệt' ? 'Đã duyệt' : 'Chờ duyệt',
            nccKey: (function () {
              var found = NCC.filter(function (n) { return n.ten === l.supplier; })[0];
              return found ? found.key : (mat(l.code) || {}).sup || 'dongan';
            })(), external: true
          });
        });
      }
    } catch (e) {}
    return rows.sort(function (a, b) { return dk(b.date) - dk(a.date) || String(b.id).localeCompare(String(a.id)); });
  }
  function getDXM(id) { return allDXM().filter(function (r) { return r.id === id; })[0] || null; }
  function setDXM(id, patch) {
    var r = dload().rows.filter(function (x) { return x.id === id; })[0];
    if (!r) { r = getDXM(id); if (r) { dload().rows.push(r); } }
    if (!r) return null;
    Object.keys(patch || {}).forEach(function (k) { r[k] = patch[k]; });
    dsave();
    return r;
  }

  /* Đề xuất tự động: gộp BOM các LSX đang chạy + mã dưới định mức */
  function autoRows() {
    var rows = [], seen = {};
    try {
      if (g.StockStore && g.StockStore.suggestFromLSX) {
        g.StockStore.suggestFromLSX().forEach(function (r) {
          seen[r.code] = 1;
          var m = mat(r.code) || {};
          rows.push({
            code: r.code, name: m.name || r.name, unit: m.unit || r.unit,
            demand: r.demand, onHand: r.onHand, shortage: r.shortage,
            sup: (function () { var f = NCC.filter(function (n) { return n.ten === r.supplier; })[0]; return f ? f.key : (m.sup || 'dongan'); })(),
            price: m.price || r.price, qty: r.suggestQty || r.shortage,
            lsx: r.lsxIds || [], from: 'BOM lệnh sản xuất'
          });
        });
      }
    } catch (e) {}
    /* bổ sung các mã dưới tồn tối thiểu chưa có trong danh sách */
    MAT.forEach(function (m) {
      if (seen[m.code]) return;
      var oh = onHand(m.code), mn = minStock(m.code);
      if (!mn || oh >= mn) return;
      var need = Math.ceil(mn * 2 - oh);
      rows.push({
        code: m.code, name: m.name, unit: m.unit, demand: mn, onHand: oh,
        shortage: Math.max(0, mn - oh), sup: m.sup, price: m.price, qty: need,
        lsx: [], from: 'Dưới định mức tồn'
      });
    });
    return rows.sort(function (a, b) { return (b.shortage - a.shortage) || (b.demand - a.demand); });
  }

  var stack = [];
  function chipCls(st) {
    st = String(st || '').toLowerCase();
    if (/đã nhập|đã duyệt|đã trả|hoàn thành|đạt/.test(st)) return 'ok';
    if (/chờ|đã đặt|đang giao|soạn/.test(st)) return 'warn';
    if (/từ chối|huỷ|hủy|trễ|quá hạn/.test(st)) return 'bad';
    return '';
  }
  /* groups: [{title, icon, fields:[{key,label,val,wide,edit,type,options}]}] */
  function openDrawer(o) {
    ensureCss();
    var ov = document.createElement('div');
    ov.className = 'ow-ov';
    ov.style.zIndex = 900 + stack.length * 10;
    var tabsHtml = '', panes = '';
    if (o.tabs && o.tabs.length) {
      tabsHtml = '<div class="ow-dtabs">' + o.tabs.map(function (t, i) {
        return '<button class="ow-dtab' + (i === 0 ? ' on' : '') + '" data-owdt="' + i + '" data-no-interact="true">' + esc(t.label) + '</button>';
      }).join('') + '</div>';
      panes = o.tabs.map(function (t, i) {
        return '<div data-owdp="' + i + '"' + (i ? ' style="display:none"' : '') + '>' + (t.html || '') + '</div>';
      }).join('');
    } else {
      panes = groupsHtml(o.groups) + (o.itemsHtml || '') + (o.extraHtml || '');
    }
    ov.innerHTML = '<div class="ow-dr" role="dialog" aria-modal="true">' +
      '<div class="ow-dh" style="position:relative">' +
        '<div class="cat">' + esc(o.cat || 'Bản ghi') + '</div>' +
        '<div class="acts">' +
          (o.editable === false ? '' : '<button class="ow-hb" data-ow="edit" data-no-interact="true"><i data-lucide="pencil" style="width:12px;height:12px"></i> Sửa</button>') +
          (o.onPrint ? '<button class="ow-hb" data-ow="print" data-no-interact="true"><i data-lucide="printer" style="width:12px;height:12px"></i> In</button>' : '') +
          '<button class="ow-hb" data-ow="close" data-no-interact="true"><i data-lucide="x" style="width:12px;height:12px"></i></button>' +
        '</div>' +
        '<div class="idr"><b>' + esc(o.id || '') + '</b>' +
          (o.status ? '<span class="ow-chip ' + chipCls(o.status) + '">' + esc(o.status) + '</span>' : '') + '</div>' +
        (o.sub ? '<div class="sub">' + o.sub + '</div>' : '') +
      '</div>' + tabsHtml +
      '<div class="ow-db">' + panes + '</div>' +
      (o.actionsHtml ? '<div class="ow-df">' + o.actionsHtml + '</div>' : '') +
    '</div>';
    document.body.appendChild(ov);
    stack.push(ov);
    if (g.lucide) try { g.lucide.createIcons(); } catch (e) {}

    ov.addEventListener('click', function (e) {
      var t;
      if (e.target === ov || e.target.closest('[data-ow="close"]')) { e.stopPropagation(); return closeTop(); }
      if ((t = e.target.closest('[data-owdt]'))) {
        var i = t.getAttribute('data-owdt');
        ov.querySelectorAll('.ow-dtab').forEach(function (x) { x.classList.toggle('on', x === t); });
        ov.querySelectorAll('[data-owdp]').forEach(function (p) { p.style.display = (p.getAttribute('data-owdp') === i) ? '' : 'none'; });
        ov.querySelector('.ow-db').scrollTop = 0;
        if (g.lucide) try { g.lucide.createIcons(); } catch (er) {}
        return;
      }
      if (e.target.closest('[data-ow="print"]')) { e.stopPropagation(); if (o.onPrint) o.onPrint(); return; }
      if (e.target.closest('[data-ow="edit"]')) { e.stopPropagation(); return setEdit(ov, o, true); }
      if (e.target.closest('[data-ow="cancel"]')) { e.stopPropagation(); return setEdit(ov, o, false); }
      if (e.target.closest('[data-ow="save"]')) {
        e.stopPropagation();
        var vals = {};
        ov.querySelectorAll('[data-owk]').forEach(function (inp) { vals[inp.getAttribute('data-owk')] = inp.value; });
        if (o.onSave) o.onSave(vals);
        return;
      }
    });
    return ov;
  }
  function groupsHtml(groups) {
    return (groups || []).map(function (gr) {
      return '<div class="ow-gh"><i data-lucide="' + (gr.icon || 'file-text') + '" style="width:12px;height:12px"></i> ' + esc(gr.title) + '</div>' +
        '<div class="ow-grid">' + (gr.fields || []).filter(function (f) { return f; }).map(function (f) {
          var meta = f.edit ? encodeURIComponent(JSON.stringify({
            key: f.key, type: f.type || 'text', options: f.options || [],
            raw: f.raw != null ? f.raw : String(f.val == null ? '' : f.val).replace(/<[^>]*>/g, '')
          })) : '';
          return '<div class="ow-f' + (f.wide ? ' wide' : '') + '" data-owf="' + esc(f.key || '') + '"' +
            (meta ? ' data-owedit="' + meta + '"' : '') + '>' +
            '<label>' + esc(f.label) + '</label>' +
            '<b>' + (f.val == null ? '—' : f.val) + '</b>' +
          '</div>';
        }).join('') + '</div>';
    }).join('');
  }
  function setEdit(ov, o, on) {
    ov.querySelectorAll('[data-owf]').forEach(function (cell) {
      var raw = cell.getAttribute('data-owedit');
      if (!raw) return;
      var meta = JSON.parse(decodeURIComponent(raw));
      var b = cell.querySelector('b'), inp = cell.querySelector('[data-owk]');
      if (on) {
        if (inp) return;
        b.style.display = 'none';
        var el;
        if (meta.type === 'select') {
          el = document.createElement('select');
          el.innerHTML = (meta.options || []).map(function (op) {
            var v = (typeof op === 'string') ? op : op.v, t = (typeof op === 'string') ? op : op.t;
            return '<option value="' + esc(v) + '"' + (String(v) === String(meta.raw) ? ' selected' : '') + '>' + esc(t) + '</option>';
          }).join('');
        } else if (meta.type === 'textarea') {
          el = document.createElement('textarea'); el.rows = 2; el.value = meta.raw;
        } else {
          el = document.createElement('input');
          el.type = meta.type === 'number' ? 'number' : 'text';
          el.value = meta.raw;
        }
        el.setAttribute('data-owk', meta.key);
        el.setAttribute('data-no-interact', 'true');
        cell.appendChild(el);
      } else {
        if (b) b.style.display = '';
        if (inp) inp.remove();
      }
    });
    var foot = ov.querySelector('.ow-df');
    if (foot) {
      if (on) {
        if (!foot.getAttribute('data-saved-html')) foot.setAttribute('data-saved-html', foot.innerHTML);
        foot.innerHTML = '<button class="btn btn-secondary" data-ow="cancel" data-no-interact="true">Huỷ</button>' +
          '<button class="btn btn-primary" data-ow="save" data-no-interact="true"><i data-lucide="check" style="width:14px;height:14px"></i> Lưu thay đổi</button>';
      } else if (foot.getAttribute('data-saved-html')) {
        foot.innerHTML = foot.getAttribute('data-saved-html');
      }
    }
    var eb = ov.querySelector('[data-ow="edit"]');
    if (eb) eb.style.display = on ? 'none' : '';
    if (g.lucide) try { g.lucide.createIcons(); } catch (e) {}
  }
  function closeTop() {
    var ov = stack.pop();
    if (!ov) return;
    ov.classList.add('leaving');
    setTimeout(function () { ov.remove(); }, 200);
  }
  function closeAll() { while (stack.length) closeTop(); }
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape' || !stack.length) return;
    if (document.querySelector('.erp-print-overlay') || document.querySelector('.erp-modal-overlay')) return;
    closeTop();
  });

  /* Bắt link .lnk ở tầng window (capture) — chạy TRƯỚC ERPPeek của layout.js,
     để các mã bản ghi của module Thu mua mở đúng drawer dữ liệu của trang này. */
  function bindLnk(rules) {
    g.addEventListener('click', function (e) {
      if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
      var a = e.target && e.target.closest ? e.target.closest('a.lnk[href]') : null;
      if (!a) return;
      var h = a.getAttribute('href') || '';
      for (var i = 0; i < rules.length; i++) {
        var m = rules[i].re.exec(h);
        if (m) { e.preventDefault(); e.stopPropagation(); rules[i].fn(decodeURIComponent(m[1])); return; }
      }
    }, true);
  }

  /* Điều hướng thẳng sang trang khác của module Thu mua (kèm tham số bản ghi) */
  function goTo(page, key) {
    return function (id) { g.location.href = page + '?' + key + '=' + encodeURIComponent(id); };
  }

  /* Drawer phiếu nhập kho (đọc thẳng sổ kho ERPInv) */
  function openPNK(id) {
    var t = (g.ERPInv && g.ERPInv.getTxn) ? g.ERPInv.getTxn(id) : null;
    if (!t) { toast('Không tìm thấy phiếu nhập kho <b>' + esc(id) + '</b>', 'warning'); return; }

      cat: 'Phiếu nhập kho', id: t.id, status: t.typeLabel || 'Đã ghi sổ', editable: false,

      groups: [{ title: 'Thông tin phiếu', icon: 'package-check', fields: [
        { key: 'date', label: 'Ngày nhập', val: esc(t.date) },
        { key: 'partner', label: 'Đối tượng giao hàng', val: esc(t.partner || '—') },
        { key: 'ref', label: 'Chứng từ gốc', val: t.ref ? '<a href="13-mua-hang.html?po=' + encodeURIComponent(t.ref) + '" class="lnk">' + esc(t.ref) + '</a>' : '—' },
        { key: 'total', label: 'Tổng giá trị', val: '<span style="color:var(--rust)">' + vnd(t.total || 0) + '</span>' },
        { key: 'note', label: 'Diễn giải', val: esc(t.note || '—'), wide: true }
      ] }],
      itemsHtml: '<div class="ow-gh"><i data-lucide="list" style="width:12px;height:12px"></i> Dòng vật tư nhập kho</div>' +
        '<table class="ow-it"><thead><tr><th>Mã NVL</th><th>Tên vật tư</th><th>ĐVT</th><th class="r">SL nhập</th><th>Số lô</th><th class="r">Đơn giá</th><th class="r">Thành tiền</th></tr></thead><tbody>' +
        (t.lines || []).map(function (l) {
          return '<tr><td><b>' + esc(l.code) + '</b></td><td>' + esc(l.name) + '</td><td>' + esc(l.unit || '') + '</td>' +
            '<td class="r">' + num2(l.qty) + '</td><td>' + esc(l.lot || '—') + '</td>' +
            '<td class="r">' + vnd(l.price) + '</td><td class="r"><b>' + vnd(l.amount) + '</b></td></tr>';
        }).join('') + '</tbody></table>',
      actionsHtml: '<a class="btn btn-secondary" href="05-kho.html?pnk=' + encodeURIComponent(t.id) + '" data-pk-nav="1"><i data-lucide="external-link" style="width:14px;height:14px"></i> Mở tại màn Kho</a>'
    });
  }

  function toast(html, type, ms) {
    if (g.ERPInteract && g.ERPInteract.showToast) g.ERPInteract.showToast(html, type || 'success', ms || 5200);
  }
  function qp(name) {
    var m = new RegExp('[?&]' + name + '=([^&#]*)').exec(g.location.search);
    return m ? decodeURIComponent(m[1].replace(/\+/g, ' ')) : '';
  }
  function tile(l, v, s) {
    return '<div class="ow-tile"><div class="l">' + l + '</div><div class="v">' + v + '</div><div class="s">' + (s || '') + '</div></div>';
  }
  function sign(l, r) {
    return '<div class="pdoc-sign"><div><b>' + l + '</b><i>(Ký, ghi rõ họ tên)</i><div class="sp"></div></div>' +
      '<div><b>' + r + '</b><i>(Ký, ghi rõ họ tên)</i><div class="sp"></div></div></div>';
  }
  function preview(title, bodyHtml) {
    if (g.ERPPrint && g.ERPPrint.preview) {
      var ov = g.ERPPrint.preview({ title: title, printTitle: title, bodyHtml: bodyHtml });
      var el = document.querySelector('.erp-print-overlay');
      if (el) el.style.zIndex = '9000';
      return ov;
    }
  }
  function docHead() {
    return (g.ERPPrint && g.ERPPrint.docHead) ? g.ERPPrint.docHead() : '';
  }
  function words(n) { return (g.ERPCash && g.ERPCash.toWords) ? g.ERPCash.toWords(n) : fmt(n) + ' đồng'; }

  g.OwinCore = {
    TODAY: TODAY, THIS_MONTH: THIS_MONTH, RED: RED, GREEN: GREEN, AMBER: AMBER, STEEL: STEEL,
    esc: esc, fmt: fmt, vnd: vnd, num2: num2, gon: gon, dk: dk, dstr: dstr, toDate: toDate,
    addDays: addDays, daysLeft: daysLeft, monthOf: monthOf,
    warnRed: warnRed, warnGreen: warnGreen, DASH: DASH,
    CRIT: CRIT, NCC: NCC, ncc: ncc, nccName: nccName, score: score, rank: rank, rankColor: rankColor, rankChip: rankChip,
    MAT: MAT, mat: mat, onHand: onHand, minStock: minStock,
    allPO: allPO, getPO: getPO, nextPO: nextPO, createPO: createPO, receivePO: receivePO, payPO: payPO,
    paidOf: paidOf, debtOf: debtOf, lateDays: lateDays, penalty: penalty, payOverdue: payOverdue,
    interest: interest, debtByNcc: debtByNcc, savePO: psave,
    allDXM: allDXM, getDXM: getDXM, setDXM: setDXM, autoRows: autoRows,
    openDrawer: openDrawer, closeDrawer: closeTop, closeAllDrawers: closeAll, ensureCss: ensureCss,
    toast: toast, qp: qp, tile: tile, sign: sign, preview: preview, docHead: docHead, words: words,
    bindLnk: bindLnk, openPNK: openPNK, goTo: goTo
  };
  ensureCss();
})(window);

</script>
<script>
/* ===== 21-nha-cung-cap.html — Danh sách NCC + chấm điểm chuyên sâu ===== */
(function () {
  'use strict';
  var C = window.OwinCore;
  var esc = C.esc, fmt = C.fmt, vnd = C.vnd, gon = C.gon, num2 = C.num2;
  var Q = '';

  function poLink(id) { return '<a href="13-mua-hang.html?po=' + encodeURIComponent(id) + '" class="lnk">' + esc(id) + '</a>'; }
  function nccLink(key) { return '<a href="21-nha-cung-cap.html?ncc=' + encodeURIComponent(key) + '" class="lnk">' + esc(C.nccName(key)) + '</a>'; }

  /* Thống kê giao dịch của 1 NCC */
  function stat(key) {
    var ps = C.allPO().filter(function (p) { return p.nccKey === key; });
    var done = ps.filter(function (p) { return p.status === 'đã nhập'; });
    var onTime = done.filter(function (p) { return C.lateDays(p) <= 0; }).length;
    var luyke = done.reduce(function (s, p) { return s + p.total; }, 0);
    var n = C.ncc(key) || { svu: [] };
    var khautru = (n.svu || []).reduce(function (s, x) { return s + (x.kt || 0); }, 0);
    var debt = done.reduce(function (s, p) { return s + C.debtOf(p); }, 0);
    var qh = done.reduce(function (m, p) { return Math.max(m, C.payOverdue(p)); }, 0);
    return {
      pos: ps, done: done, soPO: ps.length, onTime: onTime,
      rate: done.length ? Math.round(onTime / done.length * 100) : 0,
      luyke: luyke, khautru: khautru,
      loiRate: luyke ? Math.round(khautru / luyke * 1000) / 10 : 0,
      debt: debt, quahan: qh, svu: n.svu || []
    };
  }
  function risk(key) {
    var n = C.ncc(key), t = C.score(n), r = C.rank(t), s = stat(key);
    if (r === 'D') return C.warnRed('Hạng D · giao đúng hẹn ' + s.rate + '% — cân nhắc thay NCC');
    if (s.quahan > 15) return C.warnRed('Công nợ quá hạn ' + s.quahan + ' ngày · hồ sơ CO/CQ chưa đủ');
    if (r === 'A' && !s.svu.length) return C.warnGreen('Hạng A · 0 sự vụ chất lượng 6 tháng');
    return C.DASH;
  }

  /* ---------- KPI + bảng ---------- */
  function renderKpi() {
    var all = C.NCC.map(function (n) { return { n: n, t: C.score(n) }; });
    var a = all.filter(function (x) { return C.rank(x.t) === 'A'; });
    var d = all.filter(function (x) { return C.rank(x.t) === 'D'; });
    var gt = C.NCC.reduce(function (s, n) { return s + stat(n.key).luyke; }, 0);
    document.getElementById('ncStrip').innerHTML =
      C.tile('Tổng nhà cung cấp', C.NCC.length, 'đang trong danh mục') +
      C.tile('Hạng A (≥85đ)', '<span style="color:' + C.GREEN + '">' + a.length + '</span>', 'ưu tiên đặt hàng') +
      C.tile('Hạng D (<60đ)', '<span style="color:' + C.RED + '">' + d.length + '</span>', 'cần đánh giá lại / thay thế') +
      C.tile('Giá trị mua luỹ kế', gon(gt), C.allPO().filter(function (p) { return p.status === 'đã nhập'; }).length + ' PO đã nhập kho');
    document.getElementById('ncSub').textContent =
      C.NCC.length + ' nhà cung cấp · ' + a.length + ' hạng A · ' + d.length + ' hạng D · giá trị mua luỹ kế ' + gon(gt);
  }

  function renderTable() {
    var rows = C.NCC.filter(function (n) {
      return !Q || (n.ten + ' ' + n.dm + ' ' + n.lh).toLowerCase().indexOf(Q.toLowerCase()) >= 0;
    }).map(function (n) { return { n: n, t: C.score(n), s: stat(n.key) }; })
      .sort(function (x, y) { return y.t - x.t; });
    document.getElementById('ncBody').innerHTML = rows.map(function (x) {
      var r = C.rank(x.t);
      return '<tr class="ow-row" data-ncc="' + esc(x.n.key) + '">' +
        '<td>' + nccLink(x.n.key) + '</td>' +
        '<td class="ow-ell" title="' + esc(x.n.dm) + '">' + esc(x.n.dm) + '</td>' +
        '<td style="white-space:nowrap" title="' + esc(x.n.lh) + '">' + esc(String(x.n.lh).split('—')[0].trim()) +
          '<br/><span class="t-caption">' + esc(x.n.sdt) + '</span></td>' +
        '<td class="num">' + x.s.soPO + '</td>' +
        '<td class="num"><b>' + gon(x.s.luyke) + '</b></td>' +
        '<td class="num"><b style="color:' + C.rankColor(r) + '">' + num2(x.t) + '</b></td>' +
        '<td>' + C.rankChip(x.t) + '</td>' +
        '<td>' + risk(x.n.key) + '</td>' +
        '<td><div style="display:flex;gap:5px;flex-wrap:wrap">' +
          '<button class="ow-btn-sm" data-nact="view" data-no-interact="true">Xem</button>' +
          '<button class="ow-btn-sm pri" data-nact="po" data-no-interact="true">→ Tạo PO</button>' +
        '</div></td></tr>';
    }).join('') || '<tr><td colspan="9" style="text-align:center;padding:26px;color:var(--ash)">Không có nhà cung cấp nào khớp bộ lọc.</td></tr>';
    if (window.lucide) lucide.createIcons();
  }
  function renderAll() { renderKpi(); renderTable(); }

  /* ---------- Drawer NCC: Hồ sơ / Chấm điểm / Lịch sử / Sự vụ ---------- */
  function fieldsHtml(fs) {
    return '<div class="ow-grid">' + fs.map(function (f) {
      return '<div class="ow-f' + (f.w ? ' wide' : '') + '"><label>' + esc(f.l) + '</label><b>' + (f.v || '—') + '</b></div>';
    }).join('') + '</div>';
  }
  function openNCC(key) {
    var n = C.ncc(key);
    if (!n) { C.toast('Không tìm thấy nhà cung cấp <b>' + esc(key) + '</b>', 'warning'); return; }
    var t = C.score(n), r = C.rank(t), s = stat(key);

    /* --- tab 1: Hồ sơ --- */
    var tabHoSo = '<div class="ow-gh"><i data-lucide="contact" style="width:12px;height:12px"></i> Hồ sơ nhà cung cấp</div>' +
      fieldsHtml([
        { l: 'Tên nhà cung cấp', v: '<b>' + esc(n.ten) + '</b>', w: true },
        { l: 'Mã số thuế', v: esc(n.mst) },
        { l: 'Danh mục cung cấp', v: esc(n.dm) },
        { l: 'Địa chỉ', v: esc(n.dc), w: true },
        { l: 'Người liên hệ', v: esc(n.lh) },
        { l: 'Điện thoại', v: esc(n.sdt) },
        { l: 'Email', v: esc(n.mail) },
        { l: 'Thời gian giao trung bình', v: esc(n.lead) },
        { l: 'Điều khoản thanh toán', v: esc(n.term), w: true },
        { l: 'Hồ sơ pháp lý / chứng chỉ', v: esc(n.cert), w: true },
        { l: 'Nhận xét của phòng Thu mua', v: esc(n.nx), w: true }
      ]) +
      '<div class="ow-gh"><i data-lucide="wallet" style="width:12px;height:12px"></i> Công nợ hiện tại</div>' +
      fieldsHtml([
        { l: 'Còn nợ', v: s.debt > 0 ? '<span style="color:' + C.RED + '">' + vnd(s.debt) + '</span>' : '<span style="color:' + C.GREEN + '">Đã tất toán</span>' },
        { l: 'Quá hạn', v: s.quahan > 0 ? '<span style="color:' + C.RED + '">' + s.quahan + ' ngày</span>' : '—' },
        { l: 'Xem chi tiết', v: '<a href="21-cong-no-ncc.html?ncc=' + encodeURIComponent(key) + '" class="lnk">Công nợ nhà cung cấp</a>', w: true }
      ]);

    /* --- tab 2: Chấm điểm --- */
    var critRows = C.CRIT.map(function (c) {
      var v = Number(n.sc[c.k]) || 0, q = Math.round(v * c.w / 100 * 10) / 10;
      var col = v >= 85 ? C.GREEN : v >= 70 ? C.STEEL : v >= 60 ? C.AMBER : C.RED;
      return '<tr><td><b>' + esc(c.label) + '</b><br/><span class="t-caption">' + esc(c.note) + '</span></td>' +
        '<td class="r">' + c.w + '%</td>' +
        '<td><div style="display:flex;align-items:center;gap:8px"><div class="ow-bar" style="flex:1"><i style="width:' + v + '%;background:' + col + '"></i></div>' +
        '<b style="color:' + col + ';min-width:30px;text-align:right">' + v + '</b></div></td>' +
        '<td class="r"><b>' + num2(q) + '</b></td></tr>';
    }).join('');
    var tabDiem = '<div class="ow-gh"><i data-lucide="award" style="width:12px;height:12px"></i> Bảng tiêu chí chấm điểm có trọng số</div>' +
      '<table class="ow-crit"><thead><tr><th>Tiêu chí</th><th class="r">Trọng số</th><th style="width:190px">Điểm 0–100</th><th class="r">Điểm quy đổi</th></tr></thead>' +
      '<tbody>' + critRows +
      '<tr><td colspan="3" class="r"><b>TỔNG ĐIỂM QUY ĐỔI</b></td><td class="r"><b style="font-size:16px;color:' + C.rankColor(r) + '">' + num2(t) + '</b></td></tr>' +
      '</tbody></table>' +
      '<div style="display:flex;align-items:center;gap:12px;margin-top:14px;padding:12px 14px;background:var(--canvas);border:1px solid var(--rule);border-radius:10px">' +
        '<span class="ow-rank" style="width:36px;height:36px;font-size:18px;background:' + C.rankColor(r) + '">' + r + '</span>' +
        '<div><b style="font-size:14px">Xếp hạng ' + r + '</b><div class="t-caption">' +
        (r === 'A' ? 'Ưu tiên đặt hàng, được giữ hạn mức công nợ cao nhất.'
          : r === 'B' ? 'Đạt yêu cầu — theo dõi tiêu chí điểm thấp nhất trong kỳ tới.'
          : r === 'C' ? 'Cần cải thiện — yêu cầu cam kết bằng văn bản trước khi đặt đơn lớn.'
          : 'Không đạt — hạn chế đặt hàng, tìm nhà cung cấp thay thế trong quý này.') +
        '</div></div></div>' +
      '<div class="ow-gh"><i data-lucide="radar" style="width:12px;height:12px"></i> Biểu đồ radar 6 tiêu chí</div>' +
      '<div id="ncRadar" style="display:flex;justify-content:center;background:var(--canvas);border:1px solid var(--rule);border-radius:10px;padding:8px"></div>' +
      '<div class="t-caption mt-2">Thang điểm: A ≥85 · B 75–84 · C 60–74 · D &lt;60. Điểm được cập nhật sau mỗi kỳ nghiệm thu PO.</div>';

    /* --- tab 3: Lịch sử giao dịch --- */
    var poRows = s.pos.sort(function (a, b) { return C.dk(b.date) - C.dk(a.date); }).map(function (p) {
      var late = C.lateDays(p);
      return '<tr><td>' + poLink(p.id) + '</td><td>' + esc(p.date) + '</td><td>' + esc(p.content) + '</td>' +
        '<td class="r">' + vnd(p.total) + '</td><td>' + esc(p.due) + '</td>' +
        '<td>' + esc(p.recvDate || '—') + '</td>' +
        '<td>' + (p.status !== 'đã nhập' ? (late > 0 ? '<span style="color:' + C.RED + '">Trễ ' + late + ' ngày</span>' : 'Chờ giao')
          : (late > 0 ? '<span style="color:' + C.RED + '">Trễ ' + late + ' ngày</span>' : '<span style="color:' + C.GREEN + '">Đúng hẹn</span>')) + '</td></tr>';
    }).join('');
    var tabLS = '<div class="ow-gh"><i data-lucide="bar-chart-3" style="width:12px;height:12px"></i> Chỉ số giao dịch</div>' +
      fieldsHtml([
        { l: 'Số PO đã đặt', v: s.soPO + ' đơn (' + s.done.length + ' đã nhập kho)' },
        { l: 'Tỷ lệ giao đúng hẹn', v: '<span style="color:' + (s.rate >= 85 ? C.GREEN : s.rate >= 70 ? C.AMBER : C.RED) + '">' + s.rate + '% (' + s.onTime + '/' + s.done.length + ')</span>' },
        { l: 'Tỷ lệ hàng lỗi (giá trị khấu trừ / giá trị mua)', v: '<span style="color:' + (s.loiRate <= 1 ? C.GREEN : s.loiRate <= 2.5 ? C.AMBER : C.RED) + '">' + num2(s.loiRate) + '%</span>', w: true },
        { l: 'Giá trị mua luỹ kế', v: '<span style="color:var(--rust)">' + vnd(s.luyke) + '</span>' },
        { l: 'Giá trị khấu trừ chất lượng', v: s.khautru ? '<span style="color:' + C.RED + '">' + vnd(s.khautru) + '</span>' : '0₫' }
      ]) +
      '<div class="ow-gh"><i data-lucide="history" style="width:12px;height:12px"></i> Các PO đã đặt</div>' +
      '<table class="ow-it"><thead><tr><th>Mã PO</th><th>Ngày đặt</th><th>Nội dung</th><th class="r">Giá trị</th><th>Hẹn giao</th><th>Nhận thực tế</th><th>Tình trạng</th></tr></thead><tbody>' +
      (poRows || '<tr><td colspan="7" style="text-align:center;padding:18px;color:var(--ash)">Chưa có PO nào.</td></tr>') + '</tbody></table>';

    /* --- tab 4: Sự vụ chất lượng --- */
    var svRows = s.svu.map(function (x) {
      return '<tr><td>' + esc(x.date) + '</td><td>' + poLink(x.po) + '</td><td>' + esc(x.mo) + '</td>' +
        '<td><span class="t-mono">' + esc(x.bb) + '</span></td><td class="r"><b style="color:' + C.RED + '">' + vnd(x.kt) + '</b></td></tr>';
    }).join('');
    var tabSV = '<div class="ow-gh"><i data-lucide="alert-triangle" style="width:12px;height:12px"></i> Sự vụ chất lượng 6 tháng</div>' +
      (s.svu.length
        ? '<table class="ow-it"><thead><tr><th>Ngày</th><th>PO liên quan</th><th>Mô tả sự vụ</th><th>Biên bản</th><th class="r">Mức khấu trừ</th></tr></thead><tbody>' +
          svRows +
          '<tr><td colspan="4" class="r"><b>CỘNG KHẤU TRỪ</b></td><td class="r"><b style="color:' + C.RED + '">' + vnd(s.khautru) + '</b></td></tr>' +
          '</tbody></table>'
        : '<div style="padding:18px;background:var(--moss-soft);border:1px solid rgba(47,93,58,.2);border-radius:10px;color:' + C.GREEN + ';font-weight:600">Không có sự vụ chất lượng nào trong 6 tháng gần nhất.</div>') +
      '<div class="ow-gh"><i data-lucide="check-circle" style="width:12px;height:12px"></i> Chỉ tiêu kiểm khi nhập</div>' +
      '<div class="t-caption" style="line-height:1.7">Sai lệch kích thước ≤2mm · vuông góc 90°±0,5° · độ dày lớp anod ≥15µm · độ bám sơn tĩnh điện (cross-cut) · ' +
      'độ kín khít gioăng · độ phẳng cánh ≤1,5mm/m · lực đóng bản lề thuỷ lực. Hồ sơ đi kèm: ' + esc(n.cert) + '.</div>';

    var ov = C.openDrawer({
      cat: 'Nhà cung cấp', id: n.ten, status: 'Hạng ' + r + ' · ' + num2(t) + ' điểm',
      sub: esc(n.dm) + ' · ' + s.soPO + ' PO · luỹ kế <b>' + gon(s.luyke) + '</b>',
      editable: false,
      tabs: [
        { label: 'Hồ sơ', html: tabHoSo },
        { label: 'Chấm điểm NCC', html: tabDiem },
        { label: 'Lịch sử giao dịch', html: tabLS },
        { label: 'Sự vụ chất lượng', html: tabSV }
      ],
      actionsHtml:
        '<a class="btn btn-secondary" href="21-cong-no-ncc.html?ncc=' + encodeURIComponent(key) + '"><i data-lucide="wallet" style="width:14px;height:14px"></i> Công nợ</a>' +
        '<button class="btn btn-primary" data-na="po" data-no-interact="true"><i data-lucide="file-text" style="width:14px;height:14px"></i> → Tạo PO</button>' +
        '<button class="btn btn-secondary" data-na="print" data-no-interact="true"><i data-lucide="printer" style="width:14px;height:14px"></i> In phiếu chấm điểm</button>'
    });
    ov.addEventListener('click', function (e) {
      var t2 = e.target.closest('[data-na]');
      if (!t2) return;
      e.stopPropagation();
      if (t2.getAttribute('data-na') === 'po') { C.closeDrawer(); openCreatePO(key); }
      else printScore(key);
    });
    /* radar — vẽ khi mở tab Chấm điểm (và ngay lần đầu nếu container có kích thước) */
    function drawRadar() {
      if (!window.ERPCharts || !window.ERPCharts.radar) return;
      var el = ov.querySelector('#ncRadar');
      if (!el || el.getAttribute('data-done')) return;
      try {
        window.ERPCharts.radar(el, {
          labels: ['Chất lượng', 'Đúng hẹn', 'Giá', 'Hỗ trợ', 'Điều khoản TT', 'Hồ sơ'],
          values: C.CRIT.map(function (c) { return Number(n.sc[c.k]) || 0; })
        }, { max: 100, size: 260, color: C.rankColor(r) });
        el.setAttribute('data-done', '1');
      } catch (er) {}
    }
    ov.addEventListener('click', function (e) { if (e.target.closest('[data-owdt]')) setTimeout(drawRadar, 40); });
    setTimeout(drawRadar, 120);
  }

  /* ---------- In phiếu chấm điểm NCC ---------- */
  function printScore(key) {
    var n = C.ncc(key); if (!n) return;
    var t = C.score(n), r = C.rank(t), s = stat(key);
    var body = C.docHead() +
      '<div class="pdoc"><div class="pdoc-title">PHIẾU ĐÁNH GIÁ NHÀ CUNG CẤP</div>' +
      '<div class="pdoc-sub">Kỳ đánh giá: 6 tháng gần nhất · Ngày lập ' + esc(C.TODAY) + '</div>' +
      '<table class="pdoc-rows">' +
        '<tr><td>Nhà cung cấp</td><td><b>' + esc(n.ten) + '</b> — MST ' + esc(n.mst) + '</td></tr>' +
        '<tr><td>Địa chỉ</td><td>' + esc(n.dc) + '</td></tr>' +
        '<tr><td>Danh mục cung cấp</td><td>' + esc(n.dm) + '</td></tr>' +
        '<tr><td>Số PO / giá trị luỹ kế</td><td>' + s.soPO + ' đơn · ' + fmt(s.luyke) + ' ₫</td></tr>' +
        '<tr><td>Tỷ lệ giao đúng hẹn</td><td>' + s.rate + '%</td></tr>' +
      '</table>' +
      '<table class="pdoc-items"><thead><tr><th>TT</th><th>Tiêu chí đánh giá</th><th class="r">Trọng số</th><th class="r">Điểm 0–100</th><th class="r">Điểm quy đổi</th></tr></thead><tbody>' +
      C.CRIT.map(function (c, i) {
        var v = Number(n.sc[c.k]) || 0;
        return '<tr><td class="c">' + (i + 1) + '</td><td>' + esc(c.label) + '</td><td class="r">' + c.w + '%</td>' +
          '<td class="r">' + v + '</td><td class="r">' + num2(v * c.w / 100) + '</td></tr>';
      }).join('') +
      '<tr><td colspan="4" class="r"><b>TỔNG ĐIỂM</b></td><td class="r"><b>' + num2(t) + '</b></td></tr>' +
      '<tr><td colspan="4" class="r"><b>XẾP HẠNG</b></td><td class="r"><b>' + r + '</b></td></tr>' +
      '</tbody></table>' +
      '<div class="pdoc-note"><b>Kết luận.</b> ' +
      (r === 'A' ? 'Nhà cung cấp đạt hạng A — tiếp tục ưu tiên đặt hàng và giữ hạn mức công nợ hiện tại.'
        : r === 'B' ? 'Nhà cung cấp đạt hạng B — tiếp tục hợp tác, theo dõi tiêu chí điểm thấp trong kỳ sau.'
        : r === 'C' ? 'Nhà cung cấp hạng C — yêu cầu cam kết cải thiện bằng văn bản trước khi đặt đơn giá trị lớn.'
        : 'Nhà cung cấp hạng D — hạn chế đặt hàng, phòng Thu mua tìm nhà cung cấp thay thế trong quý này.') +
      (s.svu.length ? ' Trong kỳ ghi nhận ' + s.svu.length + ' sự vụ chất lượng, tổng khấu trừ ' + fmt(s.khautru) + ' ₫.' : ' Trong kỳ không ghi nhận sự vụ chất lượng.') +
      '</div>' + C.sign('PHÒNG THU MUA', 'GIÁM ĐỐC DUYỆT') + '</div>';
    C.preview('Phiếu đánh giá nhà cung cấp — ' + n.ten, body);
  }

  /* ---------- Tạo PO cho NCC ---------- */
  function openCreatePO(key) {
    var mats = C.MAT.filter(function (m) { return m.sup === key; });
    if (!mats.length) mats = C.MAT;
    var body = '<div class="ow-wide"><div class="ow-mrow mb-3">' +
      '<label><span>Nhà cung cấp</span><select class="input" id="cnNcc">' +
        C.NCC.map(function (n) { return '<option value="' + esc(n.key) + '"' + (n.key === key ? ' selected' : '') + '>' + esc(n.ten) + '</option>'; }).join('') + '</select></label>' +
      '<label><span>Vật tư</span><select class="input" id="cnMat">' +
        mats.map(function (m) { return '<option value="' + esc(m.code) + '">' + esc(m.name) + ' (' + esc(m.unit) + ')</option>'; }).join('') + '</select></label>' +
      '<label><span>Số lượng</span><input class="input" type="number" id="cnQty" value="1000" min="1"></label>' +
      '<label><span>Ngày hẹn giao</span><input class="input" id="cnDue" value="' + esc(C.addDays(C.TODAY, 10)) + '"></label>' +
      '<label style="grid-column:1/-1"><span>Ghi chú</span><input class="input" id="cnNote" placeholder="VD: Ưu tiên giao trước cho LSX-0340"></label>' +
      '</div></div>';
    window.ERPInteract.showModal({
      title: 'Tạo PO cho ' + C.nccName(key), body: body, primaryText: 'Tạo PO', secondaryText: 'Huỷ',
      onPrimary: function () {
        var m = C.mat((document.getElementById('cnMat') || {}).value);
        var qty = Number((document.getElementById('cnQty') || {}).value) || 0;
        if (!m || qty <= 0) { C.toast('Số lượng phải lớn hơn 0', 'warning'); return false; }
        var rec = C.createPO({
          nccKey: (document.getElementById('cnNcc') || {}).value, content: m.name,
          due: (document.getElementById('cnDue') || {}).value,
          note: (document.getElementById('cnNote') || {}).value, src: 'Tạo từ màn Nhà cung cấp',
          lines: [{ code: m.code, name: m.name, unit: m.unit, qty: qty, price: m.price }]
        });
        renderAll();
        C.toast('Đã tạo ' + poLink(rec.id) + ' · ' + vnd(rec.total) + ' — bấm để mở', 'success', 6000);
        return true;
      }
    });
    if (window.lucide) lucide.createIcons();
  }

  /* ---------- Sự kiện ---------- */
  document.addEventListener('erp:ready', function () {
    renderAll();

    var s = document.getElementById('ncSearch');
    if (s) s.addEventListener('input', function () { Q = s.value.trim(); renderTable(); });

    document.getElementById('ncBody').addEventListener('click', function (e) {
      var tr = e.target.closest('tr[data-ncc]');
      if (!tr) return;
      var key = tr.getAttribute('data-ncc');
      var b = e.target.closest('[data-nact]');
      if (b) {
        e.preventDefault(); e.stopPropagation();
        if (b.getAttribute('data-nact') === 'po') return openCreatePO(key);
        return openNCC(key);
      }
      if (e.target.closest('a.lnk')) return;
      openNCC(key);
    });

    C.bindLnk([
      { re: /21-nha-cung-cap\.html\?ncc=([^&#]+)/, fn: openNCC },
      { re: /13-mua-hang\.html\?po=([^&#]+)/, fn: C.goTo('13-mua-hang.html', 'po') },
      { re: /21-cong-no-ncc\.html\?ncc=([^&#]+)/, fn: C.goTo('21-cong-no-ncc.html', 'ncc') }
    ]);

    var q = C.qp('ncc');
    if (q && C.ncc(q)) setTimeout(function () { openNCC(q); }, 260);
  });
})();

</script>
</body>
</html>
