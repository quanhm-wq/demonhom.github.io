<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lệnh sản xuất — ERP NHÔM OWIN</title>
  <link rel="stylesheet" href="../assets/css/style.css" />
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <style>
    /* ============================================================
       LSX · MÀN CHI TIẾT MỘT LỆNH SẢN XUẤT (công nhân dùng)
       Bố cục: (1) dải nút · (2) bảng thông tin · (3) 6 bước ngang
               (4) phân tích lỗi hỏng & quá thời gian
       ============================================================ */

    /* sticky hoạt động được bên trong .main (overflow-x:hidden → clip) */
    .main { overflow-x: clip; }

    /* liên kết bản ghi (ERPPeek bắt click) — style dự phòng */
    .lnk { color: var(--rust); font-family: var(--ff-mono); font-weight: 600; text-decoration: none; border-bottom: 1px dotted rgba(197,64,10,.5); cursor: pointer; }
    .lnk:hover { color: var(--rust-deep); border-bottom-style: solid; }

    /* bản in luôn nổi trên cùng */
    .erp-print-overlay { z-index: 9000 !important; }
    /* form rộng trong modal mặc định 560px */
    .erp-modal:has(.lsxd-form) { max-width: 900px; }
    .erp-modal:has(.lsxd-form) h3 { margin-bottom: 14px; }

    /* ===== (1) DẢI NÚT TRÊN CÙNG ===== */
    .lsxd-bar {
      position: sticky; top: 0; z-index: 60;
      display: flex; align-items: stretch; gap: 0;
      flex-wrap: wrap;
      background: var(--canvas);
      border: 1px solid var(--rule);
      border-radius: var(--r-4);
      padding: 8px 4px;
      row-gap: 10px;
      margin: -6px 0 14px;
      box-shadow: 0 6px 18px rgba(20,19,15,.07);
    }
    .lsxd-grp { display: flex; flex-direction: column; gap: 6px; padding: 2px 14px; position: relative; }
    .lsxd-grp + .lsxd-grp::before {
      content: ""; position: absolute; left: 0; top: 4px; bottom: 4px;
      width: 1px; background: var(--rule);
    }
    .lsxd-grp.row-start::before { display: none; }
    .lsxd-grp > .lbl {
      font-family: var(--ff-mono); font-size: 9.5px; font-weight: 600;
      letter-spacing: .18em; text-transform: uppercase; color: var(--ash-2);
    }
    .lsxd-grp > .row { display: flex; gap: 8px; flex-wrap: wrap; }
    .obtn {
      height: 40px; min-width: 40px; padding: 0 14px;
      display: inline-flex; align-items: center; gap: 7px;
      font-family: var(--ff-sans); font-size: 14px; font-weight: 600;
      border-radius: var(--r-3); border: 1px solid var(--rule);
      background: var(--paper); color: var(--ink);
      cursor: pointer; transition: filter .12s ease, transform .08s ease;
      white-space: nowrap;
    }
    .obtn i { width: 16px; height: 16px; }
    .obtn:hover { filter: brightness(.96); }
    .obtn:active { transform: translateY(1px); }
    .obtn[disabled], .obtn.is-off { opacity: .38; cursor: not-allowed; filter: grayscale(.5); }
    .obtn-go    { background: #1f6b3a; border-color: #1a5a31; color: #fff; }
    .obtn-pause { background: #9c7714; border-color: #866413; color: #fff; }
    .obtn-stop  { background: #8a1f1f; border-color: #741a1a; color: #fff; }
    .obtn-warn  { background: #f0e6c4; border-color: #d9c98c; color: #6d5410; }
    .obtn-ink   { background: var(--ink); border-color: var(--ink); color: var(--paper); }

    /* ===== (2) BẢNG THÔNG TIN LỆNH ===== */
    .lsxd-info {
      display: flex; gap: 18px; align-items: stretch;
      background: var(--canvas); border: 1px solid var(--rule);
      border-radius: var(--r-4); padding: 16px 18px; margin-bottom: 16px;
    }
    .lsxd-info .fields {
      flex: 1; min-width: 0;
      display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px 20px;
    }
    .lsxd-fd .k {
      display: block; font-family: var(--ff-mono); font-size: 9.5px; font-weight: 600;
      letter-spacing: .14em; text-transform: uppercase; color: var(--ash-2); margin-bottom: 3px;
    }
    .lsxd-fd .v { display: block; font-size: 15px; font-weight: 600; color: var(--ink); line-height: 1.3; }
    .lsxd-fd .v.big { font-family: var(--ff-mono); font-size: 19px; letter-spacing: -.01em; }
    .lsxd-fd .v small { font-size: 12.5px; font-weight: 500; color: var(--ash); }
    .lsxd-qr {
      flex: none; width: 150px; border-left: 1px solid var(--rule); padding-left: 16px;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
      text-align: center;
    }
    .lsxd-qr .cap { font-family: var(--ff-mono); font-size: 9.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--ash-2); }
    .pbar { height: 10px; background: var(--paper-3); border-radius: 999px; overflow: hidden; margin-top: 5px; }
    .pbar > i { display: block; height: 100%; background: #1f6b3a; border-radius: 999px; }
    .pbar.warn > i { background: var(--amber); }

    .st-chip {
      display: inline-flex; align-items: center; gap: 6px;
      height: 26px; padding: 0 11px; border-radius: 999px;
      font-size: 12.5px; font-weight: 700; letter-spacing: .01em;
      border: 1px solid transparent;
    }
    .st-chip .dot { width: 7px; height: 7px; border-radius: 999px; background: currentColor; }
    .st-run   { background: var(--moss-soft); color: #1f6b3a; border-color: rgba(31,107,58,.28); }
    .st-pause { background: var(--amber-soft); color: #6d5410; border-color: rgba(156,119,20,.3); }
    .st-wait  { background: var(--paper-3); color: var(--ash); border-color: var(--rule); }
    .st-done  { background: var(--steel-soft); color: var(--steel); border-color: rgba(74,85,96,.25); }
    .st-late  { background: var(--signal-soft); color: #8a1f1f; border-color: rgba(138,31,31,.28); }

    /* ===== (3) CÁC BƯỚC SẢN XUẤT — HÀNG NGANG ===== */
    .lsxd-sec-h {
      display: flex; align-items: baseline; gap: 10px; margin: 2px 0 10px;
    }
    .lsxd-sec-h h2 { font-size: 15px; font-weight: 700; letter-spacing: -.01em; }
    .lsxd-sec-h span { font-size: 12.5px; color: var(--ash); }

    .lsxd-steps {
      display: flex; flex-wrap: nowrap; overflow-x: auto; gap: 14px;
      padding: 2px 2px 14px; margin-bottom: 18px;
      scrollbar-width: thin;
    }
    .stp {
      flex: 0 0 300px; width: 300px;
      display: flex; flex-direction: column;
      background: var(--canvas); border: 1px solid var(--rule);
      border-radius: var(--r-4); overflow: hidden;
    }
    .stp.is-doing { border-color: #1f6b3a; box-shadow: 0 0 0 2px rgba(31,107,58,.14); }
    .stp.is-late  { border-color: #8a1f1f; box-shadow: 0 0 0 2px rgba(138,31,31,.12); }
    .stp-h { padding: 10px 12px; border-bottom: 1px solid var(--rule); background: var(--paper-2); }
    .stp-h .t1 { display: flex; align-items: center; gap: 8px; }
    .stp-no {
      width: 26px; height: 26px; flex: none; border-radius: 999px;
      background: var(--ink); color: var(--paper);
      display: flex; align-items: center; justify-content: center;
      font-family: var(--ff-mono); font-size: 13px; font-weight: 700;
    }
    .stp-nm { font-size: 14.5px; font-weight: 700; line-height: 1.22; min-width: 0; }
    .stp-h .t2 { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .stp-meta { padding: 9px 12px; border-bottom: 1px solid var(--rule-soft); font-size: 12.5px; color: var(--ash); line-height: 1.7; }
    .stp-meta b { color: var(--ink); font-weight: 600; }
    .stp-acts { display: flex; gap: 8px; padding: 10px 12px; }
    .stp-acts .obtn { flex: 1 1 0; min-width: 0; height: 44px; justify-content: center; font-size: 14px; }

    .stp-form { padding: 4px 12px 12px; flex: 1; }
    .stp-form .gr { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 8px; margin-bottom: 9px; }
    .stp-form .gr.g2 { grid-template-columns: repeat(2, minmax(0,1fr)); }
    .fld { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
    .fld > label {
      font-family: var(--ff-mono); font-size: 9.5px; font-weight: 600;
      letter-spacing: .1em; text-transform: uppercase; color: var(--ash-2);
    }
    .fld > input, .fld > select, .fld > textarea {
      height: 38px; padding: 0 9px; width: 100%;
      font-family: var(--ff-sans); font-size: 15px; font-weight: 600; color: var(--ink);
      background: var(--paper); border: 1px solid var(--rule); border-radius: var(--r-2);
    }
    .fld > select { font-size: 13px; font-weight: 600; }
    .fld > textarea { height: 46px; padding: 7px 9px; font-size: 13px; font-weight: 500; resize: vertical; line-height: 1.4; }
    .fld > input:focus, .fld > select:focus, .fld > textarea:focus { outline: 2px solid rgba(197,64,10,.35); border-color: var(--rust); }
    .fld.bad > input { border-color: #8a1f1f; background: #fdf4f4; }
    .stp-save { width: 100%; height: 40px; justify-content: center; margin-top: 2px; }

    .stp-time {
      margin-top: 10px; padding: 9px 12px; border-top: 1px solid var(--rule-soft);
      display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 4px 10px;
      font-size: 12.5px; background: var(--paper-2);
    }
    .stp-time span { color: var(--ash); }
    .stp-time b { color: var(--ink); font-family: var(--ff-mono); font-weight: 600; }
    .stp-time b.over { color: #8a1f1f; }
    .stp-time b.early { color: #1f6b3a; }

    /* ===== (4) PHÂN TÍCH LỖI HỎNG & QUÁ THỜI GIAN ===== */
    .lsxd-loss { background: var(--canvas); border: 1px solid var(--rule); border-radius: var(--r-4); overflow: hidden; }
    .lsxd-loss .wrap { overflow-x: auto; }
    table.lstb { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 1320px; }
    table.lstb td:first-child { min-width: 205px; }
    table.lstb td:nth-child(2), table.lstb td:nth-child(3) { white-space: nowrap; }
    table.lstb td:nth-child(11), table.lstb td:nth-child(12) { white-space: nowrap; }
    table.lstb th {
      position: sticky; top: 0; z-index: 2;
      background: var(--paper-2); text-align: left; padding: 9px 10px;
      font-family: var(--ff-mono); font-size: 9.5px; font-weight: 600;
      letter-spacing: .1em; text-transform: uppercase; color: var(--ash);
      border-bottom: 1px solid var(--rule); white-space: nowrap;
    }
    table.lstb td { padding: 9px 10px; border-bottom: 1px solid var(--rule-hair); vertical-align: middle; height: 42px; }
    table.lstb tbody tr { cursor: pointer; }
    table.lstb tbody tr:hover { background: var(--paper-2); }
    table.lstb .num { text-align: right; font-family: var(--ff-mono); font-variant-numeric: tabular-nums; }
    table.lstb .bad  { color: #8a1f1f; font-weight: 700; }
    table.lstb .good { color: #1f6b3a; font-weight: 700; }
    table.lstb .mut  { color: var(--ash-3); }
    table.lstb tr.row-bad  td:first-child { box-shadow: inset 3px 0 0 #8a1f1f; }
    table.lstb tr.row-good td:first-child { box-shadow: inset 3px 0 0 #1f6b3a; }
    table.lstb tfoot td { background: var(--paper-2); font-weight: 700; border-top: 1px solid var(--rule); border-bottom: none; }
    .mcode { font-family: var(--ff-mono); font-size: 12px; }

    /* drawer chi tiết nguyên nhân (nội bộ trang) */
    .lsxd-dw-ov { position: fixed; inset: 0; z-index: 820; background: rgba(20,19,15,.42); animation: overlay-in 150ms ease; }
    .lsxd-dw {
      position: absolute; top: 0; bottom: 0; right: 0; width: min(560px, 94vw);
      background: var(--paper); box-shadow: -14px 0 48px rgba(0,0,0,.34);
      border-radius: 14px 0 0 14px; display: flex; flex-direction: column; overflow: hidden;
      animation: lsxd-slide 220ms cubic-bezier(.2,.8,.25,1);
    }
    @keyframes lsxd-slide { from { transform: translateX(100%); } to { transform: translateX(0); } }
    .lsxd-dw-h { padding: 16px 20px; background: var(--ink); color: var(--paper); }
    .lsxd-dw-h .k { font-family: var(--ff-mono); font-size: 9.5px; letter-spacing: .16em; text-transform: uppercase; color: #e8a075; }
    .lsxd-dw-h h3 { font-size: 18px; font-weight: 700; margin-top: 4px; }
    .lsxd-dw-h .x { position: absolute; top: 14px; right: 18px; background: rgba(245,241,232,.12); color: var(--paper); border: 0; width: 30px; height: 30px; border-radius: var(--r-2); cursor: pointer; font-size: 15px; }
    .lsxd-dw-b { padding: 18px 20px; overflow-y: auto; }
    .dwg { margin-bottom: 18px; }
    .dwg > .h { font-family: var(--ff-mono); font-size: 9.5px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--ash-2); padding-bottom: 6px; border-bottom: 1px solid var(--rule); margin-bottom: 10px; }
    .dwg .kv { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px 16px; }
    .dwg .kv > div > span { display: block; font-size: 11px; color: var(--ash-2); margin-bottom: 2px; }
    .dwg .kv > div > b { font-size: 14px; font-weight: 600; }
    .dwg p { font-size: 13.5px; line-height: 1.6; color: var(--ink); }
    .dwg ul { margin: 0; padding-left: 18px; font-size: 13.5px; line-height: 1.7; }

    /* bảng trong modal */
    .lsxd-form { font-size: 13px; }
    .lsxd-form .row3 { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 10px; margin-bottom: 12px; }
    .lsxd-form .row2 { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; margin-bottom: 12px; }
    .lsxd-form table { width: 100%; border-collapse: collapse; font-size: 12.5px; margin-top: 4px; }
    .lsxd-form th { background: var(--paper-2); text-align: left; padding: 7px 8px; font-family: var(--ff-mono); font-size: 9.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--ash); border-bottom: 1px solid var(--rule); }
    .lsxd-form td { padding: 7px 8px; border-bottom: 1px solid var(--rule-hair); }
    .lsxd-form td.num, .lsxd-form th.num { text-align: right; font-family: var(--ff-mono); font-variant-numeric: tabular-nums; }
    .lsxd-form .bad { color: #8a1f1f; font-weight: 700; }
    .lsxd-form .good { color: #1f6b3a; font-weight: 700; }
    .lsxd-note { font-size: 12px; color: var(--ash); margin-top: 8px; line-height: 1.5; }

    /* tem QR trong bản in */
    .tem-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .tem {
      border: 1px dashed #14130f; border-radius: 4px; padding: 8px;
      display: flex; gap: 8px; align-items: center; font-size: 10.5px; line-height: 1.35; color: #14130f;
    }
    .tem b { font-size: 12px; display: block; font-family: var(--ff-mono); }

    @media (max-width: 1180px) {
      .lsxd-info .fields { grid-template-columns: repeat(3, minmax(0,1fr)); }
    }
  </style>
</head>
<body>

<div id="app-shell" data-active="lsx" data-title="Lệnh sản xuất" data-crumb="<b>Sản xuất</b> · Lệnh sản xuất · chi tiết">

  <!-- (1) DẢI NÚT TRÊN CÙNG -->
  <div class="lsxd-bar" id="lsxBar"></div>

  <!-- (2) BẢNG THÔNG TIN LỆNH -->
  <div class="lsxd-info" id="lsxInfo"></div>

  <!-- (3) CÁC BƯỚC SẢN XUẤT -->
  <div class="lsxd-sec-h">
    <h2>Các bước sản xuất</h2>
    <span id="stepHint">6 bước · cuộn ngang để xem hết</span>
  </div>
  <div class="lsxd-steps" id="lsxSteps"></div>

  <!-- (4) PHÂN TÍCH LỖI HỎNG & QUÁ THỜI GIAN -->
  <div class="lsxd-sec-h">
    <h2>Phân tích lỗi hỏng &amp; quá thời gian</h2>
    <span>Bấm một dòng để xem nguyên nhân &amp; biện pháp khắc phục</span>
  </div>
  <div class="lsxd-loss">
    <div class="wrap"><table class="lstb" id="lossTb"></table></div>
  </div>

</div>

    var mine = all[LSX.id];
    if (!mine) mine = { steps: {} };
    if (!mine.steps) mine.steps = {};
    STEP_DEF.forEach(function (s) {
      if (!mine.steps[s.key]) mine.steps[s.key] = JSON.parse(JSON.stringify(seed[s.key]));
    });
    if (!mine.run) {
      var st = String(LSX.status || '').toLowerCase();
      mine.run = /hoàn thành|da dong|đã đóng|xong/.test(st) ? 'done'
               : /dự thảo|du thao|chờ|cho duyet/.test(st) ? 'idle'
               : /tạm dừng|tam dung|dừng/.test(st) ? 'paused' : 'running';
    }
    return mine;
  }

  /* ============================================================
     3. Tính toán tiến độ & thiệt hại
     ============================================================ */
  function stepRow(def) {
    var d = ST.steps[def.key] || {};
    var good = num(d.good), defect = num(d.defect), scrap = num(d.scrap);
    var total = good + defect + scrap;
    var actH = num(d.runH) + num(d.stopH);
    var stdH = num(d.stdH);
    var over = Math.max(0, Math.round((actH - stdH) * 10) / 10);
    var early = actH > 0 && actH < stdH ? Math.round((stdH - actH) * 10) / 10 : 0;
    var rate = total > 0 ? (good / total) * 100 : 0;
    var L = LOSS_DEF[def.key] || {};

    // quy đổi thiệt hại từ chính số lỗi/phế đã nhập — chặn trần năng lực 1 ca
    var aluKg = Math.min(scrap * (L.aluPerScrap || 0) * KG_PER_BAR, CAP.nhomKgCa);
    var glassM2 = Math.min(defect * (L.glassPerDefect || 0), CAP.boCa * 2) * M2_KINH_PER_CANH;
    var hinge = Math.min(defect * (L.hingePerDefect || 0), CAP.boCa);
    var reworkH = Math.round(defect * (L.reworkPerDefect || 0) * 10) / 10;
    var damage = 0;
    if (actH > 0) {
      damage += over * (PRICE.mayH + PRICE.congH);
      damage += reworkH * PRICE.congH;
      damage += aluKg * PRICE.nhomKg;
      damage += glassM2 * PRICE.kinhM2;
      damage += hinge * PRICE.banLeBo;
    }
    var isBad = over > 0 || scrap > 0 || (total > 0 && rate < 98);
    var isGood = !isBad && total > 0 && (early > 0 || rate >= 99.5);

    return {
      def: def, d: d, good: good, defect: defect, scrap: scrap, total: total,
      actH: actH, stdH: stdH, over: over, early: early, rate: rate,
      aluKg: aluKg, glassM2: glassM2, hinge: hinge, reworkH: reworkH,
      cause: (d.err ? (ERR_4M1E[d.err] || L.cause || '') : (L.cause || '')),
      damage: Math.round(damage), bad: isBad, ok: isGood, loss: L
    };
  }
  function allRows() { return STEP_DEF.map(stepRow); }

  function doneQty() {
    var last = ST.steps[STEP_DEF[5].key];
    if (last && num(last.good) > 0) return num(last.good);
    var prev = ST.steps[STEP_DEF[4].key];
    if (prev && num(prev.good) > 0) return Math.floor(num(prev.good) / 2); // 2 cánh = 1 bộ
    return 0;
  }
  function progressPct() {
    var done = 0;
    STEP_DEF.forEach(function (s) {
      var st = (ST.steps[s.key] || {}).status;
      if (st === 'done') done += 1; else if (st === 'doing') done += 0.5;
    });
    return Math.round((done / STEP_DEF.length) * 100);
  }

  /* ============================================================
     8. Kho — nguyên liệu & thành phẩm
     ============================================================ */
  function nvlList() {
    try {
      if (window.ERPInv && ERPInv.allItems) {
        var l = ERPInv.allItems().filter(function (i) { return i.kind === 'nvl'; });
        if (l.length) return l;
      }
    } catch (e) {}
    return NVL_FALLBACK;
  }
  function invItem(code) {
    var l = nvlList();
    for (var i = 0; i < l.length; i++) if (l[i].code === code) return l[i];
    return null;
  }
  // Tìm dòng THÀNH PHẨM trong sổ kho khớp với sản phẩm của lệnh
  // (ưu tiên mã, sau đó chấm điểm theo số từ khoá trùng trong tên)
  function normTxt(s) {
    return String(s || '').toLowerCase()
      .normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/đ/g, 'd')
      .replace(/[^a-z0-9]+/g, ' ').trim();
  }
  function tpItem() {
    var items = [];
    try { if (window.ERPInv && ERPInv.allItems) items = ERPInv.allItems().filter(function (i) { return i.kind === 'tp'; }); } catch (e) {}
    if (!items.length) return null;
    var want = '';
    try {
      if (window.ERPBOM) {
        var b = ERPBOM.get(LSX.productCode) || ERPBOM.byProduct(LSX.product);
        if (b) want = b.productCode || '';
      }
    } catch (e) {}
    var byCode = items.filter(function (i) { return i.code === LSX.productCode || (want && i.code === want); })[0];
    if (byCode) return byCode;
    var toks = normTxt(LSX.product).split(' ').filter(function (t) { return t.length > 1; });
    var best = null, bestScore = 0;
    items.forEach(function (i) {
      var it = normTxt(i.name).split(' ');
      var sc = 0;
      toks.forEach(function (t) { if (it.indexOf(t) >= 0) sc++; });
      if (sc > bestScore) { bestScore = sc; best = i; }
    });
    return bestScore >= 3 ? best : null;
  }

  function bomLines() {
    try {
      if (window.ERPBOM) {
        var ti = tpItem();
        var b = ERPBOM.get(LSX.productCode) || ERPBOM.byProduct(LSX.product) ||
                (ti ? (ERPBOM.get(ti.code) || ERPBOM.byProduct(ti.name)) : null);
        if (b && b.lines && b.lines.length) return b.lines;
      }
    } catch (e) {}
    return BOM_FALLBACK;
  }
  // Đã cấp = các phiếu xuất NVL gắn ref = mã lệnh + nền demo của ca đang chạy
  function issuedMap(qtyDone) {
    var map = {};
    bomLines().forEach(function (l, i) {
      var std = (Number(l.qty) || 0) * qtyDone * (1 + (Number(l.waste) || 0) / 100);
      var k = [1.02, 0.99, 1.0, 0.985, 1.012, 0.95, 1.0, 1.03, 1.0][i % 9];
      map[l.matCode] = Math.round(std * k * 100) / 100;
    });
    try {
      if (window.ERPInv && ERPInv.allTxns) {
        ERPInv.allTxns().forEach(function (t) {
          if (t.kind !== 'out' || t.ref !== LSX.id || !t._lsxIssue) return;
          (t.lines || []).forEach(function (l) {
            map[l.code] = Math.round(((map[l.code] || 0) + (Number(l.qty) || 0)) * 100) / 100;
          });
        });
      }
    } catch (e) {}
    return map;
  }

  function diffRows(qty) {
    var issued = issuedMap(qty);
    return bomLines().map(function (l) {
      var it = invItem(l.matCode) || {};
      var std = Math.round((Number(l.qty) || 0) * qty * (1 + (Number(l.waste) || 0) / 100) * 100) / 100;
      var got = Math.round((issued[l.matCode] || 0) * 100) / 100;
      return {
        code: l.matCode, name: l.matName || it.name || l.matCode, unit: l.unit || it.unit || '',
        price: it.price || 0, std: std, got: got, diff: Math.round((got - std) * 100) / 100
      };
    });
  }
  function diffTable(rows) {
    return '<table><thead><tr><th>Vật tư</th><th class="num">Định mức BOM</th><th class="num">Đã cấp</th><th class="num">Chênh lệch</th><th>Xử lý</th></tr></thead><tbody>' +
      rows.map(function (r) {
        // diff > 0: đã cấp nhiều hơn định mức → thừa, hoàn nhập kho
        // diff < 0: đã cấp ít hơn định mức → thiếu, phải trừ thêm (cấp bù)
        var cls = r.diff < -0.009 ? 'bad' : (r.diff > 0.009 ? 'good' : '');
        var act = r.diff < -0.009 ? 'Trừ thêm (cấp bù)' : (r.diff > 0.009 ? 'Hoàn nhập kho' : '—');
        return '<tr><td>' + esc(r.name) + '</td>' +
          '<td class="num">' + nf2(r.std) + ' ' + esc(r.unit) + '</td>' +
          '<td class="num">' + nf2(r.got) + ' ' + esc(r.unit) + '</td>' +
          '<td class="num ' + cls + '">' + (r.diff > 0 ? '+' : '') + nf2(r.diff) + '</td>' +
          '<td class="' + cls + '">' + act + '</td></tr>';
      }).join('') + '</tbody></table>';
  }

  function nextSC() {
    var arr = [];
    try { arr = JSON.parse(localStorage.getItem(SC_KEY) || '[]') || []; } catch (e) {}
    var max = 42;
    arr.forEach(function (r) { var m = /SC-(\d+)/.exec(r.id || ''); if (m) max = Math.max(max, parseInt(m[1], 10)); });
    return { id: 'SC-' + ('000' + (max + 1)).slice(-4), arr: arr };
  }
  function openSuCo() {
    var mopts = Object.keys(MACHINES).map(function (c) {
      return '<option value="' + c + '">' + esc(c + ' — ' + MACHINES[c]) + '</option>';
    }).join('');
    var body = '<div class="lsxd-form" id="frmSC">' +
      '<div class="row2">' +
        '<div class="fld"><label>Máy gặp sự cố</label><select id="scMay">' + mopts + '</select></div>' +
        '<div class="fld"><label>Loại sự cố</label><select id="scLoai">' + SUCO_TYPES.map(function (t) { return '<option>' + esc(t) + '</option>'; }).join('') + '</select></div>' +
      '</div>' +
      '<div class="row2">' +
        '<div class="fld"><label>Thời điểm xảy ra</label><input id="scLuc" value="' + todayStr() + ' ' + nowHM() + '"></div>' +
        '<div class="fld"><label>Mức độ</label><select id="scMuc"><option>Khẩn cấp — dừng máy</option><option selected>Trung bình — chạy cầm chừng</option><option>Thấp — theo dõi</option></select></div>' +
      '</div>' +
      '<div class="fld"><label>Mô tả sự cố</label><textarea id="scMoTa" style="height:70px" placeholder="Hiện tượng, tiếng kêu, thông số bất thường, đã xử lý tạm thế nào..."></textarea></div>' +
      '<p class="lsxd-note">Xác nhận sẽ tạo <b>phiếu sửa chữa</b> gắn với ' + esc(LSX.id) + ' và chuyển sang bộ phận Bảo trì cơ điện.</p>' +
      '</div>';
    ERPInteract.showModal({
      title: '⚠ Báo sự cố máy',
      body: body,
      primaryText: 'Tạo phiếu sửa chữa',
      secondaryText: 'Huỷ',
      onPrimary: function () {
        var may = document.getElementById('scMay').value;
        var loai = document.getElementById('scLoai').value;
        var luc = document.getElementById('scLuc').value.trim();
        var muc = document.getElementById('scMuc').value;
        var mt = document.getElementById('scMoTa').value.trim();
        if (!mt) { toast('Nhập mô tả sự cố để bảo trì xử lý được', 'warning'); return false; }
        var nx = nextSC();
        nx.arr.unshift({
          id: nx.id, machine: may, machineLabel: MACHINES[may] || '', type: loai,
          at: luc, level: muc, desc: mt, lsx: LSX.id, by: LSX.manager || 'Xưởng',
          status: 'Chờ tiếp nhận', created: todayStr()
        });
        try { localStorage.setItem(SC_KEY, JSON.stringify(nx.arr)); } catch (e) {}
        toast('Đã tạo phiếu sửa chữa <a href="19-sua-chua.html?sc=' + encodeURIComponent(nx.id) + '" class="lnk">' + esc(nx.id) + '</a> cho máy <b>' + esc(may) + '</b> — bấm để mở', 'success');
      }
    });
    if (window.lucide) window.lucide.createIcons();
  }

  /* ============================================================
     11. Hành động điều khiển lệnh & bước
     ============================================================ */
  function setRun(mode, msg, type) {
    ST.run = mode; saveState(); renderBar(); renderInfo();
    toast(msg, type || 'success');
  }
  function stepStart(key) {
    var d = ST.steps[key];
    if (!d) return;
    if (d.status === 'done') { toast('Bước này đã kết thúc — mở lại bằng nút Bắt đầu của lệnh', 'warning'); return; }
    d.status = 'doing'; d.start = d.start || nowHM(); d.end = '';
    if (ST.run !== 'running') ST.run = 'running';
    saveState(); renderAll();
    toast('Đã bắt đầu bước <b>' + esc(stepName(key)) + '</b> lúc ' + esc(d.start), 'success');
  }
  function stepEnd(key) {
    var d = ST.steps[key];
    if (!d) return;
    d.status = 'done'; d.end = nowHM(); if (!d.start) d.start = d.end;
    saveState(); renderAll();
    toast('Đã kết thúc bước <b>' + esc(stepName(key)) + '</b> lúc ' + esc(d.end), 'success');
  }
  function stepName(key) {
    var s = STEP_DEF.filter(function (x) { return x.key === key; })[0];
    return s ? s.name : key;
  }
  function stepSave(key, card) {
    var d = ST.steps[key];
    if (!d) return;
    card.querySelectorAll('[data-f]').forEach(function (el) {
      var f = el.getAttribute('data-f');
      d[f] = (f === 'err' || f === 'note') ? el.value : num(el.value);
    });
    if (d.good + d.defect + d.scrap > 0 && d.status === 'wait') d.status = 'doing';
    saveState();
    // ghi vào QuoteStore nếu có
    try {
      if (window.QuoteStore && QuoteStore.updateLSXProductProgress) {
        QuoteStore.updateLSXProductProgress(LSX.id, key, [{
          code: LSX.productCode, total: d.good + d.defect + d.scrap, good: d.good, defect: d.defect + d.scrap
        }]);
      }
    } catch (e) {}
    renderAll();
    toast('Đã lưu bước <b>' + esc(stepName(key)) + '</b>: ' + nf(d.good) + ' đạt · ' + nf(d.defect) + ' lỗi · ' + nf(d.scrap) + ' phế', 'success');
  }

  /* ============================================================
     12. Gắn sự kiện & khởi động
     ============================================================ */
  function renderAll() { renderBar(); renderInfo(); renderSteps(); renderLoss(); }

  function onClick(e) {
    var btn = e.target.closest('[data-act]');
    if (btn) {
      var act = btn.getAttribute('data-act');
      if (btn.disabled) return;
      if (act === 'lsx-start') return setRun('running', 'Đã <b>bắt đầu</b> lệnh ' + esc(LSX.id) + ' — ' + esc(LSX.shift), 'success');
      if (act === 'lsx-pause') return setRun('paused', 'Đã <b>tạm dừng</b> lệnh ' + esc(LSX.id) + ' lúc ' + nowHM(), 'warning');
      if (act === 'lsx-stop') {
        return ERPInteract.showModal({
          title: '■ Kết thúc lệnh ' + LSX.id,
          body: '<p>Kết thúc lệnh sẽ chốt số liệu các bước và khoá nhập liệu. Bạn chắc chắn?</p>',
          primaryText: 'Kết thúc lệnh', secondaryText: 'Quay lại',
          onPrimary: function () { setRun('done', 'Đã <b>kết thúc</b> lệnh ' + esc(LSX.id) + ' · đạt ' + nf(doneQty()) + '/' + nf(LSX.qty) + ' ' + esc(LSX.unit), 'success'); }
        });
      }
      if (act === 'sc-open') return openSuCo();
      if (act === 'nvl-open') return openNVL();
      if (act === 'tp-open') return openTP();
      if (act === 'print-lsx') return printLSX();
      if (act === 'print-tem') return printTem();
      if (act === 'stp-start') return stepStart(btn.getAttribute('data-step'));
      if (act === 'stp-end') return stepEnd(btn.getAttribute('data-step'));
      if (act === 'stp-save') return stepSave(btn.getAttribute('data-step'), btn.closest('.stp'));
    }
    var tr = e.target.closest('[data-row-drill]');
    if (tr && !e.target.closest('a')) openDrill(tr.getAttribute('data-row-drill'));
  }

  var booted = false;
  function boot() {
    if (booted) return;
    if (!document.getElementById('lsxBar')) return;
    booted = true;
    LSX = pickLSX();
    ST = loadState();
    document.title = LSX.id + ' · Lệnh sản xuất — ERP NHÔM OWIN';
    renderAll();
    document.addEventListener('click', onClick);
  }

  document.addEventListener('erp:ready', boot);
  document.addEventListener('DOMContentLoaded', function () { setTimeout(boot, 80); });
})();
</script>
</body>
</html>
