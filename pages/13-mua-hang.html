  function nextPO() {
    var max = 0;
    allPO().forEach(function (p) {
      var m = /^PO-2026-(\d+)$/.exec(p.id || '');
      if (m) max = Math.max(max, parseInt(m[1], 10));
    });
    return 'PO-2026-' + ('000' + (max + 1)).slice(-4);
  }
  function paidOf(p) { return (p.payments || []).reduce(function (s, x) { return s + (Number(x.amount) || 0); }, 0); }
  function debtOf(p) { return p.status === 'đã nhập' ? Math.max(0, (p.total || 0) - paidOf(p)) : 0; }
  /* trễ giao (PO chưa nhận) hoặc trễ nhận (PO đã nhập): >0 là trễ */
  function lateDays(p) {
    if (!p.due) return 0;
    var end = p.status === 'đã nhập' ? p.recvDate : TODAY;
    return Math.round((toDate(end) - toDate(p.due)) / 86400000);
  }
  var PENALTY_RATE = 0.00135;  /* phạt chậm giao 0,135%/ngày trên giá trị PO, trần 8% */
  var INTEREST_RATE = 0.0005;  /* lãi chậm trả ~0,05%/ngày trên số còn nợ */
  function penalty(p) {
    var d = lateDays(p);
    if (d <= 0) return 0;
    return Math.round(Math.min((p.total || 0) * PENALTY_RATE * d, (p.total || 0) * 0.08));

    var lines = (o.lines || []).map(function (l) {
      var q = Number(l.qty) || 0, pr = Number(l.price) || 0;
      return { code: l.code, name: l.name, unit: l.unit || '', qty: q, price: pr, amount: Math.round(q * pr), recvQty: 0, lot: '' };
    }).filter(function (l) { return l.qty > 0; });
    var rec = po({

  function receivePO(id, opt) {
    var p = getPO(id);
    if (!p) return { ok: false, message: 'Không tìm thấy PO' };
    opt = opt || {};
    var map = {};
    (opt.lines || []).forEach(function (x) { map[x.code] = x; });
    var invLines = [];
    p.lines.forEach(function (l) {
      var x = map[l.code] || {};
      var q = (x.recvQty != null && x.recvQty !== '') ? Number(x.recvQty) : l.qty;
      l.recvQty = q; l.lot = x.lot || l.lot || '';
      if (q > 0) invLines.push({ code: l.code, name: l.name, unit: l.unit, qty: q, price: l.price, lot: l.lot });
    });
    if (!invLines.length) return { ok: false, message: 'Phải nhập số lượng thực nhận > 0 cho ít nhất 1 dòng' };
    var res = { ok: true, txn: { id: 'PNK-' + id.slice(-4) } };
    if (g.ERPInv && g.ERPInv.post) {
      res = g.ERPInv.post({
        kind: 'in', type: 'nhap_mua', typeLabel: 'Nhập mua NVL',
        date: opt.date || TODAY, partner: nccName(p.nccKey), ref: p.id,
        note: 'Nhận hàng theo đơn đặt hàng ' + p.id + (opt.note ? ' — ' + opt.note : ''),
        lines: invLines
      });
      if (!res.ok) return res;
    }
    p.status = 'đã nhập';
    p.recvDate = opt.date || TODAY;
    p.pnkId = res.txn.id;
    p.payDue = addDays(p.recvDate, parseInt(String(p.payTerm).replace(/\D+/g, ''), 10) || 30);
    psave();
    return { ok: true, po: p, pnk: res.txn };
  }

  function payPO(id, opt) {
    var p = getPO(id);
    if (!p) return { ok: false, message: 'Không tìm thấy PO' };
    var amount = Math.round(Number(opt.amount) || 0);
    if (amount <= 0) return { ok: false, message: 'Số tiền trả phải lớn hơn 0' };
    var con = debtOf(p);
    if (amount > con) return { ok: false, message: 'Số tiền trả (' + vnd(amount) + ') vượt quá số còn nợ (' + vnd(con) + ')' };
    var rec = null;
    if (g.ERPCash && g.ERPCash.create) {
      rec = g.ERPCash.create({
        kind: 'chi', type: 'chi_nvl', typeLabel: 'Chi trả nhà cung cấp',
        date: opt.date || TODAY, partner: nccName(p.nccKey),
        method: opt.method === 'tm' ? 'tm' : 'ck', amount: amount,
        reason: 'Thanh toán đơn đặt hàng ' + p.id + ' — ' + p.content + (opt.account ? ' · TK: ' + opt.account : ''),
        createdBy: 'Kế toán thanh toán', ref: p.id
      });
    }
    var pay = {
      id: rec ? rec.id : 'PC-2026-' + ('00' + ((p.payments || []).length + 90)).slice(-3),
      date: opt.date || TODAY, amount: amount, method: opt.method === 'tm' ? 'tm' : 'ck',
      account: opt.account || ''
    };
    p.payments.push(pay);
    psave();
    return { ok: true, pay: pay, po: p };
  }

  /* Công nợ gộp theo NCC */
  function debtByNcc() {
    return NCC.map(function (n) {
      var ps = allPO().filter(function (p) { return p.nccKey === n.key && p.status === 'đã nhập'; });
      var phatsinh = ps.reduce(function (s, p) { return s + (p.total || 0); }, 0);
      var datra = ps.reduce(function (s, p) { return s + paidOf(p); }, 0);
      var connno = ps.reduce(function (s, p) { return s + debtOf(p); }, 0);
      var open = ps.filter(function (p) { return debtOf(p) > 0; })
        .sort(function (a, b) { return dk(a.payDue) - dk(b.payDue); });
      var han = open.length ? open[0].payDue : '';
      var qh = open.reduce(function (m, p) { return Math.max(m, payOverdue(p)); }, 0);
      var lai = open.reduce(function (s, p) { return s + interest(p); }, 0);
      return {
        key: n.key, ten: n.ten, soPO: ps.length, phatsinh: phatsinh, datra: datra,
        connno: connno, han: han, quahan: qh, lai: lai, pos: ps, open: open

    });
  }

    return dmem;
  }
  function dsave() { try { g.localStorage.setItem(DKEY, JSON.stringify(dmem)); } catch (e) {} }

  var DEPT_OF = { 'Kho vật tư': 'Kho', 'Kho nhôm – kính': 'Kho', 'Xưởng sản xuất': 'Sản xuất' };
  /* Gộp DNM nội bộ + DNM sinh từ ERPPurchase (trang Kho bấm "Đề nghị mua NVL") */
  function allDXM() {
    var rows = dload().rows.slice();
    try {
      if (g.ERPPurchase && g.ERPPurchase.all) {
        g.ERPPurchase.all().forEach(function (r) {
          if (rows.some(function (x) { return x.id === r.id; })) return;
          var l = (r.lines || [])[0] || {};
          rows.push({
            id: r.id, date: r.date, dept: DEPT_OF[r.from] || r.from || 'Kho',
            nguoi: r.from || 'Thủ kho nhôm – kính', code: l.code || '',
            noidung: (r.lines || []).length > 1 ? (l.name + ' + ' + ((r.lines.length - 1) + ' mã khác')) : (l.name || r.note || ''),
            qty: l.qty || 0, unit: l.unit || '', price: l.price || 0,
            lydo: r.ref || r.note || 'Cảnh báo tồn dưới định mức',
            uutien: 'Cao', status: /duyệt/.test(r.status || '') && r.status !== 'chờ duyệt' ? 'Đã duyệt' : 'Chờ duyệt',
            nccKey: (function () {
              var found = NCC.filter(function (n) { return n.ten === l.supplier; })[0];
              return found ? found.key : (mat(l.code) || {}).sup || 'dongan';
            })(), external: true
          });
        });
      }
    } catch (e) {}
    return rows.sort(function (a, b) { return dk(b.date) - dk(a.date) || String(b.id).localeCompare(String(a.id)); });
  }
  function getDXM(id) { return allDXM().filter(function (r) { return r.id === id; })[0] || null; }
  function setDXM(id, patch) {
    var r = dload().rows.filter(function (x) { return x.id === id; })[0];
    if (!r) { r = getDXM(id); if (r) { dload().rows.push(r); } }
    if (!r) return null;
    Object.keys(patch || {}).forEach(function (k) { r[k] = patch[k]; });
    dsave();
    return r;
  }

  /* Đề xuất tự động: gộp BOM các LSX đang chạy + mã dưới định mức */
  function autoRows() {
    var rows = [], seen = {};
    try {
      if (g.StockStore && g.StockStore.suggestFromLSX) {
        g.StockStore.suggestFromLSX().forEach(function (r) {
          seen[r.code] = 1;
          var m = mat(r.code) || {};
          rows.push({
            code: r.code, name: m.name || r.name, unit: m.unit || r.unit,
            demand: r.demand, onHand: r.onHand, shortage: r.shortage,
            sup: (function () { var f = NCC.filter(function (n) { return n.ten === r.supplier; })[0]; return f ? f.key : (m.sup || 'dongan'); })(),
            price: m.price || r.price, qty: r.suggestQty || r.shortage,
            lsx: r.lsxIds || [], from: 'BOM lệnh sản xuất'
          });
        });
      }
    } catch (e) {}
    /* bổ sung các mã dưới tồn tối thiểu chưa có trong danh sách */
    MAT.forEach(function (m) {
      if (seen[m.code]) return;
      var oh = onHand(m.code), mn = minStock(m.code);
      if (!mn || oh >= mn) return;
      var need = Math.ceil(mn * 2 - oh);
      rows.push({
        code: m.code, name: m.name, unit: m.unit, demand: mn, onHand: oh,
        shortage: Math.max(0, mn - oh), sup: m.sup, price: m.price, qty: need,
        lsx: [], from: 'Dưới định mức tồn'
      });
    });
    return rows.sort(function (a, b) { return (b.shortage - a.shortage) || (b.demand - a.demand); });
  }

  var stack = [];
  function chipCls(st) {
    st = String(st || '').toLowerCase();
    if (/đã nhập|đã duyệt|đã trả|hoàn thành|đạt/.test(st)) return 'ok';
    if (/chờ|đã đặt|đang giao|soạn/.test(st)) return 'warn';
    if (/từ chối|huỷ|hủy|trễ|quá hạn/.test(st)) return 'bad';
    return '';
  }
  /* groups: [{title, icon, fields:[{key,label,val,wide,edit,type,options}]}] */
  function openDrawer(o) {
    ensureCss();
    var ov = document.createElement('div');
    ov.className = 'ow-ov';
    ov.style.zIndex = 900 + stack.length * 10;
    var tabsHtml = '', panes = '';
    if (o.tabs && o.tabs.length) {
      tabsHtml = '<div class="ow-dtabs">' + o.tabs.map(function (t, i) {
        return '<button class="ow-dtab' + (i === 0 ? ' on' : '') + '" data-owdt="' + i + '" data-no-interact="true">' + esc(t.label) + '</button>';
      }).join('') + '</div>';
      panes = o.tabs.map(function (t, i) {
        return '<div data-owdp="' + i + '"' + (i ? ' style="display:none"' : '') + '>' + (t.html || '') + '</div>';
      }).join('');
    } else {
      panes = groupsHtml(o.groups) + (o.itemsHtml || '') + (o.extraHtml || '');
    }
    ov.innerHTML = '<div class="ow-dr" role="dialog" aria-modal="true">' +
      '<div class="ow-dh" style="position:relative">' +
        '<div class="cat">' + esc(o.cat || 'Bản ghi') + '</div>' +
        '<div class="acts">' +
          (o.editable === false ? '' : '<button class="ow-hb" data-ow="edit" data-no-interact="true"><i data-lucide="pencil" style="width:12px;height:12px"></i> Sửa</button>') +
          (o.onPrint ? '<button class="ow-hb" data-ow="print" data-no-interact="true"><i data-lucide="printer" style="width:12px;height:12px"></i> In</button>' : '') +
          '<button class="ow-hb" data-ow="close" data-no-interact="true"><i data-lucide="x" style="width:12px;height:12px"></i></button>' +
        '</div>' +
        '<div class="idr"><b>' + esc(o.id || '') + '</b>' +
          (o.status ? '<span class="ow-chip ' + chipCls(o.status) + '">' + esc(o.status) + '</span>' : '') + '</div>' +
        (o.sub ? '<div class="sub">' + o.sub + '</div>' : '') +
      '</div>' + tabsHtml +
      '<div class="ow-db">' + panes + '</div>' +
      (o.actionsHtml ? '<div class="ow-df">' + o.actionsHtml + '</div>' : '') +
    '</div>';
    document.body.appendChild(ov);
    stack.push(ov);
    if (g.lucide) try { g.lucide.createIcons(); } catch (e) {}

    ov.addEventListener('click', function (e) {
      var t;
      if (e.target === ov || e.target.closest('[data-ow="close"]')) { e.stopPropagation(); return closeTop(); }
      if ((t = e.target.closest('[data-owdt]'))) {
        var i = t.getAttribute('data-owdt');
        ov.querySelectorAll('.ow-dtab').forEach(function (x) { x.classList.toggle('on', x === t); });
        ov.querySelectorAll('[data-owdp]').forEach(function (p) { p.style.display = (p.getAttribute('data-owdp') === i) ? '' : 'none'; });
        ov.querySelector('.ow-db').scrollTop = 0;
        if (g.lucide) try { g.lucide.createIcons(); } catch (er) {}
        return;
      }
      if (e.target.closest('[data-ow="print"]')) { e.stopPropagation(); if (o.onPrint) o.onPrint(); return; }
      if (e.target.closest('[data-ow="edit"]')) { e.stopPropagation(); return setEdit(ov, o, true); }
      if (e.target.closest('[data-ow="cancel"]')) { e.stopPropagation(); return setEdit(ov, o, false); }
      if (e.target.closest('[data-ow="save"]')) {
        e.stopPropagation();
        var vals = {};
        ov.querySelectorAll('[data-owk]').forEach(function (inp) { vals[inp.getAttribute('data-owk')] = inp.value; });
        if (o.onSave) o.onSave(vals);
        return;
      }
    });
    return ov;
  }
  function groupsHtml(groups) {
    return (groups || []).map(function (gr) {
      return '<div class="ow-gh"><i data-lucide="' + (gr.icon || 'file-text') + '" style="width:12px;height:12px"></i> ' + esc(gr.title) + '</div>' +
        '<div class="ow-grid">' + (gr.fields || []).filter(function (f) { return f; }).map(function (f) {
          var meta = f.edit ? encodeURIComponent(JSON.stringify({
            key: f.key, type: f.type || 'text', options: f.options || [],
            raw: f.raw != null ? f.raw : String(f.val == null ? '' : f.val).replace(/<[^>]*>/g, '')
          })) : '';
          return '<div class="ow-f' + (f.wide ? ' wide' : '') + '" data-owf="' + esc(f.key || '') + '"' +
            (meta ? ' data-owedit="' + meta + '"' : '') + '>' +
            '<label>' + esc(f.label) + '</label>' +
            '<b>' + (f.val == null ? '—' : f.val) + '</b>' +
          '</div>';
        }).join('') + '</div>';

  function setEdit(ov, o, on) {
    ov.querySelectorAll('[data-owf]').forEach(function (cell) {
      var raw = cell.getAttribute('data-owedit');
      if (!raw) return;
      var meta = JSON.parse(decodeURIComponent(raw));
      var b = cell.querySelector('b'), inp = cell.querySelector('[data-owk]');
      if (on) {
        if (inp) return;
        b.style.display = 'none';
        var el;
        if (meta.type === 'select') {
          el = document.createElement('select');
          el.innerHTML = (meta.options || []).map(function (op) {
            var v = (typeof op === 'string') ? op : op.v, t = (typeof op === 'string') ? op : op.t;
            return '<option value="' + esc(v) + '"' + (String(v) === String(meta.raw) ? ' selected' : '') + '>' + esc(t) + '</option>';
          }).join('');
        } else if (meta.type === 'textarea') {
          el = document.createElement('textarea'); el.rows = 2; el.value = meta.raw;
        } else {
          el = document.createElement('input');
          el.type = meta.type === 'number' ? 'number' : 'text';
          el.value = meta.raw;
        }
        el.setAttribute('data-owk', meta.key);
        el.setAttribute('data-no-interact', 'true');
        cell.appendChild(el);
      } else {
        if (b) b.style.display = '';
        if (inp) inp.remove();
      }
    });
    var foot = ov.querySelector('.ow-df');
    if (foot) {
      if (on) {
        if (!foot.getAttribute('data-saved-html')) foot.setAttribute('data-saved-html', foot.innerHTML);
        foot.innerHTML = '<button class="btn btn-secondary" data-ow="cancel" data-no-interact="true">Huỷ</button>' +
          '<button class="btn btn-primary" data-ow="save" data-no-interact="true"><i data-lucide="check" style="width:14px;height:14px"></i> Lưu thay đổi</button>';
      } else if (foot.getAttribute('data-saved-html')) {
        foot.innerHTML = foot.getAttribute('data-saved-html');
      }
    }
    var eb = ov.querySelector('[data-ow="edit"]');
    if (eb) eb.style.display = on ? 'none' : '';
    if (g.lucide) try { g.lucide.createIcons(); } catch (e) {}
  }
  function closeTop() {
    var ov = stack.pop();
    if (!ov) return;
    ov.classList.add('leaving');

  function closeAll() { while (stack.length) closeTop(); }
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape' || !stack.length) return;
    if (document.querySelector('.erp-print-overlay') || document.querySelector('.erp-modal-overlay')) return;
    closeTop();
  });

  /* Bắt link .lnk ở tầng window (capture) — chạy TRƯỚC ERPPeek của layout.js,
     để các mã bản ghi của module Thu mua mở đúng drawer dữ liệu của trang này. */
  function bindLnk(rules) {
    g.addEventListener('click', function (e) {
      if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
      var a = e.target && e.target.closest ? e.target.closest('a.lnk[href]') : null;
      if (!a) return;
      var h = a.getAttribute('href') || '';
      for (var i = 0; i < rules.length; i++) {
        var m = rules[i].re.exec(h);
        if (m) { e.preventDefault(); e.stopPropagation(); rules[i].fn(decodeURIComponent(m[1])); return; }
      }
    }, true);
  }

  /* Điều hướng thẳng sang trang khác của module Thu mua (kèm tham số bản ghi) */
  function goTo(page, key) {
    return function (id) { g.location.href = page + '?' + key + '=' + encodeURIComponent(id); };
  }

  /* Drawer phiếu nhập kho (đọc thẳng sổ kho ERPInv) */
  function openPNK(id) {
    var t = (g.ERPInv && g.ERPInv.getTxn) ? g.ERPInv.getTxn(id) : null;
    if (!t) { toast('Không tìm thấy phiếu nhập kho <b>' + esc(id) + '</b>', 'warning'); return; }
    openDrawer({
      cat: 'Phiếu nhập kho', id: t.id, status: t.typeLabel || 'Đã ghi sổ', editable: false,
      sub: esc(t.partner || '') + ' · ' + esc(t.date || '') + ' · <b>' + vnd(t.total || 0) + '</b>',
      groups: [{ title: 'Thông tin phiếu', icon: 'package-check', fields: [
        { key: 'date', label: 'Ngày nhập', val: esc(t.date) },
        { key: 'partner', label: 'Đối tượng giao hàng', val: esc(t.partner || '—') },
        { key: 'ref', label: 'Chứng từ gốc', val: t.ref ? '<a href="13-mua-hang.html?po=' + encodeURIComponent(t.ref) + '" class="lnk">' + esc(t.ref) + '</a>' : '—' },
        { key: 'total', label: 'Tổng giá trị', val: '<span style="color:var(--rust)">' + vnd(t.total || 0) + '</span>' },
        { key: 'note', label: 'Diễn giải', val: esc(t.note || '—'), wide: true }
      ] }],
      itemsHtml: '<div class="ow-gh"><i data-lucide="list" style="width:12px;height:12px"></i> Dòng vật tư nhập kho</div>' +
        '<table class="ow-it"><thead><tr><th>Mã NVL</th><th>Tên vật tư</th><th>ĐVT</th><th class="r">SL nhập</th><th>Số lô</th><th class="r">Đơn giá</th><th class="r">Thành tiền</th></tr></thead><tbody>' +
        (t.lines || []).map(function (l) {
          return '<tr><td><b>' + esc(l.code) + '</b></td><td>' + esc(l.name) + '</td><td>' + esc(l.unit || '') + '</td>' +
            '<td class="r">' + num2(l.qty) + '</td><td>' + esc(l.lot || '—') + '</td>' +
            '<td class="r">' + vnd(l.price) + '</td><td class="r"><b>' + vnd(l.amount) + '</b></td></tr>';
        }).join('') + '</tbody></table>',
      actionsHtml: '<a class="btn btn-secondary" href="05-kho.html?pnk=' + encodeURIComponent(t.id) + '" data-pk-nav="1"><i data-lucide="external-link" style="width:14px;height:14px"></i> Mở tại màn Kho</a>'
    });
  }

  function toast(html, type, ms) {
    if (g.ERPInteract && g.ERPInteract.showToast) g.ERPInteract.showToast(html, type || 'success', ms || 5200);
  }
  function qp(name) {
    var m = new RegExp('[?&]' + name + '=([^&#]*)').exec(g.location.search);
    return m ? decodeURIComponent(m[1].replace(/\+/g, ' ')) : '';
  }
  function tile(l, v, s) {
    return '<div class="ow-tile"><div class="l">' + l + '</div><div class="v">' + v + '</div><div class="s">' + (s || '') + '</div></div>';
  }
  function sign(l, r) {
    return '<div class="pdoc-sign"><div><b>' + l + '</b><i>(Ký, ghi rõ họ tên)</i><div class="sp"></div></div>' +
      '<div><b>' + r + '</b><i>(Ký, ghi rõ họ tên)</i><div class="sp"></div></div></div>';
  }
  function preview(title, bodyHtml) {
    if (g.ERPPrint && g.ERPPrint.preview) {
      var ov = g.ERPPrint.preview({ title: title, printTitle: title, bodyHtml: bodyHtml });
      var el = document.querySelector('.erp-print-overlay');
      if (el) el.style.zIndex = '9000';
      return ov;
    }
  }
  function docHead() {
    return (g.ERPPrint && g.ERPPrint.docHead) ? g.ERPPrint.docHead() : '';
  }
  function words(n) { return (g.ERPCash && g.ERPCash.toWords) ? g.ERPCash.toWords(n) : fmt(n) + ' đồng'; }

  g.OwinCore = {
    TODAY: TODAY, THIS_MONTH: THIS_MONTH, RED: RED, GREEN: GREEN, AMBER: AMBER, STEEL: STEEL,
    esc: esc, fmt: fmt, vnd: vnd, num2: num2, gon: gon, dk: dk, dstr: dstr, toDate: toDate,
    addDays: addDays, daysLeft: daysLeft, monthOf: monthOf,
    warnRed: warnRed, warnGreen: warnGreen, DASH: DASH,
    CRIT: CRIT, NCC: NCC, ncc: ncc, nccName: nccName, score: score, rank: rank, rankColor: rankColor, rankChip: rankChip,
    MAT: MAT, mat: mat, onHand: onHand, minStock: minStock,
    allPO: allPO, getPO: getPO, nextPO: nextPO, createPO: createPO, receivePO: receivePO, payPO: payPO,
    paidOf: paidOf, debtOf: debtOf, lateDays: lateDays, penalty: penalty, payOverdue: payOverdue,
    interest: interest, debtByNcc: debtByNcc, savePO: psave,
    allDXM: allDXM, getDXM: getDXM, setDXM: setDXM, autoRows: autoRows,
    openDrawer: openDrawer, closeDrawer: closeTop, closeAllDrawers: closeAll, ensureCss: ensureCss,
    toast: toast, qp: qp, tile: tile, sign: sign, preview: preview, docHead: docHead, words: words,
    bindLnk: bindLnk, openPNK: openPNK, goTo: goTo
  };
  ensureCss();
})(window);

</script>
<script>
/* ===== 13-mua-hang.html — PO mua hàng (2 màn: đã đặt / đã nhập) ===== */
(function () {
  'use strict';
  var C = window.OwinCore;
  var esc = C.esc, fmt = C.fmt, vnd = C.vnd, gon = C.gon, num2 = C.num2;

  var VIEW = 'dat';
  var Q = '';

  function nccLink(key) {
    return '<a href="21-nha-cung-cap.html?ncc=' + encodeURIComponent(key) + '" class="lnk">' + esc(C.nccName(key)) + '</a>';
  }
  function poLink(id) { return '<a href="13-mua-hang.html?po=' + encodeURIComponent(id) + '" class="lnk">' + esc(id) + '</a>'; }
  function pnkLink(id) { return id ? '<a href="05-kho.html?pnk=' + encodeURIComponent(id) + '" class="lnk">' + esc(id) + '</a>' : C.DASH; }
  function pcLink(id) { return '<a href="15-ke-toan.html?pc=' + encodeURIComponent(id) + '" class="lnk">' + esc(id) + '</a>'; }

  function statusBadge(p) {
    var s = p.status;
    var cls = s === 'đã nhập' ? 'success' : s === 'đang giao' ? 'blue' : (C.lateDays(p) > 0 ? 'danger' : 'yellow');
    var txt = s === 'đã nhập' ? 'Đã nhập kho' : s === 'đang giao' ? 'Đang trên đường' : 'Chờ giao';
    return '<span class="badge badge-' + cls + '">' + txt + '</span>';
  }
  /* Cột cảnh báo — chỉ tô màu các dòng thực sự lệch chuẩn */
  function warnDat(p) {
    var d = C.lateDays(p);
    if (d > 0) return C.warnRed('Trễ giao ' + d + ' ngày · phạt ' + gon(C.penalty(p)));
    var left = C.daysLeft(p.due);
    if (p.status === 'đang giao' || left >= 12) return C.warnGreen('Còn ' + left + ' ngày · NCC xác nhận đúng hẹn');
    return C.DASH;
  }
  function warnNhap(p) {
    var d = C.lateDays(p);
    var ok = p.lines.every(function (l) { return (l.recvQty || 0) >= l.qty; });
    if (d > 0) return C.warnRed('Nhận trễ ' + d + ' ngày · phạt ' + gon(C.penalty(p)));
    if (d < 0 && ok) return C.warnGreen('Giao sớm ' + (-d) + ' ngày · đủ 100%');
    if (!ok) return C.warnRed('Thiếu ' + num2(p.lines.reduce(function (s, l) { return s + (l.qty - (l.recvQty || 0)); }, 0)) + ' ' + p.lines[0].unit + ' · đã lập biên bản');
    return C.DASH;
  }

  function listOf(view) {
    var all = C.allPO().filter(function (p) { return view === 'nhap' ? p.status === 'đã nhập' : p.status !== 'đã nhập'; });
    if (Q) {
      var q = Q.toLowerCase();
      all = all.filter(function (p) {
        return (p.id + ' ' + p.content + ' ' + C.nccName(p.nccKey)).toLowerCase().indexOf(q) >= 0;
      });
    }
    return all.sort(function (a, b) { return C.dk(b.date) - C.dk(a.date); });
  }

  /* ---------- KPI ---------- */
  function renderKpi() {
    var pend = C.allPO().filter(function (p) { return p.status !== 'đã nhập'; });
    var recv = C.allPO().filter(function (p) { return p.status === 'đã nhập'; });
    var late = pend.filter(function (p) { return C.lateDays(p) > 0; });
    var thang = recv.filter(function (p) { return C.monthOf(p.recvDate) === C.THIS_MONTH; });
    var no = recv.reduce(function (s, p) { return s + C.debtOf(p); }, 0);
    document.getElementById('poStrip').innerHTML =
      C.tile('PO đang chờ giao', pend.length, gon(pend.reduce(function (s, p) { return s + p.total; }, 0)) + ' giá trị') +
      C.tile('PO trễ hẹn giao', '<span style="color:' + C.RED + '">' + late.length + '</span>', 'phạt ước ' + gon(late.reduce(function (s, p) { return s + C.penalty(p); }, 0))) +
      C.tile('PO nhập tháng ' + C.THIS_MONTH, thang.length, gon(thang.reduce(function (s, p) { return s + p.total; }, 0))) +
      C.tile('Còn nợ nhà cung cấp', '<span style="color:' + C.RED + '">' + gon(no) + '</span>', recv.filter(function (p) { return C.debtOf(p) > 0; }).length + ' PO chưa tất toán');
    document.getElementById('poSub').textContent =
      pend.length + ' PO chờ giao · ' + late.length + ' PO trễ hẹn · còn nợ NCC ' + gon(no);
  }

  /* ---------- Bảng ---------- */
  function renderTabs() {
    var nd = C.allPO().filter(function (p) { return p.status !== 'đã nhập'; }).length;
    var nn = C.allPO().filter(function (p) { return p.status === 'đã nhập'; }).length;
    document.getElementById('poTabs').innerHTML =
      '<button class="ow-vtab' + (VIEW === 'dat' ? ' on' : '') + '" data-poview="dat" data-no-interact="true">' +
        '<i data-lucide="send" style="width:15px;height:15px"></i> PO đã đặt <span class="n">' + nd + '</span></button>' +
      '<button class="ow-vtab' + (VIEW === 'nhap' ? ' on' : '') + '" data-poview="nhap" data-no-interact="true">' +
        '<i data-lucide="package-check" style="width:15px;height:15px"></i> PO đã nhập <span class="n">' + nn + '</span></button>';
  }

  function renderTable() {
    var rows = listOf(VIEW), html;
    if (VIEW === 'dat') {
      document.getElementById('poThead').innerHTML =
        '<tr><th>Mã PO</th><th>Ngày đặt</th><th>Nhà cung cấp</th><th>Nội dung</th><th class="num">Giá trị</th>' +
        '<th>Ngày hẹn giao</th><th>Trễ giao</th><th>Trạng thái</th><th style="width:200px">Thao tác</th></tr>';
      html = rows.map(function (p) {
        return '<tr class="ow-row" data-po="' + esc(p.id) + '">' +
          '<td>' + poLink(p.id) + '</td>' +
          '<td>' + esc(p.date) + '</td>' +
          '<td>' + nccLink(p.nccKey) + '</td>' +
          '<td class="ow-ell" title="' + esc(p.content) + '">' + esc(p.content) + '</td>' +
          '<td class="num"><b>' + vnd(p.total) + '</b></td>' +
          '<td>' + esc(p.due) + '</td>' +
          '<td>' + warnDat(p) + '</td>' +
          '<td>' + statusBadge(p) + '</td>' +
          '<td><div style="display:flex;gap:5px;flex-wrap:wrap">' +
            '<button class="ow-btn-sm" data-act="view" data-no-interact="true">Xem</button>' +
            '<button class="ow-btn-sm pri" data-act="recv" data-no-interact="true"><i data-lucide="package-plus" style="width:12px;height:12px"></i> Nhận hàng</button>' +
            '<button class="ow-btn-sm" data-act="print" data-no-interact="true"><i data-lucide="printer" style="width:12px;height:12px"></i> In PO</button>' +
          '</div></td></tr>';
      }).join('');
    } else {
      document.getElementById('poThead').innerHTML =
        '<tr><th>Mã PO</th><th>Nhà cung cấp</th><th>Nội dung</th><th class="num">Giá trị</th><th>Ngày nhận</th>' +
        '<th class="num">SL nhận/đặt</th><th>Phiếu nhập</th><th class="num">Đã trả / Còn nợ</th><th>Giao nhận</th><th style="width:210px">Thao tác</th></tr>';
      html = rows.map(function (p) {
        var recv = p.lines.reduce(function (s, l) { return s + (l.recvQty || 0); }, 0);
        var order = p.lines.reduce(function (s, l) { return s + l.qty; }, 0);
        var paid = C.paidOf(p), debt = C.debtOf(p);
        return '<tr class="ow-row" data-po="' + esc(p.id) + '">' +
          '<td>' + poLink(p.id) + '</td>' +
          '<td>' + nccLink(p.nccKey) + '</td>' +
          '<td class="ow-ell" title="' + esc(p.content) + '">' + esc(p.content) + '</td>' +
          '<td class="num"><b>' + vnd(p.total) + '</b></td>' +
          '<td>' + esc(p.recvDate || '—') + '</td>' +
          '<td class="num">' + num2(recv) + ' / ' + num2(order) + ' ' + esc(p.lines[0].unit) + '</td>' +
          '<td>' + pnkLink(p.pnkId) + '</td>' +
          '<td class="num">' + gon(paid) + ' / <b style="color:' + (debt > 0 ? C.RED : C.GREEN) + '">' + (debt > 0 ? gon(debt) : 'Đã tất toán') + '</b></td>' +
          '<td>' + warnNhap(p) + '</td>' +
          '<td><div style="display:flex;gap:5px;flex-wrap:wrap">' +
            '<button class="ow-btn-sm" data-act="view" data-no-interact="true">Xem</button>' +
            (debt > 0
              ? '<button class="ow-btn-sm ok" data-act="pay" data-no-interact="true"><i data-lucide="banknote" style="width:12px;height:12px"></i> Trả tiền cho nhà cung cấp</button>'
              : '<button class="ow-btn-sm" data-act="print" data-no-interact="true"><i data-lucide="printer" style="width:12px;height:12px"></i> In PO</button>') +
          '</div></td></tr>';
      }).join('');
    }
    document.getElementById('poBody').innerHTML = html ||
      '<tr><td colspan="10" style="text-align:center;padding:26px;color:var(--ash)">Không có PO nào khớp bộ lọc.</td></tr>';
    if (window.lucide) lucide.createIcons();
  }

  function renderAll() { renderKpi(); renderTabs(); renderTable(); }

  /* ---------- Drawer bản ghi PO ---------- */
  function itemsTable(p, showRecv) {
    return '<div class="ow-gh"><i data-lucide="list" style="width:12px;height:12px"></i> Dòng hàng</div>' +
      '<table class="ow-it"><thead><tr><th>Mã NVL</th><th>Tên vật tư</th><th>ĐVT</th><th class="r">SL đặt</th>' +
      (showRecv ? '<th class="r">SL nhận</th><th>Số lô</th>' : '') +
      '<th class="r">Đơn giá</th><th class="r">Thành tiền</th></tr></thead><tbody>' +
      p.lines.map(function (l) {
        return '<tr><td><b>' + esc(l.code) + '</b></td><td>' + esc(l.name) + '</td><td>' + esc(l.unit) + '</td>' +
          '<td class="r">' + num2(l.qty) + '</td>' +
          (showRecv ? '<td class="r"' + ((l.recvQty || 0) < l.qty ? ' style="color:' + C.RED + ';font-weight:700"' : '') + '>' + num2(l.recvQty || 0) + '</td><td>' + esc(l.lot || '—') + '</td>' : '') +
          '<td class="r">' + vnd(l.price) + '</td><td class="r"><b>' + vnd(l.amount) + '</b></td></tr>';
      }).join('') +
      '<tr><td colspan="' + (showRecv ? 7 : 5) + '" class="r"><b>TỔNG GIÁ TRỊ PO</b></td><td class="r"><b style="color:var(--rust)">' + vnd(p.total) + '</b></td></tr>' +
      '</tbody></table>';
  }
  function payTable(p) {
    if (!p.payments.length) return '';
    return '<div class="ow-gh"><i data-lucide="receipt" style="width:12px;height:12px"></i> Phiếu chi đã lập</div>' +
      '<table class="ow-it"><thead><tr><th>Số phiếu</th><th>Ngày chi</th><th>Hình thức</th><th>Tài khoản</th><th class="r">Số tiền</th><th></th></tr></thead><tbody>' +
      p.payments.map(function (x) {
        return '<tr><td>' + pcLink(x.id) + '</td><td>' + esc(x.date) + '</td>' +
          '<td>' + (x.method === 'tm' ? 'Tiền mặt' : 'Chuyển khoản') + '</td><td>' + esc(x.account || '—') + '</td>' +
          '<td class="r"><b>' + vnd(x.amount) + '</b></td>' +
          '<td><button class="ow-btn-sm" data-pcprev="' + esc(x.id) + '" data-po="' + esc(p.id) + '" data-no-interact="true">Xem trước phiếu chi</button></td></tr>';
      }).join('') + '</tbody></table>';
  }

  function openPO(id) {
    var p = C.getPO(id);
    if (!p) { C.toast('Không tìm thấy PO <b>' + esc(id) + '</b>', 'warning'); return; }
    var n = C.ncc(p.nccKey) || {};
    var recvd = p.status === 'đã nhập';
    var paid = C.paidOf(p), debt = C.debtOf(p), late = C.lateDays(p);
    var groups = [
      { title: 'Thông tin chung', icon: 'file-text', fields: [
        { key: 'date', label: 'Ngày đặt hàng', val: p.date, edit: true },
        { key: 'ncc', label: 'Nhà cung cấp', val: nccLink(p.nccKey) },
        { key: 'content', label: 'Nội dung mua', val: esc(p.content), edit: true, wide: true },
        { key: 'src', label: 'Nguồn đề xuất', val: esc(p.src || '—') },
        { key: 'status', label: 'Trạng thái', val: statusBadge(p) },
        { key: 'note', label: 'Ghi chú', val: esc(p.note || '—'), edit: true, type: 'textarea', wide: true, raw: p.note || '' }
      ] },
      { title: 'Thương mại & thanh toán', icon: 'wallet', fields: [
        { key: 'total', label: 'Giá trị PO', val: '<span style="color:var(--rust)">' + vnd(p.total) + '</span>' },
        { key: 'payTerm', label: 'Điều khoản thanh toán', val: esc(p.payTerm), edit: true },
        { key: 'payDue', label: 'Hạn thanh toán', val: recvd ? esc(p.payDue) : 'Sau khi nhận hàng' },
        { key: 'paid', label: 'Đã trả', val: vnd(paid) },
        { key: 'debt', label: 'Còn nợ', val: debt > 0 ? '<span style="color:' + C.RED + '">' + vnd(debt) + '</span>' : '<span style="color:' + C.GREEN + '">Đã tất toán</span>' },
        { key: 'lai', label: 'Lãi chậm trả ước', val: C.interest(p) > 0 ? '<span style="color:' + C.RED + '">' + vnd(C.interest(p)) + ' · quá hạn ' + C.payOverdue(p) + ' ngày</span>' : '—' }
      ] },
      { title: 'Tiến độ giao nhận', icon: 'truck', fields: [
        { key: 'due', label: 'Ngày hẹn giao', val: esc(p.due), edit: true },
        { key: 'recvDate', label: 'Ngày nhận thực tế', val: esc(p.recvDate || 'Chưa nhận') },
        { key: 'late', label: late > 0 ? 'Trễ giao' : 'Chênh lệch hẹn giao', val: late > 0 ? '<span style="color:' + C.RED + '">Trễ ' + late + ' ngày · phạt ' + vnd(C.penalty(p)) + '</span>' : (recvd ? '<span style="color:' + C.GREEN + '">Sớm ' + (-late) + ' ngày</span>' : 'Còn ' + C.daysLeft(p.due) + ' ngày') },
        { key: 'pnk', label: 'Phiếu nhập kho', val: pnkLink(p.pnkId) },
        { key: 'lead', label: 'Thời gian giao TB của NCC', val: esc(n.lead || '—') },
        { key: 'lh', label: 'Người liên hệ NCC', val: esc((n.lh || '—') + ' · ' + (n.sdt || '')) }
      ] }
    ];
    var acts = '';
    if (!recvd) acts += '<button class="btn btn-primary" data-dact="recv" data-no-interact="true"><i data-lucide="package-plus" style="width:14px;height:14px"></i> Nhận hàng</button>';
    if (recvd && debt > 0) acts += '<button class="btn btn-primary" data-dact="pay" data-no-interact="true"><i data-lucide="banknote" style="width:14px;height:14px"></i> + Trả tiền cho nhà cung cấp</button>';
    acts += '<button class="btn btn-secondary" data-dact="prev" data-no-interact="true"><i data-lucide="eye" style="width:14px;height:14px"></i> Xem trước</button>';
    acts += '<button class="btn btn-secondary" data-dact="print" data-no-interact="true"><i data-lucide="printer" style="width:14px;height:14px"></i> In PO</button>';

    var ov = C.openDrawer({
      cat: 'Đơn đặt hàng mua — PO', id: p.id, status: recvd ? 'Đã nhập kho' : (late > 0 ? 'Trễ giao ' + late + ' ngày' : 'Chờ giao'),
      sub: esc(C.nccName(p.nccKey)) + ' · ' + esc(p.content) + ' · <b>' + vnd(p.total) + '</b>',
      groups: groups,
      itemsHtml: itemsTable(p, recvd) + payTable(p),
      actionsHtml: acts,
      onPrint: function () { printPO(p.id); },
      onSave: function (v) {
        p.date = v.date || p.date;
        p.content = v.content || p.content;
        p.note = v.note != null ? v.note : p.note;
        p.payTerm = v.payTerm || p.payTerm;
        p.due = v.due || p.due;
        C.savePO();
        C.closeDrawer();
        renderAll();
        C.toast('Đã lưu thay đổi cho ' + poLink(p.id), 'success');
        setTimeout(function () { openPO(p.id); }, 220);
      }
    });
    ov.addEventListener('click', function (e) {
      var t = e.target.closest('[data-dact]');
      if (t) {
        e.stopPropagation();
        var a = t.getAttribute('data-dact');
        if (a === 'recv') return openReceive(p.id);
        if (a === 'pay') return openPay(p.id);
        if (a === 'prev' || a === 'print') return printPO(p.id);
      }
      var pc = e.target.closest('[data-pcprev]');
      if (pc) { e.stopPropagation(); printPC(p.id, pc.getAttribute('data-pcprev')); }
    });
  }

  /* ---------- Bản in PO chuẩn ---------- */
  function printPO(id) {
    var p = C.getPO(id); if (!p) return;
    var n = C.ncc(p.nccKey) || {};
    var vat = Math.round(p.total * 0.08);
    var body = C.docHead() +
      '<div class="pdoc"><div class="pdoc-title">ĐƠN ĐẶT HÀNG</div>' +
      '<div class="pdoc-sub">Số: ' + esc(p.id) + ' · Purchase Order · Ngày ' + esc(p.date) + '</div>' +
      '<table class="pdoc-rows">' +
        '<tr><td>Bên mua</td><td><b>CÔNG TY CỔ PHẦN THƯƠNG MẠI OWIN</b> — MST 0109541582<br/>Nhà máy: Số 8 Giá Ngự, Xâm Xuyên, Thường Tín, TP Hà Nội</td></tr>' +
        '<tr><td>Bên bán (nhà cung cấp)</td><td><b>' + esc(n.ten || '') + '</b> — MST ' + esc(n.mst || '') + '<br/>' + esc(n.dc || '') + '</td></tr>' +
        '<tr><td>Người liên hệ</td><td>' + esc(n.lh || '') + ' · ' + esc(n.sdt || '') + ' · ' + esc(n.mail || '') + '</td></tr>' +
        '<tr><td>Nội dung mua</td><td>' + esc(p.content) + '</td></tr>' +
        '<tr><td>Ngày hẹn giao</td><td><b>' + esc(p.due) + '</b></td></tr>' +
        '<tr><td>Điều khoản thanh toán</td><td>' + esc(p.payTerm) + '</td></tr>' +
      '</table>' +
      '<table class="pdoc-items"><thead><tr><th>TT</th><th>Mã vật tư</th><th>Tên vật tư — quy cách</th><th>ĐVT</th><th class="r">Số lượng</th><th class="r">Đơn giá</th><th class="r">Thành tiền</th></tr></thead><tbody>' +
      p.lines.map(function (l, i) {
        return '<tr><td class="c">' + (i + 1) + '</td><td>' + esc(l.code) + '</td><td>' + esc(l.name) + '</td><td class="c">' + esc(l.unit) + '</td>' +
          '<td class="r">' + num2(l.qty) + '</td><td class="r">' + fmt(l.price) + '</td><td class="r">' + fmt(l.amount) + '</td></tr>';
      }).join('') +
      '<tr><td colspan="6" class="r"><b>Cộng tiền hàng</b></td><td class="r"><b>' + fmt(p.total) + '</b></td></tr>' +
      '<tr><td colspan="6" class="r">Thuế GTGT 8%</td><td class="r">' + fmt(vat) + '</td></tr>' +
      '<tr><td colspan="6" class="r"><b>TỔNG THANH TOÁN</b></td><td class="r"><b>' + fmt(p.total + vat) + '</b></td></tr>' +
      '</tbody></table>' +
      '<div class="pdoc-tot">Bằng chữ: <b>' + C.words(p.total + vat) + '</b></div>' +
      '<div class="pdoc-note"><b>ĐIỀU KHOẢN GIAO NHẬN.</b> Bên bán giao hàng tại nhà máy Owin (Số 8 Giá Ngự, Xâm Xuyên, Thường Tín) trước ' +
        esc(p.due) + '. Hàng phải có phiếu giao kèm số lô. Chậm giao mỗi ngày chịu phạt 0,135% giá trị đơn, tối đa 8%.<br/>' +
        '<b>ĐIỀU KHOẢN THANH TOÁN.</b> ' + esc(p.payTerm) + '. Thanh toán bằng chuyển khoản; bên bán xuất hoá đơn GTGT ngay khi giao hàng.<br/>' +
        '<b>ĐIỀU KHOẢN CHẤT LƯỢNG.</b> Nhôm thanh phải kèm CO/CQ 6063-T5; sai lệch kích thước ≤2mm, độ dày lớp anod ≥15µm, độ phẳng ≤1,5mm/m. ' +
        'Kính phải có chứng nhận kính an toàn theo QCVN 16:2023/BXD. Hàng không đạt KCS nhôm kính được trả lại, chi phí vận chuyển do bên bán chịu.</div>' +
      C.sign('ĐẠI DIỆN BÊN MUA', 'ĐẠI DIỆN BÊN BÁN') +
      '</div>';
    C.preview('Đơn đặt hàng ' + p.id, body);
  }

  /* ---------- Bản in Phiếu chi 02-TT ---------- */
  function printPC(poId, pcId, draft) {
    var p = C.getPO(poId); if (!p) return;
    var n = C.ncc(p.nccKey) || {};
    var pay = draft || (p.payments || []).filter(function (x) { return x.id === pcId; })[0];
    if (!pay) return;
    var body = C.docHead() +
      '<div class="pdoc">' +
      '<div style="text-align:right;font-size:11px;color:#55524a">Mẫu số 02-TT<br/>(Ban hành theo Thông tư 200/2014/TT-BTC)</div>' +
      '<div class="pdoc-title">PHIẾU CHI</div>' +
      '<div class="pdoc-sub">Số: ' + esc(pay.id) + ' · Ngày ' + esc(pay.date) + '</div>' +
      '<table class="pdoc-rows">' +
        '<tr><td>Họ tên người nhận tiền</td><td><b>' + esc(n.ten || '') + '</b> (' + esc(n.lh || '') + ')</td></tr>' +
        '<tr><td>Địa chỉ</td><td>' + esc(n.dc || '') + ' — MST ' + esc(n.mst || '') + '</td></tr>' +
        '<tr><td>Lý do chi</td><td>Thanh toán đơn đặt hàng <b>' + esc(p.id) + '</b> — ' + esc(p.content) + '</td></tr>' +
        '<tr><td>Số tiền</td><td><b>' + fmt(pay.amount) + ' ₫</b></td></tr>' +
        '<tr><td>Bằng chữ</td><td><b>' + C.words(pay.amount) + '</b></td></tr>' +
        '<tr><td>Hình thức thanh toán</td><td>' + (pay.method === 'tm' ? 'Tiền mặt' : 'Chuyển khoản') + (pay.account ? ' · ' + esc(pay.account) : '') + '</td></tr>' +
        '<tr><td>Kèm theo</td><td>01 đơn đặt hàng ' + esc(p.id) + ' · 01 phiếu nhập kho ' + esc(p.pnkId || '—') + ' · hoá đơn GTGT của nhà cung cấp</td></tr>' +
      '</table>' +
      '<div class="pdoc-note">Đã nhận đủ số tiền (viết bằng chữ): ' + C.words(pay.amount) + '</div>' +
      '<div class="pdoc-sign">' +
        '<div><b>GIÁM ĐỐC</b><i>(Ký, họ tên, đóng dấu)</i><div class="sp"></div></div>' +
        '<div><b>KẾ TOÁN TRƯỞNG</b><i>(Ký, họ tên)</i><div class="sp"></div></div>' +
        '<div><b>THỦ QUỸ</b><i>(Ký, họ tên)</i><div class="sp"></div></div>' +
        '<div><b>NGƯỜI NHẬN TIỀN</b><i>(Ký, họ tên)</i><div class="sp"></div></div>' +
      '</div></div>';
    C.preview('Phiếu chi ' + pay.id, body);
  }

  /* ---------- Modal nhận hàng ---------- */
  function openReceive(id) {
    var p = C.getPO(id); if (!p) return;
    var body = '<div class="ow-wide">' +
      '<div class="t-caption mb-3">Nhập <b>số lượng thực nhận</b> và <b>số lô</b> cho từng dòng hàng. Khi lưu, hệ thống ghi <b>phiếu nhập kho</b> và <b>tăng tồn NVL</b> tương ứng.</div>' +
      '<div class="ow-mrow mb-3">' +
        '<label><span>Ngày nhận hàng</span><input class="input" id="rcDate" value="' + esc(C.TODAY) + '"></label>' +
        '<label><span>Người giao / xe</span><input class="input" id="rcNote" placeholder="VD: Xe 29H-123.45 — A. Hùng"></label>' +
      '</div>' +
      '<table class="ow-it"><thead><tr><th>Mã NVL</th><th>Tên vật tư</th><th class="r">SL đặt</th><th class="r" style="width:120px">SL thực nhận</th><th style="width:150px">Số lô</th></tr></thead><tbody>' +
      p.lines.map(function (l, i) {
        return '<tr><td><b>' + esc(l.code) + '</b></td><td>' + esc(l.name) + '</td>' +
          '<td class="r">' + num2(l.qty) + ' ' + esc(l.unit) + '</td>' +
          '<td class="r"><input class="input" type="number" min="0" step="0.01" value="' + l.qty + '" data-rc="' + i + '" data-no-interact="true" style="text-align:right;padding:5px 8px"></td>' +
          '<td><input class="input" value="LO-' + esc(p.nccKey.slice(0, 2).toUpperCase()) + '-' + esc(C.TODAY.slice(0, 2) + C.TODAY.slice(3, 5)) + '" data-rclot="' + i + '" data-no-interact="true" style="padding:5px 8px"></td></tr>';
      }).join('') + '</tbody></table></div>';
    window.ERPInteract.showModal({
      title: 'Nhận hàng — ' + p.id + ' · ' + C.nccName(p.nccKey),
      body: body, primaryText: 'Ghi phiếu nhập kho', secondaryText: 'Huỷ',
      onPrimary: function () {
        var lines = p.lines.map(function (l, i) {
          var q = document.querySelector('[data-rc="' + i + '"]');
          var lot = document.querySelector('[data-rclot="' + i + '"]');
          return { code: l.code, recvQty: q ? Number(q.value) : l.qty, lot: lot ? lot.value : '' };
        });
        var d = (document.getElementById('rcDate') || {}).value || C.TODAY;
        var nt = (document.getElementById('rcNote') || {}).value || '';
        var res = C.receivePO(p.id, { lines: lines, date: d, note: nt });
        if (!res.ok) {
          C.toast(res.message || 'Không ghi được phiếu nhập kho', 'warning');
          return false;
        }
        C.closeAllDrawers();
        VIEW = 'nhap';
        renderAll();
        C.toast('Đã nhập kho ' + poLink(p.id) + ' — phiếu nhập <a href="05-kho.html?pnk=' + encodeURIComponent(res.pnk.id) + '" class="lnk">' + esc(res.pnk.id) + '</a> · tồn NVL đã tăng', 'success', 6500);
        return true;
      }
    });
    if (window.lucide) lucide.createIcons();
  }

  /* ---------- Modal trả tiền NCC ---------- */
  function openPay(id) {
    var p = C.getPO(id); if (!p) return;
    var debt = C.debtOf(p);
    var body = '<div class="ow-wide">' +
      '<div class="t-caption mb-3">PO <b>' + esc(p.id) + '</b> · ' + esc(C.nccName(p.nccKey)) + ' · giá trị <b>' + vnd(p.total) + '</b> · đã trả <b>' + vnd(C.paidOf(p)) + '</b> · ' +
        'còn nợ <b style="color:' + C.RED + '">' + vnd(debt) + '</b>' + (C.payOverdue(p) > 0 ? ' · <span style="color:' + C.RED + '">quá hạn ' + C.payOverdue(p) + ' ngày</span>' : '') + '</div>' +
      '<div class="ow-mrow mb-3">' +
        '<label><span>Số tiền trả (₫)</span><input class="input" type="number" id="pyAmt" value="' + debt + '" min="0" max="' + debt + '"></label>' +
        '<label><span>Ngày chi</span><input class="input" id="pyDate" value="' + esc(C.TODAY) + '"></label>' +
        '<label><span>Hình thức</span><select class="input" id="pyMethod"><option value="ck">Chuyển khoản</option><option value="tm">Tiền mặt</option></select></label>' +
        '<label><span>Tài khoản chi</span><select class="input" id="pyAcc">' +
          '<option>MB 0988837389 — CTCP TM OWIN</option>' +
          '<option>Vietcombank 0561000123456 — CTCP TM OWIN</option>' +
          '<option>Quỹ tiền mặt nhà máy</option></select></label>' +
      '</div>' +
      '<button class="btn btn-secondary" id="pyPrev" data-no-interact="true" style="min-height:36px"><i data-lucide="eye" style="width:14px;height:14px"></i> Xem trước phiếu chi (mẫu 02-TT)</button>' +
      '</div>';
    window.ERPInteract.showModal({
      title: '+ Trả tiền cho nhà cung cấp — ' + p.id,
      body: body, primaryText: 'Tạo phiếu chi', secondaryText: 'Huỷ',
      onPrimary: function () {
        var res = C.payPO(p.id, {
          amount: (document.getElementById('pyAmt') || {}).value,
          date: (document.getElementById('pyDate') || {}).value,
          method: (document.getElementById('pyMethod') || {}).value,
          account: (document.getElementById('pyAcc') || {}).value
        });
        if (!res.ok) { C.toast(res.message, 'warning'); return false; }
        C.closeAllDrawers();
        renderAll();
        C.toast('Đã tạo phiếu chi ' + pcLink(res.pay.id) + ' · ' + vnd(res.pay.amount) + ' trả ' + esc(C.nccName(p.nccKey)) + ' — bấm để mở', 'success', 6500);
        return true;
      }
    });
    var btn = document.getElementById('pyPrev');
    if (btn) btn.addEventListener('click', function (e) {
      e.preventDefault(); e.stopPropagation();
      printPC(p.id, null, {
        id: 'PC-' + (new Date()).getFullYear() + '-XXX (dự thảo)',
        date: (document.getElementById('pyDate') || {}).value || C.TODAY,
        amount: Number((document.getElementById('pyAmt') || {}).value) || 0,
        method: (document.getElementById('pyMethod') || {}).value,
        account: (document.getElementById('pyAcc') || {}).value
      });
    });
    if (window.lucide) lucide.createIcons();
  }

  /* ---------- Tạo PO thủ công ---------- */
  window.owOpenCreatePO = function () {
    var body = '<div class="ow-wide"><div class="ow-mrow mb-3">' +
      '<label><span>Nhà cung cấp</span><select class="input" id="cpNcc">' +
        C.NCC.map(function (n) { return '<option value="' + esc(n.key) + '">' + esc(n.ten) + '</option>'; }).join('') + '</select></label>' +
      '<label><span>Vật tư</span><select class="input" id="cpMat">' +
        C.MAT.map(function (m) { return '<option value="' + esc(m.code) + '">' + esc(m.name) + ' (' + esc(m.unit) + ')</option>'; }).join('') + '</select></label>' +
      '<label><span>Số lượng</span><input class="input" type="number" id="cpQty" value="1000" min="1"></label>' +
      '<label><span>Ngày hẹn giao</span><input class="input" id="cpDue" value="' + esc(C.addDays(C.TODAY, 10)) + '"></label>' +
      '<label style="grid-column:1/-1"><span>Ghi chú</span><input class="input" id="cpNote" placeholder="VD: Bù phôi cho LSX-0340"></label>' +
      '</div></div>';
    window.ERPInteract.showModal({
      title: 'Tạo đơn đặt hàng mua (PO)', body: body, primaryText: 'Tạo PO', secondaryText: 'Huỷ',
      onPrimary: function () {
        var code = (document.getElementById('cpMat') || {}).value;
        var m = C.mat(code);
        var qty = Number((document.getElementById('cpQty') || {}).value) || 0;
        if (qty <= 0) { C.toast('Số lượng phải lớn hơn 0', 'warning'); return false; }
        var rec = C.createPO({
          nccKey: (document.getElementById('cpNcc') || {}).value,
          content: m.name, due: (document.getElementById('cpDue') || {}).value,
          note: (document.getElementById('cpNote') || {}).value, src: 'Tạo thủ công tại màn Mua hàng',
          lines: [{ code: m.code, name: m.name, unit: m.unit, qty: qty, price: m.price }]
        });
        VIEW = 'dat';
        renderAll();
        C.toast('Đã tạo ' + poLink(rec.id) + ' · ' + vnd(rec.total) + ' — bấm để mở', 'success', 6000);
        return true;
      }
    });
    if (window.lucide) lucide.createIcons();
  };

  /* ---------- Sự kiện ---------- */
  document.addEventListener('erp:ready', function () {
    renderAll();

    document.getElementById('poTabs').addEventListener('click', function (e) {
      var t = e.target.closest('[data-poview]');
      if (!t) return;
      e.preventDefault(); e.stopPropagation();
      VIEW = t.getAttribute('data-poview');
      renderTabs(); renderTable();
      if (window.lucide) lucide.createIcons();
    });

    var s = document.getElementById('poSearch');
    if (s) s.addEventListener('input', function () { Q = s.value.trim(); renderTable(); });

    document.getElementById('poBody').addEventListener('click', function (e) {
      var tr = e.target.closest('tr[data-po]');
      if (!tr) return;
      var id = tr.getAttribute('data-po');
      var b = e.target.closest('[data-act]');
      if (b) {
        e.preventDefault(); e.stopPropagation();
        var a = b.getAttribute('data-act');
        if (a === 'recv') return openReceive(id);
        if (a === 'pay') return openPay(id);
        if (a === 'print') return printPO(id);
        return openPO(id);
      }
      if (e.target.closest('a.lnk')) return;
      openPO(id);
    });

    /* mã bản ghi trong trang → mở đúng drawer dữ liệu (chạy trước ERPPeek) */
    C.bindLnk([
      { re: /13-mua-hang\.html\?po=([^&#]+)/, fn: openPO },
      { re: /05-kho\.html\?pnk=([^&#]+)/, fn: C.openPNK },
      { re: /21-nha-cung-cap\.html\?ncc=([^&#]+)/, fn: C.goTo('21-nha-cung-cap.html', 'ncc') }
    ]);

    var q = C.qp('po');
    if (q && C.getPO(q)) { VIEW = C.getPO(q).status === 'đã nhập' ? 'nhap' : 'dat'; renderAll(); setTimeout(function () { openPO(q); }, 260); }
    if (C.qp('poview') === 'nhap') { VIEW = 'nhap'; renderAll(); }
  });
})();

</script>
</body>
</html>
