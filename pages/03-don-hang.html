          <label class="oc-f" style="display:flex;flex-direction:column;gap:4px"><span style="font-family:var(--ff-mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--ash)">Người nộp tiền *</span>
            <input class="input" id="rcPayer" value="${esc(o.contact || o.customer)}" /></label>
          <label class="oc-f" style="grid-column:1/-1;display:flex;flex-direction:column;gap:4px"><span style="font-family:var(--ff-mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--ash)">Lý do nộp</span>
            <input class="input" id="rcReason" value="Thu tiền đơn hàng ${esc(o.id)} · ${esc(o.product)}" /></label>
          <div style="grid-column:1/-1"><button class="btn btn-secondary btn-sm" id="rcPreview" data-no-interact="true"><i data-lucide="eye" style="width:13px;height:13px"></i> Xem trước phiếu thu</button></div>
        </div>`,
      primaryText: 'Tạo phiếu thu',
      secondaryText: 'Huỷ',
      onPrimary: function () {
        const amount = Number($('#rcAmount').value) || 0;
        const payer = ($('#rcPayer').value || '').trim();
        if (amount <= 0) { ERPInteract.showToast('Số tiền phải lớn hơn 0', 'warning', 2400); return false; }
        if (!payer) { ERPInteract.showToast('Chưa nhập <b>người nộp tiền</b>', 'warning', 2400); return false; }
        if (!window.ERPCash || !ERPCash.create) { ERPInteract.showToast('Chưa nạp được sổ quỹ kế toán', 'error', 2600); return false; }
        const rec = ERPCash.create({
          kind: 'thu', date: $('#rcDate').value || today, type: 'thu_banhang',
          partner: o.customer, method: $('#rcMethod').value, amount: amount,
          reason: $('#rcReason').value || ('Thu tiền đơn hàng ' + o.id),
          createdBy: 'Kế toán viên', ref: o.id
        });
        o.payment = o.payment || {};
        o.payment.paid = (o.payment.paid || 0) + amount;
        o.payment.remaining = Math.max(0, (o.payment.total || o.value || 0) - o.payment.paid);
        if (o.payment.remaining === 0) { o.payment.overdue = false; o.alert = { kind: 'good', text: 'Đã thu đủ · đúng hạn' }; }
        (o.activity = o.activity || []).unshift({ time: 'hôm nay', by: 'Kế toán',
          action: 'Lập phiếu thu <b>' + esc(rec.id) + '</b> · ' + fmt(amount) + '₫' });
        if (window.QuoteStore && QuoteStore.getOrder(o.id)) QuoteStore.save();
        ERPInteract.showToast('Đã tạo <a href="15-ke-toan.html?pt=' + encodeURIComponent(rec.id) +
          '" class="lnk" style="color:inherit;text-decoration:underline;font-weight:600">' + esc(rec.id) +
          '</a> — bấm để mở', 'success', 6500);
        renderList();
        openDrawer(o.id);
      }
    });
    const pv = $('#rcPreview');
    if (pv) pv.addEventListener('click', function () {
      ERPPrint.preview({
        title: 'Xem trước phiếu thu · đơn ' + o.id,
        printTitle: 'Phieu-thu-' + o.id,
        bodyHtml: receiptPrintBody({
          id: (window.ERPCash && ERPCash.nextId) ? ERPCash.nextId('thu') : '',
          date: $('#rcDate').value || today, payer: $('#rcPayer').value, partner: o.customer,
          reason: $('#rcReason').value, method: $('#rcMethod').value,
          amount: Number($('#rcAmount').value) || 0, ref: o.id
        })
      });
    });
    if (window.lucide) lucide.createIcons();
  }

  function opMakeLSX(o) {
    const pending = orderLsxRows(o).filter(r => !r.existing);

    const lsx = QuoteStore.createLSXCombined(pending.map(r => ({ orderId: r.orderId, code: r.code, name: r.name, qty: r.qty, order: r.order })));
    if (!lsx) { ERPInteract.showToast('Không phát được lệnh sản xuất', 'warning', 2600); return; }
    ERPInteract.showToast('Đã phát lệnh sản xuất <a href="06-lsx-phieu-cong-nghe.html?id=' + encodeURIComponent(lsx.id) +
      '" class="lnk" style="color:inherit;text-decoration:underline;font-weight:600">' + esc(lsx.id) + '</a> — bấm để mở', 'success', 6500);
    renderList();
    openDrawer(o.id);
  }

  const FLD_SET = {
    customer: (o, v) => { o.customer = v; },
    contact: (o, v) => { o.contact = v; },
    mst: (o, v) => { o.mst = v; },
    salesRep: (o, v) => { o.salesRep = v; },
    site: (o, v) => { o.site = v; },
    deposit: (o, v) => { o.payment = o.payment || {}; o.payment.deposit = Number(v) || 0; },
    paymentTerm: (o, v) => { o.payment = o.payment || {}; o.payment.paymentTerm = v; },
    dueDate: (o, v) => { const d = fromInputDate(v); o.dueDate = d || v; o.deliveryDate = o.dueDate; },

  function wireRecordEdit(o) {
    const sec = $('#drRec'); if (!sec) return;
    const bar = sec.querySelector('[data-rec="bar"]');
    const editBtn = sec.querySelector('[data-rec="edit"]');
    function toEdit() {
      sec.querySelectorAll('[data-fld]').forEach(f => {
        const kind = f.dataset.kind || 'text', raw = f.dataset.raw || '';
        const fv = f.querySelector('.fv');
        f.dataset.disp = fv.innerHTML;
        if (kind === 'select') {
          const opts = JSON.parse(f.dataset.opts || '[]');
          fv.innerHTML = '<select class="fe" data-no-interact="true">' + opts.map(op =>
            '<option value="' + esc(op.v) + '"' + (op.v === raw ? ' selected' : '') + '>' + esc(op.t) + '</option>').join('') + '</select>';
        } else {
          fv.innerHTML = '<input class="fe" type="' + (kind === 'number' ? 'number' : (kind === 'date' ? 'date' : 'text')) +
            '" value="' + esc(raw) + '" data-no-interact="true" />';
        }
      });
      bar.hidden = false; editBtn.hidden = true;
    }
    function toView() { openDrawer(o.id); }
    function save() {
      sec.querySelectorAll('[data-fld]').forEach(f => {
        const k = f.dataset.fld, el = f.querySelector('.fe');
        if (el && FLD_SET[k]) FLD_SET[k](o, el.value);
      });
      const tot = o.payment ? (o.payment.total || o.value || 0) : (o.value || 0);
      if (o.payment) o.payment.remaining = Math.max(0, tot - (o.payment.paid || 0));
      if (window.QuoteStore && QuoteStore.getOrder(o.id)) QuoteStore.save();
      ERPInteract.showToast('Đã lưu thay đổi đơn <b>' + esc(o.id) + '</b>', 'success', 2600);
      renderList();
      openDrawer(o.id);
    }
    if (editBtn) editBtn.addEventListener('click', toEdit);
    sec.querySelector('[data-rec="cancel"]').addEventListener('click', toView);
    sec.querySelector('[data-rec="save"]').addEventListener('click', save);
  }

    (function () {
      const rez = $('#drawerResizer'), dr = $('#orderDrawer'), panel = $('#drawerPanel');
      if (!rez || !dr || !panel) return;
      let startX = 0, startW = 0, dragging = false;
      const clampW = w => Math.max(380, Math.min(w, Math.round(window.innerWidth * 0.94), 1100));
      rez.addEventListener('pointerdown', e => {
        dragging = true; startX = e.clientX; startW = panel.getBoundingClientRect().width;
        try { rez.setPointerCapture(e.pointerId); } catch (err) {}
        rez.classList.add('dragging'); document.body.style.userSelect = 'none';
        e.preventDefault();
      });
      rez.addEventListener('pointermove', e => {
        if (!dragging) return;
        dr.style.setProperty('--drawer-w', clampW(startW + (startX - e.clientX)) + 'px');
      });
      const end = () => { if (!dragging) return; dragging = false; rez.classList.remove('dragging'); document.body.style.userSelect = ''; };
      rez.addEventListener('pointerup', end);
      rez.addEventListener('pointercancel', end);
      // double-click → reset về mặc định
      rez.addEventListener('dblclick', () => dr.style.setProperty('--drawer-w', '560px'));
    })();

    // ESC → close

    $('#btnExport').addEventListener('click', () => {
      ERPInteract.showToast('Đang xuất Excel <b>142 đơn hàng</b>...', 'info', 1500);
      setTimeout(() => {
        ERPInteract.showToast('<b>donhang-thang5-2026.xlsx</b> · đã sẵn sàng tải', 'success', 2800);
      }, 1200);
    });

    // Mở màn hình lên đơn chuyên nghiệp; sau khi tạo → refresh list + mở drawer đơn mới
    function afterOrderCreated(order) {
      renderList();
      const row = document.querySelector('.ol-row[data-id="' + order.id + '"]');
      if (row) {
        document.querySelectorAll('.ol-row').forEach(r => r.classList.remove('active'));
        row.classList.add('active');
        row.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
      openDrawer(order.id);
    }
    window.__afterOrderCreated = afterOrderCreated;

    $('#btnCreate').addEventListener('click', () => {
      openOrderComposer({ onCreated: afterOrderCreated });
    });

    // Lên đơn thẳng từ một hợp đồng: 03-don-hang.html?newhd=<HĐ>
    const newHd = new URLSearchParams(location.search).get('newhd');
    if (newHd) openOrderComposer({ contractId: newHd, onCreated: afterOrderCreated });
  });
</script>
</body>
</html>
